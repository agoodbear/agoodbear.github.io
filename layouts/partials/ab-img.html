{{- /* 卡片縮圖：優先用 static/images/about-thumbs/<檔名>.webp（720px），沒有才退回原圖。參數 dict src alt */ -}}
{{- $name := replaceRE `^.*/([^/]+)\.[a-zA-Z]+$` "$1" .src -}}
{{- $thumb := printf "/images/about-thumbs/%s.webp" $name -}}
<img src="{{ cond (fileExists (printf "static%s" $thumb)) $thumb .src | relURL }}" alt="{{ .alt }}" loading="lazy" decoding="async">
