{{/* 註腳浮框：滑到內文上標數字，顯示該註腳的原文段落與出處。內容直接取自文末註腳，不另存一份。
     桌機滑鼠移上去就開，點數字照舊跳到文末；手機點一下開框，框內有連結到文末。 */}}
<style>
  .fn-pop {
    position: absolute; z-index: 9000; box-sizing: border-box;
    width: min(460px, calc(100vw - 24px)); max-height: min(55vh, 420px); overflow-y: auto;
    padding: 14px 16px; background: #ffffff; color: #2b3a45;
    border: 1px solid #c9d8e3; border-radius: 8px; box-shadow: 0 8px 28px rgba(39, 74, 99, .18);
    font-size: 14px; line-height: 1.6; text-align: left; overflow-wrap: anywhere;
  }
  .fn-pop[hidden] { display: none; }
  .fn-pop__quote { margin: 0 0 10px; padding: 8px 12px; background: #e8f1f7; border-left: 3px solid #274a63; border-radius: 0 4px 4px 0; }
  .fn-pop__label { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 700; color: #274a63; }
  .fn-pop__source { margin: 0; font-size: 13px; color: #4a5a66; }
  .fn-pop__source a { color: #b22800; }
  .fn-pop__jump { display: inline-block; margin-top: 8px; font-size: 13px; color: #b22800; }
  /* 參考資料收合：文章放 <div class="refs-slot"></div> 才啟用，註腳整份搬進 <details> */
  .refs-all { margin: 1.2rem 0 2rem; border: 1px solid #e7e0d6; border-radius: 8px; background: #faf7f2; }
  .refs-all > summary { cursor: pointer; padding: .7rem 1rem; font-size: 15px; font-weight: 600; color: #b22800; list-style: none; }
  .refs-all > summary::-webkit-details-marker { display: none; }
  .refs-all > summary::before { content: "▸ "; }
  .refs-all[open] > summary::before { content: "▾ "; }
  .refs-all .footnotes { margin: 0 !important; padding: .2rem 1rem 1rem !important; border-top: none !important; }
  .refs-all .footnotes::before { content: none !important; }
  .refs-sources li li { font-size: 14px; line-height: 1.55; }
</style>
<script>
(function () {
  var slot = document.querySelector('.refs-slot');
  var fn = document.querySelector('.article-body .footnotes, .footnotes');
  if (!slot || !fn) return;
  var n = fn.querySelectorAll('ol > li').length;
  var d = document.createElement('details');
  d.className = 'refs-all';
  d.innerHTML = '<summary>展開全部' + n + '條註腳（每一條都附原文）</summary>';
  d.appendChild(fn);
  slot.replaceWith(d);
  function openFor(hash) {
    if (!hash || hash.indexOf('#fn') !== 0) return;
    var el = document.getElementById(decodeURIComponent(hash.slice(1)));
    if (el && d.contains(el) && !d.open) { d.open = true; el.scrollIntoView(); }
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#fn"]');
    if (a && !a.classList.contains('footnote-backref')) openFor(a.getAttribute('href'));
  }, true);
  window.addEventListener('hashchange', function () { openFor(location.hash); });
  openFor(location.hash);
})();
</script>
<script>
(function () {
  var refs = document.querySelectorAll('a.footnote-ref');
  if (!refs.length) return;
  var touch = window.matchMedia('(hover: none)').matches;
  var pop = document.createElement('div');
  pop.className = 'fn-pop'; pop.hidden = true; pop.setAttribute('role', 'tooltip');
  document.body.appendChild(pop);
  var current = null, hideTimer = null, showTimer = null;

  function content(hash) {
    var li = document.getElementById(decodeURIComponent(hash.slice(1)));
    if (!li) return '';
    var box = li.cloneNode(true);
    box.querySelectorAll('.footnote-backref').forEach(function (a) { a.remove(); });
    var html = box.innerHTML.replace(/<\/?p>/g, '').replace(/(&nbsp;|&#160;| |\s)+$/, '').trim();
    var at = html.search(/原文[：:]/);
    var out = '';
    var source = html;
    if (at >= 0) {
      source = html.slice(0, at).trim();
      var quote = html.slice(at + 3).trim();
      out += '<blockquote class="fn-pop__quote"><span class="fn-pop__label">原文</span>' + quote + '</blockquote>';
    }
    out += '<p class="fn-pop__source">' + source + '</p>';
    if (touch) out += '<a class="fn-pop__jump" href="' + hash + '">到參考文獻 ↓</a>';
    return out;
  }

  function place(a) {
    var r = a.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight, gap = 8;
    var left = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, document.documentElement.clientWidth - w - 12));
    var above = r.top - h - gap >= 8;
    var top = above ? r.top - h - gap : r.bottom + gap;
    pop.style.left = (left + window.scrollX) + 'px';
    pop.style.top = (top + window.scrollY) + 'px';
  }

  function show(a) {
    clearTimeout(hideTimer);
    var html = content(a.getAttribute('href'));
    if (!html) return;
    pop.innerHTML = html; pop.hidden = false; pop.scrollTop = 0;
    current = a; place(a);
  }
  function hide() { clearTimeout(showTimer); pop.hidden = true; current = null; }
  function hideSoon() { clearTimeout(showTimer); clearTimeout(hideTimer); hideTimer = setTimeout(hide, 220); }

  refs.forEach(function (a) {
    if (touch) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        if (current === a) hide(); else show(a);
      });
    } else {
      a.addEventListener('mouseenter', function () {
        clearTimeout(hideTimer); clearTimeout(showTimer);
        showTimer = setTimeout(function () { show(a); }, 120);
      });
      a.addEventListener('mouseleave', hideSoon);
      a.addEventListener('focus', function () { show(a); });
      a.addEventListener('blur', hideSoon);
      a.addEventListener('click', hide);
    }
  });
  pop.addEventListener('mouseenter', function () { clearTimeout(hideTimer); });
  pop.addEventListener('mouseleave', hideSoon);
  pop.addEventListener('click', function (e) { if (e.target.closest('.fn-pop__jump')) hide(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hide(); });
  document.addEventListener('click', function (e) {
    if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('a.footnote-ref')) hide();
  });
  window.addEventListener('resize', hide);
})();
</script>
