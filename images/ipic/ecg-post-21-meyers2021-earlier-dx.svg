<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',-apple-system,sans-serif">
  <title>專家判讀比 STEMI 準則早多久（Meyers 等人 2021）</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs>
  <rect x="0" y="0" width="820" height="520" rx="12" fill="#fbfaf6"/>
  <text x="28" y="42" font-size="21" font-weight="700" fill="#1f3a5f">專家判讀比 STEMI 準則早多久（Meyers 等人 2021）</text>
  <rect x="210" y="64" width="400" height="52" rx="8" fill="#1f3a5f" fill-opacity=".1" stroke="#1f3a5f" stroke-width="1.6"/>
  <text x="410.0" y="95.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a5f">265 例 OMI</text>
  <line x1="410" y1="116" x2="410" y2="152" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
  <text x="422" y="139.0" font-size="13" fill="#4b5563">專家用 OMI findings，比 STEMI 典範更早診斷</text>
  <rect x="210" y="156" width="400" height="60" rx="8" fill="#0f766e" fill-opacity=".08" stroke="#0f766e" stroke-width="1.6"/>
  <text x="410.0" y="191.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">146 例（55%）</text>
  <rect x="622" y="146" width="186" height="80" rx="8" fill="#6b7280" fill-opacity=".06" stroke="#6b7280" stroke-width="1.6"/>
  <text x="715.0" y="169.0" text-anchor="middle" font-size="14" fill="#1f2937">120 例：一直沒達</text>
  <text x="715.0" y="191.0" text-anchor="middle" font-size="14" fill="#1f2937">STEMI 標準</text>
  <text x="715.0" y="213.0" text-anchor="middle" font-size="14" fill="#1f2937">26 例：後來才達標</text>
  <line x1="410" y1="216" x2="410" y2="252" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
  <text x="422" y="239.0" font-size="13" fill="#4b5563">扣掉提前超過 24 小時的 20 例（心導管拖了一兩天才做）</text>
  <rect x="210" y="256" width="400" height="52" rx="8" fill="#0f766e" fill-opacity=".08" stroke="#0f766e" stroke-width="1.6"/>
  <text x="410.0" y="287.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">納入計算：126 例</text>
  <line x1="410" y1="308" x2="410" y2="344" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="110" y="348" width="600" height="110" rx="8" fill="#c2410c" fill-opacity=".08" stroke="#c2410c" stroke-width="1.6"/>
  <text x="410.0" y="386.0" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">提前時間中位數 1.3 小時</text>
  <text x="410.0" y="408.0" text-anchor="middle" font-size="14" fill="#1f2937">（IQR 0.58–2.76 小時）</text>
  <text x="410.0" y="430.0" text-anchor="middle" font-size="14" fill="#1f2937">平均提前 3.00 小時（95% CI 2.69–3.31）</text>
  <text x="28" y="500" text-anchor="start" font-size="13" fill="#6b7280">資料來源：Meyers HP, et al. Int J Cardiol Heart Vasc. 2021;33:100767（正文 4.3 節）。本站依原文數字自繪。</text>
</svg>
