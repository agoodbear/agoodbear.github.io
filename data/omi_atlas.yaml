- id: std
  name: 根據STD判斷
  slide: 369
  findings:
  - id: stdmax-v1-4
    name: STDmaxV1-4 indicative of Post.OMI
    short: STDmaxV1-4
    part: Part 2 根據STD判斷
    look: '**STD的最大值落在V1–V4** ➜ STDmaxV1-4。posterior OMI until proven otherwise。**去做posterior leads**。'
    look_src: RA4iu_gsZ
    leads:
    - V1–V4
    artery: LCx／OM（posterior OMI）
    artery_src: 2isDP4MBW
    pitfall: V7–V9陰性不能拿來rule out：Dr. Smith's ECG Blog一個由Pendell Meyers撰寫的case，STD最大在V2–V4、整張ECG完全沒有STE，拉了posterior leads只有「a hint of STE」，多數心臟科醫師會說不符合posterior leads criteria，CAG卻是proximal LCx完全阻塞。另外兩點：V1–V4的STD偶爾其實是subendocardial ischemia，posterior leads如果也是STD，就比較像subendocardial ischemia；RBBB／RVH／LVH／LBBB／ventricular paced rhythm／digoxin effect／hypokalemia都可能造成非缺血性的STD，看ST-T之前要先確認QRS沒有藏著能解釋它的東西。
    pitfall_src: roam:igzjHlx6B, roam:SbdFLwUXe, roam:q85c-d_fE; url:https://drsmithsecgblog.com/a-man-in-his-early-40s-with-chest-pain-2/; pmid:15561323; url:https://litfl.com/st-segment-ecg-library/; url:https://drsmithsecgblog.com/a-50-something-male-with-dyspnea/
    points:
    - text: STDmaxV1-4：precordial leads（V1–V6）出現ischemic STD，而且STD的最大值落在V1、V2、V3、V4其中一個lead（相對於V5、V6）。重點不在「深不深」，而在「哪一個lead最深」。
      src: roam:BblisH-zu
    - text: 機轉是向量：posterior OMI是對面（後壁）transmural STE的鏡像，投影成V1–V4的STD；diffuse subendocardial ischemia的STD合力則指向心尖（V5、V6）。看到STDmaxV1-4，先當posterior OMI，直到證明不是為止。
      src: roam:BblisH-zu; url:https://drsmithsecgblog.com/a-man-in-his-early-40s-with-chest-pain-2/; pmid:34775811
    - text: 前胸QRS／T wave有四個加分線索：horizontal（非upsloping）的STD、V2的dominant R wave（R/S ratio > 1）、broad R wave（> 30 ms）、V1–V4的upright T wave，這些都是後壁「鏡像」翻過來的樣子。可以用Ken Grauer的「Mirror Test」：把V1–V3上下翻轉，看它變不變成一張你認得出的anterior STEMI。
      src: roam:BblisH-zu; url:https://litfl.com/posterior-myocardial-infarction-ecg-library/; url:https://www.ncbi.nlm.nih.gov/books/NBK553168/
    criteria:
    - text: Ischemic STDmaxV1-4對OMI的specificity是97%（Meyers 2021，808位高風險ACS病人）。論文標題寫的是「of Any Amplitude」：這個finding沒有「要多深才算」的門檻，不到1 mm的STDmaxV1-4同樣具有specificity。
      src:
      - pmid:34775811
      - url:https://rebelem.com/posterior-occlusion-myocardial-infarctions-and-stdmaxv1-4/
      verified: ①原始研究：PubMed 34775811 摘要（2026-09-14 efetch）逐字「Among 808 patients, there were 265 OMIs」「Suspected ischemic STDmaxV1-4 had 97% specificity and 37% sensitivity for OMI」「Of the 99 OMIs detected by STDmaxV1-4, 34% had <1 mm ST-segment depression」；esummary 標題「Ischemic ST-Segment Depression Maximal in V1-V4 (Versus V5-V6) of Any Amplitude Is Specific for Occlusion Myocardial Infarction (Versus Nonocclusive Ischemia).」②獨立來源：REBEL EM〈Posterior Occlusion Myocardial Infarctions and STDmaxV1-4〉（Salim Rezaie，2021-12-09，curl 原文）作者自己的整理逐字「808 patients with 3421 ECGs」「This number is increased to 97% for suspected ischemic STDmaxV1-4」「Even <1.0mm of STDmaxV1-4 is specific for OMI」。97%、808、<1 mm 兩條路徑對上。原草稿的『34% <1 mm』只有原始研究一條路徑（REBEL EM 沒有 34%；Dr. Smith's ECG Blog 那頁是論文作者群自己的轉載，不算獨立），已拿掉。
    - text: V7–V9 posterior leads的STE門檻是0.5 mm，不是1 mm。AHA/ACCF/HRS 2009的ECG判讀標準化建議明寫V7–V9的門檻是0.05 mV（0.5 mm）；最新的UDMI第五版（2026）只說要用V7–V9的STE來確認，沒有再給數字，所以實務上照用，但別說成「最新指引規定」。
      src:
      - pmid:19228819
      - url:https://litfl.com/posterior-myocardial-infarction-ecg-library/
      - url:https://www.ncbi.nlm.nih.gov/books/NBK553168/
      - roam:atN2-ziyu
      verified: '①原始定義文件：Wagner GS, et al. AHA/ACCF/HRS Recommendations Part VI: Acute Ischemia/Infarction. Circulation 2009;119(10):e262-70（PMID 19228819 esummary 核對；全文讀 Bear 本機 PDF ~/Downloads/01_醫學論文_ECG研究/CIRCULATIONAHA.108.191098.pdf）逐字「5. For men and women, the threshold value for abnormal J-point elevation in V7 through V9 should be 0.05 mV (0.5 mm).」②獨立來源：LITFL〈Posterior Myocardial Infarction〉（Burns & Buttner，2024-10-23，WebFetch）逐字「only 0.5 mm of ST elevation is required to make the diagnosis of posterior MI」；③StatPearls〈Posterior Myocardial Infarction〉（Lizzo JM, Shams P，last update 2025-12-01，curl 原文）逐字「Upward ST-segment displacement exceeding 0.5 mm in a single lead indicates posterior ischemia」。UDMI 第五版：讀本機全文 udmi5-research/source-text/udmi5.txt，V7 只出現在「confirmed by ST-segment elevation in the posterior leads V7 to V9」一句，沒有門檻。原草稿『男性<40歲用≥1 mm』：AHA 2009 對 V7–V9 寫的是 For men and women、沒有年齡例外；UDMI 第四版原文本次打不開（ahajournals／JACC 回 403，EHJ 頁面沒有該段），無法雙證，已拿掉。'
    slides:
    - src: /images/omi/stdmax-v1-4-slide-2025-170.webp
      width: 1600
      height: 1200
      alt: 投影片上方是JAHA論文首頁截圖，標題「Ischemic ST-Segment Depression Maximal in V1–V4 (Versus V5–V6) of Any Amplitude Is Specific for Occlusion Myocardial Infarction (Versus Nonocclusive Ischemia)」，作者列 Meyers 等13人；黃色螢光標記CONCLUSIONS段落寫97%／96% specificity；下方淺藍色色塊是我自己整理的中文重點「ACS症狀患者、在V1~V4有Maximal STD出現、首要考慮有OMI(97%的specificity)」
