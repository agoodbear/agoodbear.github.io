  - id: precordial-swirl
    name: Precordial Swirl
    new2025: true
    part: Part 2 根據STD判斷
    look: '**V1（±V2）的STE或不成比例的直立T＋V5–V6 reciprocal STD／TWI** ➜ Precordial Swirl。想proximal LAD／septal branch之前的阻塞。'
    look_src: V8-X6BPY1
    leads:
    - V1（±V2）
    - V5–V6
    artery: Proximal LAD／septal阻塞
    artery_src: igQ-k9i3Y
    pitfall: '**有LVH或BBB就不能用這條。** 它跟STDmaxV1-4看的是同一組lead，一個往下壓、一個往上翹，**方向搞反，血管也會猜反。**'
    pitfall_src: V8-X6BPY1, jLQCuvTjt, GK26CKmn3（Step 3〈第一組:方向剛好相反〉對照表）
    points:
    - text: 2025年正式發表的定義（Goss et al.）：STE and/or hyperacute T waves in V1-V2, with reciprocal STD and/or TWI in V5-V6，形成precordial leads上的「順時針漩渦」。機轉：LAD若塞在first septal perforator（S1）之前，連整片中膈都是transmural缺血；中膈偏右前方，injury向量投影到V1（還有aVR）是STE，心尖與側壁在向量另一端，V5、V6拿到reciprocal STD。
      src: roam:3YgNmzz-A, roam:KnFJnBav5; pmid:40319770; url:https://drsmithsecgblog.com/precordial-swirl-20-cases-of-swirl-or/
    - text: 怎麼看：先看V1，ST-T是不是「長得不像它該長的樣子」（不成比例的STE／不成比例的直立T／coved shape）；論文給的量化版是V2的T波振幅÷S波振幅 > 0.40。再看V6：有沒有STD？那個STD是不是「水平貨架」而不是LVH strain那種「斜下」？T wave是不是還直立著（典型swirl是平的STD配直立T）？
      src: roam:CuciTQ3b6, roam:0m2G94e1E; pmid:40319770; url:https://emcrit.org/ibcc/ecg/
    - text: 跟[aVR STE + multiple leads STD](/omi/#avr-ste)（diffuse subendocardial ischemia）的鑑別，比誰高就好：aVR STE ＞ V1 STE，想subendocardial ischemia／left main／3-vessel；V1 STE ＞ aVR STE，想precordial swirl／塞在S1之前的proximal LAD。這是判讀小技巧、不是有sens/spec數字的判準，當線索用，不要當唯一理由。
      src: roam:wB-4PkgFa; url:https://emcrit.org/ibcc/ecg/
    criteria:
    - text: Goss 2025測試的其中一條定義（寬鬆版）：normal QRS（narrow QRS **且沒有LVH**）＋V5和/或V6有STD＋V1和/或V2有任何STE。「沒有LVH」是寫在定義裡的排除條件，不是文末的注意事項；共同作者Meyers在Dr. Smith's ECG Blog（2025-08-18）說，LVH與subendocardial ischemia是這個pattern最常見的兩個mimic。
      src:
      - pmid:40319770
      - url:https://drsmithsecgblog.com/a-man-in-his-60s-with-acute-chest-pain-is-this-precordial-swirl/
      - url:https://emcrit.org/ibcc/ecg/
      verified: 定義型判準（不含統計數字）。①原始研究：PubMed 40319770 摘要（2026-09-14 efetch）逐字「Precordial swirl pattern, defined as normal QRS (narrow QRS without LVH) with STD in V5 and/or V6 plus any STE in V1 and/or V2」，另一條定義為「When defined as a narrow QRS plus STD in V5/V6 plus T wave to S wave amplitude ratio > 0.40 in V2」。②共同作者 Pendell Meyers，Dr. Smith's ECG Blog〈A man in his 60s with acute chest pain. Is this precordial swirl?〉（2025-08-18，WebFetch）逐字「In our best rule in the publication, the rule we recommend using, LVH is an exclusion criteria (mimicker) of precordial swirl pattern.」「LVH and subendocardial ischemia are the two most common mimics of our precordial swirl pattern.」③獨立來源 IBCC〈ECG Guide〉（Josh Farkas，2026-05-07，curl 原文，引 PMID 40319770）逐字「[4] Absence of LVH.」「LVH is the most common entity to sort out.」。原草稿『論文的正式判準』：摘要裡作者測了兩條定義，這條是寬鬆版，已改寫；『作者特別強調』改為具名的共同作者 Meyers。
    slides:
    - src: /images/omi/precordial-swirl-slide-2025-226.webp
