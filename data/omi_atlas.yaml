      width: 1600
      height: 1200
      alt: 12導程心電圖，標題「50歲男性、胸痛到院」。左半I/II/III/aVR/aVL/aVF：III導程紅色向上箭頭標STE、aVL導程紅色向下箭頭標reciprocal STD，藍底文字「Inferior leads只有III有STE，合併aVL reciprocal STD change」。右半V1–V6：橘框圈住V1/V2，藍底文字「V1的ST高於V2」；V4/V5/V6各有紅色向下箭頭與綠色空心圈，藍底文字「STD in any of leads V4-V6 + upright or terminally positive T wave(V2沒有STD)」
      caption: 取自我 2025 年奇美住院醫師 ECG 教學投影片（slide 294）。心電圖出處：Emre Aslanger（@AslangerE）2022-05-07 在 X（Twitter）分享的病例；圖上的箭頭、框線與中文標註是我加的。
