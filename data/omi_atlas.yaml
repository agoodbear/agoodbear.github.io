  - id: avr-ste
    name: aVR STE + multiple leads STD
    part: Part 2 根據STD判斷
    look: '**有STE，而且在aVR**（＋multiple leads STD） ➜ 這是那個垃圾桶。裡面什麼都有，但sick的病人要Call CV一起討論。'
    look_src: vwnm0UgcZ, fdGf5FaPe
    leads:
    - aVR
    artery: 不是單一血管：Harhash 2019裡真正找到culprit occlusion的病人，沒有一位是left main或LAD；這個pattern反映的是diffuse subendocardial ischemia（供需失衡），已經確定是ACS之後，才偏向考慮left main／三條血管都爛／proximal LAD。
    artery_src: roam:2OcLf6YI2, roam:wAjIPClyI, roam:IKW0tQKWh; pmid:30639554; url:https://litfl.com/st-elevation-in-avr/
    pitfall: 看到aVR翹起來、STD一片，很容易反射性喊「left main，衝導管」：這是錯的。真正的left main完全阻塞如果aVR有STE，別的地方一定也有STE，是一張明顯的大範圍STEMI，不需要靠aVR提醒你；反過來，「只有aVR翹、其他全是STD」的ECG，正好在告訴你「這不是完全阻塞」。但也不能因此就不理它：這群病人住院死亡率很高，先矯正supply/demand的原因（心跳、血色素、血壓、血氧），再看STD有沒有回來。例外確實存在（有側枝循環的left main完全阻塞，ECG可以長成diffuse STD的樣子），所以胸痛refractory、血行動力學不穩、或STD裡藏著某個區域的STE時，要把「例外」拉回檯面。
    pitfall_src: roam:PNOnM0EWP, roam:nemQYrcxE, roam:ca14-cLoa, roam:Rh6WWOLQ7; url:https://drsmithsecgblog.com/how-does-acute-left-main-occlusion/; pmid:30639554
    points:
    - text: aVR STE本身就是一面鏡子：aVR底下沒有心室肌（Smith的說法）或對到basal septum（Mattu／LITFL的說法），兩派解剖說法不同，但結論一致，那個STE不是自己底下的血管塞住，而是別的地方一堆STD的鏡像。可以把aVR想成(−)aVR：I跟II有STD，數學上(−)aVR一定有STD，(+)aVR就一定有STE。
      src: roam:Qb7QB8V7J; url:https://drsmithsecgblog.com/does-ste-in-avr-indicate-acute-coronary/; url:https://litfl.com/st-elevation-in-avr/
    - text: 結論要放大講：aVR STE + diffuse STD，不是left main occlusion，也不是OMI，它是diffuse subendocardial ischemia（供需失衡）。真正100%左主幹阻塞的病人，通常來不及走到你面前：會走進急診、意識清楚、拿著這張ECG的病人，正是因為他的left main「還沒有完全塞住」。
      src: roam:LXAtsh3Xy, roam:xfCirYN6C
    - text: 這個pattern的死亡率很高，但機轉不是單一血管阻塞，是「整顆心臟供氧全面不足」：可能是ACS（left main insufficiency、三條血管都爛、proximal LAD），也可能根本不是ACS（sepsis、嚴重貧血、GI bleeding、hypoxia、SVT/AF RVR、hypovolemia、主動脈瓣狹窄、高血壓急症）。第一步不是打電話，是先找出並矯正supply/demand的原因；矯正完再照一張ECG，STD還在、病人還在痛（或胸痛refractory、血壓在掉），就要跟CV討論。
      src: roam:wAjIPClyI, roam:nemQYrcxE
    criteria:
    - text: STE-aVR + multilead STD的病人裡，只有10%找到被認為是culprit的coronary occlusion，而且這些病灶沒有一個是left main或LAD occlusion（Harhash 2019）。
      src:
      - pmid:30639554
      - url:https://litfl.com/st-elevation-in-avr/
      verified: ①原始研究：PubMed 30639554 摘要（2026-09-14 efetch）逐字「Coronary occlusion, thought to be culprit, was identified in only 8 patients (10%), and none of those lesions were left main or left anterior descending occlusions.」②獨立來源：LITFL〈ST Elevation in aVR〉（Burns & Buttner，2024-10-08，WebFetch；該句連結到 PMID 30639554）用自己的話寫「A 2019 single-centre retrospective analysis identified patients presenting with STE-aVR with multilead ST depression. Coronary occlusion was found only in 10% of patients, and none of these lesions were involving the LAD or left main coronary artery」。10% 與『沒有 LM／LAD』兩條路徑對上。原草稿括號『8/79做了導管的人』：摘要沒有明寫分母是 79、LITFL 也沒寫，屬推算，已拿掉。
    refs:
    - label: 'Harhash AA, Huang JJ, Reddy S, et al. aVR ST Segment Elevation: Acute STEMI or Not? Incidence of an Acute Coronary Occlusion. Am J Med. 2019 May;132(5):622-630. PMID 30639554.'
      url: https://pubmed.ncbi.nlm.nih.gov/30639554/
    - label: Dr. Smith's ECG Blog（Steve Smith）：Does ST Elevation in lead aVR indicate acute coronary occlusion?（2020-03-09）
      url: https://drsmithsecgblog.com/does-ste-in-avr-indicate-acute-coronary/
    - label: Dr. Smith's ECG Blog（Steve Smith、Pendell Meyers 合寫）：How does Acute Total Left Main Coronary occlusion present on the ECG?（2019-08-09）
      url: https://drsmithsecgblog.com/how-does-acute-left-main-occlusion/
    - label: LITFL：ST Elevation in aVR（last updated 2024-10-08）
      url: https://litfl.com/st-elevation-in-avr/
  - id: reciprocal-std
    name: Reciprocal STD change and/or TWI
    short: Reciprocal STD／TWI
    part: Part 2 根據STD判斷
    look: '**inferior或lateral的STD／TWI，跟某個STE對稱** ➜ Reciprocal STD / TWI。reciprocal change常常比STE本身更明顯。'
    look_src: OFA_s5KO8
    leads:
    - I／aVL
    - II／III／aVF
    leads_src: roam:yVD6K8QxC
    artery: 依對側面關係決定，不是單一血管：I／aVL的STD想inferior（II/III/aVF）；II／III／aVF的STD想high lateral（I/aVL）；V1–V4的STD想posterior（LCx／OM，見[STDmaxV1-4](/omi/#stdmax-v1-4)）；V5–V6的STD配V1 STE則想septal（proximal LAD，見[Precordial Swirl](/omi/#precordial-swirl)）。
    artery_src: roam:yVD6K8QxC, roam:2isDP4MBW, roam:IKW0tQKWh
    pitfall: T wave往下不等於TWI，更不等於reciprocal change。判斷關鍵是「比例」不是「方向」：QRS本身predominantly negative的lead，T wave跟著淺淺往下是正常的。LBBB／RBBB／paced rhythm／LVH strain／WPW這些QRS本身異常的ST-T改變是secondary repolarization change，不算reciprocal；其中LBBB與ventricular paced rhythm要改走modified Sgarbossa criteria。另外，reciprocal change的定義是「對面真的有東西」：如果翻遍12個lead都找不到任何STE或hyperacute T wave，那個STD比較可能是[aVR STE + multiple leads STD](/omi/#avr-ste)那一格的diffuse subendocardial ischemia，不是reciprocal。
    pitfall_src: roam:lDMbyPGqY; url:https://drsmithsecgblog.com/a-30-something-with-acute-chest-pain/; url:https://drsmithsecgblog.com/a-50-something-male-with-dyspnea/; atlas msc look_src LGDFoI5pO, eNmJFMC9P
    points:
    - text: 這個finding裡的STD本身不是答案，它是幫「另一個lead的subtle STE」作證的：一個subtle的STE，加上對側lead的reciprocal STD/TWI，就從「怪怪的」變成「diagnostic」。
      src: roam:NWcyEPMXG
    - text: 先記住兩件事（我自己slide上的話）：reciprocal change可能會在STE之前出現，也可能比STE更明顯。其中一個機轉是low voltage：QRS本來就矮的人，跟著QRS成比例的STE也會跟著不明顯，但reciprocal change的STD不受這個限制，反而可能更顯眼，所以在這種人身上，常常是先看到STD、才看到STE，那個STD是在替你指路。
      src: roam:QD39_QVar
    - text: 對側面關係要背起來：V1–V4的STD想後壁（posterior，見[STDmaxV1-4](/omi/#stdmax-v1-4)）；I／aVL的STD想下壁（inferior：II/III/aVF）；II／III／aVF的STD想高側壁（high lateral：I/aVL）；V5–V6的STD配V1 STE則想中膈（septal，見[Precordial Swirl](/omi/#precordial-swirl)）。lead III和aVL之間有「magical」的mirror-image關係：proximal LAD occlusion幾乎必有inferior leads的reciprocal STD，mid/distal LAD occlusion則不一定。
      src: roam:yVD6K8QxC, roam:fm6Edi93F; url:https://drsmithsecgblog.com/a-30-something-with-acute-chest-pain/; url:https://drsmithsecgblog.com/a-58-year-old-with-weakness-and-more/
    criteria:
    - text: Bischof 2016：154位inferior STEMI全部（100%）在aVL有某種程度的STD；STE很小、還不到STEMI criteria、但心導管證實有阻塞的subtle inferior STEMI（54位），也有91%在aVL有STD。
      src:
      - pmid:26542793
      - url:https://clinician.nejm.org/nejm-jw.NA40636
      - url:https://litfl.com/inferior-stemi-ecg-library/
      verified: ①原始研究：PubMed 26542793 摘要（2026-09-14 efetch）逐字「Of 154 inferior STEMI patients, 154 had some amount of ST depression in lead aVL (100%; confidence interval, 98%-100%)」「a third cohort of patients with subtle inferior STEMI (<1-mm STE with occluded artery on catheterization)」「there were 272 inferior MIs with coronary occlusion, of which 54 were "subtle." Of these, 49 had some ST depression in lead aVL」（49/54＝90.7%）。②獨立來源：NEJM Journal Watch〈Beware of ST Depression in ECG Lead aVL〉（Daniel J. Pallin，2016-02-26，WebFetch，全文公開）逐字「154 with inferior STEMI」「54 with subtle inferior STEMI」「Some degree (at least 0.25 mm) of ST depression in lead aVL was detected in 100% of patients with inferior STEMI, 0% with pericarditis, and 91% with subtle inferior STEMI.」③LITFL〈Inferior STEMI〉（Burns & Buttner，2024-10-08，WebFetch）逐字「91% of 'subtle' inferior STEMIs that do not meet STEMI criteria but show occlusion on PCI demonstrate ST depression in aVL」。154、100%、54、91% 都有兩條以上路徑對上。拿掉：272（只有原始研究）；原草稿『STE不到1 mm』（原始研究寫 <1-mm、Journal Watch 寫 ≤1-mm，兩邊不一致，改成不帶數字的描述）；『愈subtle愈可能是唯一線索』（研究沒有這個結論）。
    - text: 什麼不算reciprocal change：如果那個lead的QRS本身是predominantly negative（例如frontal plane axis很vertical時的aVL），T wave跟著淺淺地往下是正常變異，不是reciprocal change；真正的reciprocal TWI，會跟QRS的負向大小「不成比例地肥厚（disproportionately bulky）」。
      src:
      - url:https://drsmithsecgblog.com/a-30-something-with-acute-chest-pain/
      - roam:lDMbyPGqY
      verified: 定義型判準（不含統計數字），原始出處為 Ken Grauer 在 Dr. Smith's ECG Blog〈A 30-something with acute chest pain〉（Steve Smith，2024-10-03）的評論，本次 WebFetch 逐字「The T wave vector often follows closely behind the QRS vector」「when the QRS is predominantly negative in lead aVL — then the T wave in this lead may also be negative as a normal finding」「Contrast this normal amount of T wave inversion ... with the disproportionately 'bulky' T wave inversion」；該 case 的 frontal plane axis 為「+80 degrees」、「Coronaries were clean」。原草稿寫『STD/TWI的形狀』不成比例地肥厚，Grauer 原文講的是 T wave inversion，已改成 TWI。
    slides:
    - src: /images/omi/reciprocal-std-slide-2021-016.webp
      width: 1600
      height: 1200
      alt: 投影片標題「Reciprocal Change」，上半部淺藍色長條「先了解一些事實」，下方文字「Reciprocal change可能會在STE之前出現」「Reciprocal change有可能會比STE更明顯」，中間淺藍色細長條「重要分隔線」，下方大字「Reciprocal change的STD是良性」「但對側的STE是致命的」，全頁純文字無圖
      caption: 取自我 2021 年新光醫院住院醫師 ECG 教學投影片（slide 16）
      src_note: ~/Desktop/Claude Code專用檔/keynote-search/slides/dd600f69ed7/slide_016.png；crop=None
    refs:
    - label: Bischof JE, Worrall C, Thompson P, Marti D, Smith SW. ST depression in lead aVL differentiates inferior ST-elevation myocardial infarction from pericarditis. Am J Emerg Med. 2016 Feb;34(2):149-54. PMID 26542793.
      url: https://pubmed.ncbi.nlm.nih.gov/26542793/
