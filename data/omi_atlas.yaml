  - id: nttv1
    name: NTTV1
    full: New Tall T wave in V1
    part: Part 1（上）T波與U波
    look: '**V1的T wave比V6高** ➜ NTTV1'
    look_src: AJQnOMjwH
    leads:
    - V1
    - V6
    artery: LCx（posterior／inferobasal）
    artery_src: pmid:6833662（'common in patients with isolated left circumflex artery disease but is rare in those with isolated left anterior descending artery disease'）; url:https://drsmithsecgblog.com/is-there-evidence-of-omi-on-this-ecg/（Ken Grauer：'These findings confirm ongoing "precordial T wave imbalance" — and are highly correlated with a LCx "culprit". As noted by Drs. Singh and Smith — cardiac cath confirmed 100% proximal LCx occlusion.'）; roam:O_rTggIj5（機轉）
    pitfall: '**LVH是常見的假陽性**（HATW也一樣要防LVH，同一個病人兩個finding都要想到它）；Ken Grauer自己也提醒，V1高而直立的T wave有時只是repolarization variant或LV strain的鏡像。而且「V1的T wave本來就是倒的」這句話本身不完全對：V1的T wave正常可以是negative、flat或upright，**單看一張ECG說V1直立就有缺血是站不住的**。Dr. Smith 2012的原始研究（subtle anterior STEMI vs early repolarization）也寫明：upright T wave in V1、或V1的T wave大於V6，**did not provide important information**，他問的是anterior（LAD），NTTV1指向的多半是LCx，兩把尺不要混用。'
    pitfall_src: 'url:https://drsmithsecgblog.com/is-there-evidence-of-omi-on-this-ecg/（Grauer：''tall, upright T waves in lead V1 might not sometimes be the result of a repolarization variant or a mirror-image reflection of LV "strain" that can sometimes be seen in anterior leads''）; url:https://www.aliem.com/tall-t-wave-lead-v1/（NTTV1 causes 列出 ''LVH''）; url:https://drsmithsecgblog.com/a-case-of-misinterpreted-troponins-in/（Grauer PEARL #1：''The T wave in lead V1 may normally be negative, flat, or upright''）; pmid:22520989（''Upward concavity, upright T wave in V1 or T wave, in V1 greater than T wave in V6, and J-wave notching did not provide important information.''）; roam:ACZJiMwyr, roam:_WvOWVRQb, roam:xWne-FZfT, roam:nz7ngYQmp'
    points:
    - text: V1的T wave比V6高，尤其是**新出現的**（New Upright T wave，或TV1>TV6）➜ 要懷疑CAD或acute ischemia。機轉是**後壁(posterior/inferobasal)缺血或損傷的鏡像**，所以跟**LCx**綁在一起，而不是跟LAD。
      src: roam:O_rTggIj5, roam:uVsmXqSUU, roam:fIhM_G15d, roam:TpUDeL895
    - text: 判斷方法：**同一張ECG上V1和V6的T wave互相比**，不是背絕對高度（幾mm）；有舊片一定要調出來比，NTTV1的「N」就是New，沒有舊片只有TTV1，證據力差一截。
      src: roam:hGozq_sek, roam:JMhHj214O
    - text: NTTV1不是拿來下診斷的，是拿來**把你的眼睛叫醒**的：看到它要回頭找V2–V3有沒有STD、R wave有沒有變高、去把舊片挖出來、**再做一張ECG**，而不是馬上Call CV man。
      src: roam:Z08_A--kI, roam:CH-dU9uHs, roam:SDRd6-S-T
    criteria:
    - text: Manno 1983（**218位**因胸痛接受診斷性心導管的病患）：upright T wave in V1（以**0.15 mV**為判定切點）在**isolated LCx disease常見、在isolated LAD disease少見**；多條血管疾病中，只要LCx有病，upright T wave in V1也常見。
      src:
      - pmid:6833662
      - url:https://www.aliem.com/tall-t-wave-lead-v1/
      - url:https://drsmithsecgblog.com/is-there-evidence-of-omi-on-this-ecg/
      verified: '① 原始研究 PubMed abstract（PMID 6833662，2026-09-14 eutils efetch）：「the 12 lead electrocardiograms of 218 patients undergoing diagnostic catheterization for the evaluation of chest pain were reviewed」「An upright T wave in lead V1 (greater than or equal to 0.15 mV)」「an upright T wave in precordial lead V1 is common in patients with isolated left circumflex artery disease but is rare in those with isolated left anterior descending artery disease. Similarly, in patients with multivessel disease, an upright T wave is common when the left circumflex artery is diseased.」② 獨立第二來源 ALiEM《EKG Subtlety: Tall T-Wave in Lead V1》（Salim Rezaie，2026-09-14 curl 原頁）：「84.4% of patients in a series of 218 patients undergoing cardiac catheterization had severe CAD (>75% stenosis)」「In patients with one vessel disease and NTTV1 >0.15mV, the lesion was: Left circumflex artery disease (44%) Right coronary artery (22%) Left anterior descending artery (2%)」。③ LCx 關聯另見 Ken Grauer（Dr. Smith''s ECG Blog《Is there evidence of OMI on this ECG?》，curl 原頁）：「has been associated with recent OMI from a LCx culprit artery ( See Manno et al: JACC 1:1213, 1983」。註：ALiEM 寫「>0.15mV」、原文為「≥0.15 mV」，兩者只有切點數值一致，故正文只寫數值不寫不等號。'
