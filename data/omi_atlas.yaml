      width: 1600
      height: 1200
      alt: 投影片「異常U wave」左右對照：左側淺藍底「Prominent U wave」，V3、V4 各有一個黑色箭頭指向 T 波後方向上的 U wave；右側米黃底「Inverted U wave」，V3、V4、V5 各有一個粉紅色箭頭指向 T 波後方向下的 U wave。
      caption: 取自我 2025 年奇美住院醫師 ECG 教學投影片（slide 132）：Prominent U wave 與 Inverted U wave 對照。右側心電圖出自 Girish MP, et al. Indian Pacing Electrophysiol J. 2005（Figure 1A），左側心電圖取自網路上的公開病例。
