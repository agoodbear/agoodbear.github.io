  - id: aslanger
    name: Aslanger's pattern
    part: Part 3（下）不相鄰導程
    look: '**只有lead III有STE（II／aVF沒有）＋V4–V6 STD，但V2沒有STD** ➜ Aslanger''s pattern。inferior OMI疊在多血管疾病上。'
    look_src: fCKyX5TzO
    leads:
    - III
    - V4–V6
    - V2
    pitfall: 下壁三個導程一起抬就不算了，那是單純的inferior MI。
    pitfall_src: fCKyX5TzO
    points:
    - text: '**三條criteria**（Aslanger 2020原文）：①lead III有STE、但其他inferior leads（II、aVF）沒有 ②V4–V6任一lead有STD、T wave positive或terminally positive，而且**V2沒有STD** ③**lead V1的ST比V2高**。機轉是inferior MI的ST向量加上多血管病變subendocardial ischemia的ST向量，合力偏右，II和aVF被抵銷，只剩lead III還看得到STE（「兩台風扇對吹，中間的II和aVF被抵銷」）。'
      src: roam:zzE36TnWj, roam:cDXep6WOf, roam:qKHgCxFwl, roam:0EjjKGXAs, roam:2R0a5AVoA; pmid:32526537; url:https://drsmithsecgblog.com/typical-chest-pain-would-you-activate/
    - text: Ken Grauer補充版：唯一有明顯STE的leads可能只剩**III、aVR、V1**三個；lead I的reciprocal STD可能比aVL更明顯（因為ST向量偏右）。
      src: roam:HZq8f--qO, roam:uS-o_ZXJM; url:https://www.ekgblog.com/2026/05/ecg-blog-529-should-prompt-cath-be-done.html
    - text: 兩個發生率分母不同，別搞混：在**NSTEMI族群**中佔**6.3%**；原文另說**13.3%的inferior MI**可能以這個pattern表現。這群人的住院與一年死亡率跟inferior STEMI相近（統計上沒有差異），卻可能因為被貼上NSTEMI標籤而拿不到emergent revascularization：這才是Aslanger's pattern真正的臨床意義。
      src: roam:obRKTeZJX, roam:vr6j-VG8h, roam:CZVklh1nf; pmid:32526537; url:https://litfl.com/aslanger-pattern/
    criteria:
    - text: ①lead III有任何STE、但其他inferior leads沒有；②V4–V6任一lead有STD（但V2沒有），且T wave positive或terminally positive；③lead V1的ST高於V2。
      src:
      - pmid:32526537
      - pmid:36601361
      verified: 2026-09-14 自行核對，定義型判準、無數字。⚠️草稿說這三條是從 PubMed 摘要逐字核對——不實，efetch 摘要裡沒有這三條。①原始研究全文（Bear Zotero 內 Elsevier PDF，J Electrocardiol 2020;61:41-46）Methods 逐字：『The prespecified ECG pattern was defined as (1) any STE in DIII but not in other inferior leads, (2) STD in any of leads V4 to V6 (but not in V2) with a positive or terminally positive T-wave, (3) ST in lead V1 higher than ST in V2.』②獨立作者群 Miyauchi E, et al. Cureus 2023;15(1):e33227（PMID 36601361，PMC9805815 全文）逐字：『The Aslanger pattern was defined as (1) any ST elevation in lead III, but not in other inferior leads, (2) ST depression in any of the leads V4 to V6 (but not in V2) with a positive or terminally positive T-wave, and (3) ST in lead V1 is higher than ST in V2.』兩者一致。
    - text: 發生率：NSTEMI族群中6.3%、沒有MI的對照組0.5%；原文推估13.3%的inferior MI可能以這個pattern表現。死亡率：住院與一年死亡率跟inferior STEMI相近，沒有統計差異。
      src:
      - pmid:32526537
      - url:https://litfl.com/aslanger-pattern/
      verified: '2026-09-14。6.3%：PubMed 摘要逐字『observed in 6.3% (61/966) of the non-STEMI cohort』；LITFL《Aslanger Pattern: Another OMI?》（Robert Buttner、Mike Cadogan，WebFetch 兩次一致）逐字『The Aslanger Pattern was observed in 6.3% of NSTEMI patients』。0.5%：摘要『0.5% (5/1000) of no-MI patients』；LITFL『present in 0.5% of patients without acute MI』。13.3%：原始全文 Discussion（Zotero PDF）『Our data indicate that 13.3% of inferior MIs may present with this pattern and may be deprived of emergent revascularization therapy because of being incorrectly labeled as non-STEMI』；LITFL『13.3% of inferior MIs may present with Aslanger Pattern』。死亡率只留定性結論：摘要『they had a similar in-hospital (5% vs. 4%, respectively; P = 0.675) and one-year mortality compared to the patients with inferior STEMI』。拿掉的數字：61/966、5/1000（只有原始研究一份文件）；5% vs 4%、11% vs 8% 與 P 值（找不到獨立第二來源，而且原文摘要寫 P = 0.675、Table 2 寫 0.673，原文自己就不一致）。'
    slides:
