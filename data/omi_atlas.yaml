  - id: de-winter
    name: De Winter's T wave
    part: Part 3（上）LAD的三張臉
    look: '**V1–V6的J point STD＋upright, tall, symmetric T wave** ➜ de Winter''s T wave。這是LAD的anterior STEMI equivalent。'
    look_src: 2df-nPNdc
    leads:
    - V1–V6
    artery: proximal LAD（急性、正在塞）
    artery_src: a3XfJgPJX
    pitfall: V2-V3出現STD＋又高又大的T wave，別急著當de Winter：也可能是posterior wall MI剛通了（Post. Wellens' syndrome：後壁reperfusion的terminal TWI，鏡像到前胸導程就變成又高又大的upright T wave）。只侷限V2-V3先想後壁，影響的precordial leads比較多才想de Winter。T wave又高又尖，也別忘了排除高血鉀（de Winter原始報告裡，病人入院血鉀是正常的）。
    pitfall_src: AFiHqjJbm, FL3UVzJCP, 2CAzkcO0Y, sL-wkzAn1, m-e5krch8；血鉀正常：pmid:18987380 全文、url:https://drsmithsecgblog.com/hyperacute-t-waves/
    points:
    - text: de Winter＝富士山，但山腳先陷下去1-3 mm：J point的upsloping ST depression直接接進又高又對稱的T wave，是**急性、正在塞**的proximal LAD occlusion。
      src: roam:0DqslDKkj, roam:CDCCW8OeV, roam:a3XfJgPJX
    - text: de Winter和Wellens長得都在V2-V4，但一個是「現在進行式」（acute proximal LAD occlusion）、一個是「過去完成式」（sub-acute occlusion，塞過了、現在通了）。
      src: roam:a3XfJgPJX
    - text: 2022年ACC專家共識已把de Winter's sign列為STEMI equivalent。
      src: roam:dtLH_6DBA, pmid:36241466
    criteria:
    - text: precordial leads的J point出現upsloping ST depression，直接接進tall, symmetrical T wave。幅度有兩種寫法：de Winter 2008原始letter寫V1–V6「1–3 mm」；同團隊Verouden 2009與ACC 2022寫「>1 mm」。
      src:
      - pmid:18987380
      - url:https://www.ekgblog.com/2022/07/ecg-blog-319-qrs-alternans.html
      - url:https://drsmithsecgblog.com/hyperacute-t-waves/
      - pmid:19620137
      - pmid:36241466
      - url:https://litfl.com/de-winter-t-wave/
      verified: '1–3 mm：①原始研究 de Winter RJ, et al. N Engl J Med 2008;359:2071–2073 全文 p.2071（渲染圖親眼看）逐字「the ST segment showed a 1- to 3-mm upsloping ST-segment depression at the J point in leads V1 to V6 that continued into tall, positive symmetrical T waves.」②不同作者群：Ken Grauer, ECG Blog #319（curl 原頁）逐字「Typical deWinter T waves manifest 1-3 mm of upsloping J-point ST depression in at least a few leads, prior to continuing into tall, peaked T waves.」③不同作者群：Dr. Smith''s ECG Blog〈Hyperacute T waves〉（curl 原頁）逐字「1-3 mm of upsloping ST depression in leads V1 to V6 that continues into tall, positive symmetrical T waves」。>1 mm：④原始研究 Verouden NJ, et al. Heart 2009;95:1701–1706 全文 Results（p.1702，渲染圖確認是 >）逐字「We observed overt ST-segment depression at the J-point (>1 mm) with upsloping ST-segments continuing into tall, symmetrical T-waves in the precordial leads.」（abstract 寫「at least 1 mm」）⑤ACC 2022 Table 1 逐字「upsloping ST-segment depression >1 mm at the J-point in the precordial leads」⑥LITFL 逐字「Upsloping ST segment depression > 1mm at the J point in the precordial leads」。兩種寫法各自有原始研究＋不同作者群，照實並列。'
    - text: aVR常伴隨輕微的ST elevation。幅度各來源寫法不一致：de Winter 2008原始letter寫「多數病人1–2 mm」；同一團隊2009年較大的世代，以及ACC 2022，寫的幅度都比較小。
      src:
      - pmid:18987380
      - url:https://drsmithsecgblog.com/hyperacute-t-waves/
      - pmid:19620137
      - pmid:36241466
      verified: ①原始研究 de Winter 2008 全文 p.2071 逐字「In most patients there was a 1- to 2-mm ST-elevation in lead aVR」；Figure 1 圖說 p.2072 逐字「lead aVR shows slight ST-segment elevation in most cases.」②不同作者群：Dr. Smith's ECG Blog〈Hyperacute T waves〉逐字「with 1-2 mm ST elevation in aVR」。→ 1–2 mm 有原始研究＋獨立來源。③同團隊 Verouden 2009 全文逐字「included patients showed a mean J-point elevation of approximately 0.5 mm in lead aVR (fig 1)」；④ACC 2022 Table 1 逐字「0.5–1 mm ST-segment elevation may be seen in lead aVR」（LITFL 同寫「0.5mm – 1mm」）。0.5 mm 只有 Verouden 一份、0.5–1 mm 沒有原始研究，兩者都不符雙來源規則，所以公開文字只寫「比較小」，不寫這兩個數字。
    - text: 約2%，分母是anterior MI：de Winter 2008原始letter在1532位anterior MI病人中找到30位（2.0%）；同一團隊Verouden 2009在1890位因anterior MI接受LAD primary PCI的病人中找到35位（2%）。兩篇世代重疊，不是兩個獨立研究互相重現。
      src:
      - pmid:18987380
      - pmid:19620137
      - url:https://litfl.com/de-winter-t-wave/
      verified: ①原始研究 de Winter 2008 全文 p.2071（渲染圖親眼看）逐字「We recognized this characteristic ECG pattern in 30 of 1532 patients with anterior myocardial infarction (2.0%).」（資料來源同段逐字「Working from our primary database of percutaneous coronary interventions」）②不同作者群：LITFL〈De Winter T Wave〉逐字「They observed this ECG pattern in 30 / 1532 patients with acute LAD occlusions (2% of cases)」——數字相同，但把分母寫成 acute LAD occlusions，與原文 anterior myocardial infarction 不符（Dr. Smith's ECG Blog 也寫「2% of LAD occlusions」），公開文字照原文。③原始研究 Verouden 2009 abstract 逐字「Of 1890 patients who underwent primary PCI of the LAD artery, we could identify 35 patients (2%) with this distinct ECG pattern.」；全文逐字「a total of 1890 patients who underwent primary PCI for anterior myocardial infarction at our institution were recorded in the database」④LITFL 逐字「They found a de Winter ECG pattern in 35 / 1890 patients requiring PCI to the LAD (2% of cases).」⑤世代重疊：Verouden 2009 全文逐字「ECG pattern from other patients included in this cohort have been published previously.10」（ref 10＝de Winter 2008 NEJM）。
    slides:
    - src: /images/omi/de-winter-slide-2025-274.webp
      width: 1600
