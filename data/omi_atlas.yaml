  - id: tqrsd
    name: TQRSD
    full: Terminal QRS Distortion
    part: Part 3（上）LAD的三張臉
    look: V2或V3只要**同時**沒有S wave也沒有J wave ➜ 直接當OMI，不用算。
    look_src: yxC-ylCFX
    leads:
    - V2
    - V3
    artery: LAD
    artery_src: U8mnVq1zO（Part 3（上）：有TQRSD就別算了，直接當LAD occlusion處理）
    pitfall: TQRSD是4-variable formula的排除條件。**看到TQRSD不要算公式，直接當OMI處理。**
    pitfall_src: 1NbaRR_tl
    points:
    - text: TQRSD＝V2或V3任一個lead，S wave和J wave**兩個都不見了**。注意是「或」不是「和」：只要V2、V3任何一個lead同時沒有S wave又沒有J wave，就成立。
      src: roam:T3ic3u9kS, roam:8ZT1f4qe3
    - text: TQRSD是**rule-in工具，不是rule-out工具**。沒有TQRSD，一點都不代表不是OMI。
      src: roam:DG-pNPtuL
    criteria:
    - text: S wave＝R wave結束時，任何往下掉到PQ junction以下的偏折；J wave＝在J point、高於ST段水平的任何正向偏折（notching或slurring）。
      src:
      - pmid:27658331
      - url:https://www.thebottomline.org.uk/summaries/terminal-qrs-distortion/
      verified: ①原始研究：Lee DH, Walsh B, Smith SW. Am J Emerg Med 2016;34:2182–2185 期刊全文（2.4 Data collection and processing，p.2183）逐字「The presence of an S wave was defined as any deflection at the end of the R wave that dipped below the level of the PQ junction.」「J waves were defined as any positive deflection (notching or slurring) above the level of the ST segment at the J point.」②不同作者群：The Bottom Line〈Terminal QRS distortion〉（David Slessor，2022-02-25，curl 取得原頁）S wave 項下逐字「Any deflection at the end of the R wave that dipped below the level of the PQ junction」、J wave 項下逐字「Any positive deflection (notching or slurring) above the level of the ST segment at the J point」。
    - text: 171位被心臟科醫師判讀為benign early repolarization的病人，0位有TQRSD：specificity for LAD occlusion 100%（95% CI 97.8–100）。但這個100%有前提：原文寫的是「鑑別診斷是acute MI vs early repolarization」的時候，不是無條件的100%。
      src:
      - pmid:27658331
      - url:https://www.emdocs.net/52-in-52-15-terminal-qrs-distortion-is-present-in-anterior-myocardial-infarction-but-absent-in-early-repolarization/
      - url:https://www.thebottomline.org.uk/summaries/terminal-qrs-distortion/
      verified: '①原始研究：PMID 27658331 PubMed abstract（本 session efetch）逐字「One hundred seventy-one patients were identified with benign ER. Zero of 171 had TQRSD (specificity for LADO, 100%; 95% confidence interval, 97.8-100).」「it was, thus, 100% specific to LADO when the differential diagnosis was acute myocardial infarction vs ER.」；期刊全文 Results 逐字「171 of 171 (100%; 95% confidence interval, 97.8%-100%) ECGs had either an S wave or a J wave in both leads V2 and V3.」②171／0 的獨立文件：emDocs〈52 in 52 – #15〉（Christiaan van Nispen、Brannon Inman，2022-10-11）逐字「Of 171 benign early repolarization ECGs included, all 171 had at least one of S wave or J wave in at least V2 or V3 and thus did not meet criteria for TQRSD」。③100%／CI 的獨立文件：The Bottom Line（David Slessor，2022-02-25）逐字「Terminal QRS distortion was absent in 100% of patients with benign early repolorisation (95% CI 97.8-100%)」。'
    slides:
    - src: /images/omi/tqrsd-slide-2025-252.webp
      width: 1600
      height: 1200
      alt: 投影片「當STE in V2~V4」：左邊是期刊圖，benign early repolarization的V3，箭頭標J-wave與S-wave；右邊藍底是另一張期刊圖，TQRSD的V3，箭頭標No J-wave、No S-wave。下方左側紅字「用來 Rule in」，右側藍底大紅字「AMI」。
      caption: 取自我 2025 年奇美住院醫師 ECG 教學投影片（slide 252）；兩張 V3 波形圖出自 Lee DH, Walsh B, Smith SW. Am J Emerg Med. 2016;34(11):2182-2185（左：Fig. 2，右：Fig. 1）
