  - id: subtle-ste
    name: Subtle STE(不符合STEMI criteria)
    short: Subtle STE
    part: Part 1（下）QRS與ST
    look: '**有STE但不到STEMI criteria** ➜ Subtle STE'
    look_src: 8G5StEujP
    leads:
    - V2–V3（依年齡性別分層）
    - 其他10個lead（一律≥1 mm）
    leads_src: url:https://globalheartjournal.com/articles/10.5334/gh.1578（§13 正文：'≥2.5 mm in men <40 years, ≥2 mm in men ≥40 years, or ≥1.5 mm in women regardless of age in leads V 2 –V 3 ; and/or ≥1 mm in all other leads'）; url:https://litfl.com/acute-coronary-syndromes/（'≥ 1 mm ST elevation in other leads'）
    pitfall: '**電腦判讀靠不住**：「Normal ECG」四個字對忙碌的急診有致命的安撫效果，但傳統電腦演算法常常把其實是OMI的ECG標成完全正常，所以凡是電腦寫「Normal ECG」都要自己重新獨立看一次。**High-lateral MI**也特別容易被漏：ST elevation主要在I、aVL（±V2），reciprocal STD／TWI在inferior leads、lead III最明顯，STE常出現在不相鄰的導程而被漏看；**LCx分布區的缺血在ECG上也常被忽略**，我覺得這是台灣急診特別容易中招的一個特例。'
    pitfall_src: url:https://drsmithsecgblog.com/signed-off-as-normal-no-concern/（Dr. Smith's ECG Blog 2026-04-17：'The conventional algorithms frequently will mark as completely normal an ECG that manifests OMI !!'；註：該篇個案本身最後是 myocarditis，引用的是這句一般性陳述）; url:https://litfl.com/high-lateral-stemi-ecg-library/（'ST elevation primarily localised to leads I, aVL +/- V2' 'Reciprocal ST depression and/or T wave inversion in inferior leads, most pronounced in lead III'）; url:https://pmc.ncbi.nlm.nih.gov/articles/PMC10597609/（'A high lateral myocardial infarction (HLMI) can often be missed due to noncontiguous ST elevation on the electrocardiogram (ECG)'）; UDMI4 作者接受稿（'ECG evidence of myocardial ischaemia in the distribution of a left circumflex artery is often overlooked.'）; roam:recQEJYM1, roam:NbNe7lH_4（「我覺得台灣急診特別容易中招」為作者看法）
    points:
    - text: Subtle STE＝**有ST elevation但沒達到STEMI criteria的門檻**。STEMI criteria本身的sensitivity不高：Hillinger 2019（前瞻性多中心，軟體自動量測到院第一張ECG，對照最終判定的STEMI）與Martin 2007（以ceMRI診斷AMI為gold standard）都顯示，只靠STEMI criteria會漏掉一大群心肌梗塞。
      src: roam:3JK13vW1v, roam:7_FzElV_n; pmid:31056411; pmid:17825710
    - text: 不要只看絕對高度（幾mm），看比例：**QRS電壓小的lead，血管塞了也可能擠不出1 mm**；改看**ST段形態**（是否變直／變凸，正常early repol是上凹的）、**有沒有reciprocal change**（常比STE本身更好認）、**T wave有沒有跟著變胖**、跟舊片比、跟重做的新片比。
      src: roam:1lcTfD6sx, roam:Awe0zuN6h, roam:ZghqDBOPV, roam:4jIo8ZSWB, roam:dyew-bFjY, roam:3HDYwKBGQ, roam:EI_qzSBY1
    - text: Subtle STE要成立，需要**臨床情境＋形態＋隊友**三個一起到齊，不是看到任何一點點不到1 mm的STE就打電話：那是**撿到槍**。
      src: roam:xEmr0QsGl, roam:H0GzMOpBY, roam:62Jygn3gP, roam:K7mMAyqiX
    criteria:
    - text: '**STEMI criteria（UDMI第五版正文§13；與第四版Table 2切點相同）**：J point處新發ST elevation，出現在**兩個相鄰導程**，V2–V3：男性<40歲 **≥2.5 mm**、男性≥40歲 **≥2 mm**、女性不分年齡 **≥1.5 mm**；其他導程 **≥1 mm**；且在**沒有LVH或LBBB**的前提下。'
      src:
      - url:https://globalheartjournal.com/articles/10.5334/gh.1578（UDMI5 §13 正文）
      - pmid:30571511（UDMI4, Table 2）
      - url:https://litfl.com/acute-coronary-syndromes/
      verified: '① UDMI5 Global Heart 版 §13 正文（globalheartjournal.com 與 PMC13523810 兩站逐字一致，2026-09-14 curl）：「The working diagnosis of STEMI requires new ST-segment elevation at the J-point in at least two contiguous leads: ≥2.5 mm in men <40 years, ≥2 mm in men ≥40 years, or ≥1.5 mm in women regardless of age in leads V 2 –V 3 ; and/or ≥1 mm in all other leads, in the absence of left ventricular hypertrophy or left bundle branch block (LBBB) ( Table 5 ).」② 獨立第二來源 LITFL《Acute Coronary Syndromes》（Chris Nickson，curl 原頁）：「≥ 2.5 mm (i.e ≥ 2.5 small squares) ST elevation in leads V2-3 in men under 40 years, or ≥ 2.0 mm (i.e ≥ 2 small squares) ST elevation in leads V2-3 in men over 40 years ≥ 1.5 mm ST elevation in V2-3 in women ≥ 1 mm ST elevation in other leads」。③ UDMI4 Table 2（Imperial College 典藏之作者接受稿 PDF，目視核對）：「New ST-elevation at the J-point in two contiguous leads with the cut-point: ≥1 mm in all leads other than leads V2-V3 where the following cut-points apply: ≥2mm in men ≥40 years; ≥2.5 mm in men <40 years, or ≥1.5 mm in women regardless of age.」表題「(in the absence of left ventricular hypertrophy and bundle branch block)」。⚠️ UDMI5 Global Heart 版 Table 5 本身寫成「≥2.5 mm in males >40 years, ≥2 mm in males ≥40 years」，與同文正文、第四版、LITFL 的「<40」不一致，故本條以正文為準，不再寫「Table 5 與第四版一模一樣」。'
    - text: 'AHA Mission: Lifeline（ACTION Registry–GWTG）全國登錄資料（Riley 2013）：最終診斷STEMI的病人中，有一部分**第一張ECG是non-diagnostic**、靠後續ECG才診斷；這群人多數在第一張ECG之後不久就出現diagnostic變化；和第一張就診斷的病人相比，guideline-based treatment、院內major bleeding與死亡**沒有顯著差異**。'
      src:
      - pmid:23237133
      verified: '原始研究 PubMed abstract（PMID 23237133，2026-09-14 eutils efetch）逐字：「We divided this study population into 2 groups: those diagnosed on initial ECG (N = 36,994) and those with an initial non-diagnostic ECG that were diagnosed on a follow-up ECG (N = 4,566).」「For patients with an initial non-diagnostic ECG, 72.4% (n = 3,305) had an ECG diagnostic for STEMI within 90 minutes of their initial ECG. There did not appear to be significant differences in the administration of guideline-recommended treatments for STEMI, in-hospital major bleeding (P = .926), or death (P = .475) between these groups.」數字（41,560／36,994／4,566／11.0%／72.4%／3,305／P值）未找到獨立第二來源逐字覆誦（原稿第二路徑 ECG Weekly 為會員制打不開），已拿掉，只留不含數字的敘述。'
