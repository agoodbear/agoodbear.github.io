  - id: pathologic-q
    name: Pathologic Q wave
    part: Part 1（下）QRS與ST
    look: '**新出現的pathologic Q wave**（尤其配上STE或hyperacute T） ➜ Pathologic Q wave'
    look_src: 4ZIqbZZng
    pitfall: 看到Q wave先別急著放心，Raitt 1995（四個溶栓試驗pool起來、過去沒有MI病史的病人）發現：**症狀發作1小時內入院的病人，已有相當比例的initial ECG出現abnormal Q wave**，而且有Q wave**並沒有消除thrombolytic therapy縮小infarct size的效果**。⚠️ Raitt的摘要沒有依血管別分層、也沒有出現「LAD」；Dr. Smith部落格轉述成「LAD STEMI」是他加的，引用時不要講成「一半的LAD OMI」。DDx（非梗塞的Q wave）：**HCM**（深而窄、像匕首的「dagger-like」Q wave）等cardiomyopathy、**LVH**、**Pre-excitation(WPW)**（負向的delta wave會做出假的Q wave）、**lead擺錯**（例如V1–V2擺太高，就可能做出假的Q wave）、心臟極度順時針／逆時針轉位。實用鑑別（Ken Grauer）：**V4的Q wave若比V5、V6的septal q wave大，那就不是正常septal q wave，是infarction Q wave**，不用尺，用眼睛就能做。
    pitfall_src: 'pmid:7897120（''Data from 695 patients who had no past history of myocardial infarction ... were pooled from four prospective trials of thrombolytic therapy.'' ''Of patients admitted within 1 h of symptoms, 53% had abnormal Q waves on the initial ECG.'' ''the presence of abnormal Q waves on the admission ECG did not eliminate the effect of thrombolytic therapy on reducing final infarct size (p < 0.0001)''）; url:https://drsmithsecgblog.com/chest-pain-followed-by-6-days-of/（''See Raitt et al.: 50% of LAD STEMI have Q-waves by one hour.''）; UDMI4 作者接受稿（''Pre-excitation, cardiomyopathy, TTS, cardiac amyloidosis, LBBB, left anterior hemiblock, LVH, right ventricular hypertrophy, myocarditis, acute cor pulmonale, or hyperkalaemia may be associated with Q waves or QS complexes in the absence of MI.''；''Improper lead placement, QRS abnormalities, or technical error (e.g. lead reversal) may result in the appearance of new Q waves or QS complexes''）; url:https://drsmithsecgblog.com/chest-pain-and-q-waves-in-v1-and-v2-is/（2018-11-04：''Septal Q-waves may be caused by placing leads V1 and V2 too high.''）; url:https://litfl.com/hypertrophic-cardiomyopathy-hcm-ecg-library/（''Deep, narrow ("dagger-like") Q waves in lateral (I, aVL, V5-6) +/- inferior (II, III, aVF) leads''）; url:https://litfl.com/pre-excitation-syndromes-ecg-library/（''due to negatively deflected delta waves in inferior/anterior leads ("pseudo-Q waves")''）; url:https://litfl.com/q-wave-ecg-library/（DDx：''Cardiomyopathies — Hypertrophic (HCM), infiltrative myocardial disease'' ''Rotation of the heart — Extreme clockwise or counter-clockwise rotation'' ''Lead placement errors''）; url:https://drsmithsecgblog.com/judge-for-yourself-management-of-this/（''the Q wave in lead V4 ( RED arrow ) should never normally be larger than "normal" septal q waves that may sometimes be seen in leads V5,V6''）; roam:v7dW2a7x6, roam:LKQYksy2D, roam:hiYlWWKLk'
    points:
    - text: Pathologic Q wave **≠ 舊的心肌梗塞**。急性期第一個小時內就可能出現Q wave，**有Q wave不能排除acute OMI**，而且initial ECG有abnormal Q wave**並沒有消除thrombolytic therapy縮小infarct size的效果**。
      src: roam:SFgyiAQaX, roam:Oj1AOC4mK, roam:WwWIHRV1L; pmid:7897120; url:https://drsmithsecgblog.com/chest-pain-followed-by-6-days-of/
    - text: 判準邏輯不對稱：**兩條符合任一條＝病理性**（pathologic Q wave，or）；**兩條都要符合才算正常**（septal q wave，and）。要被判正常，門檻反而比較高。
      src: roam:cTYY9yCzU, roam:2xkP47-xG
    - text: 單獨一個V1的QS可以是正常的；但**在OMI的脈絡下，V2–V3出現任何Q wave都不正常**（除非是lead擺錯、LBBB或paced rhythm）。另外**Qr in V1也是PE相當specific的ECG sign**：看到Qr in V1，anterior OMI跟PE兩盞燈要同時亮。
      src: roam:anNXomqWi, roam:YeT3TAre4, roam:gWKJOz3HL, roam:hNa6j48Vo; UDMI4 作者接受稿（'A QS complex in lead V1 is normal.'）; url:https://litfl.com/q-wave-ecg-library/（'Under normal circumstances, Q waves are not seen in the right-sided leads (V1-3)'）; pmid:12804925（'Qr in V(1)(14 vs 0 in controls; p<0.0001)'）
    criteria:
    - text: '**UDMI第五版（2026）Table 5**：Pathologic Q waves＝Q-wave duration **≥40 ms** 和／或 depth **≥25% of the R wave**，出現在**兩個相鄰導程**。正文說明這是古典定義（分母是**同一導程的R wave**）；先前版本的UDMI用過另一套定義，第五版採用古典定義的理由是：它與CMR上的transmural myocardial infarction相關性較高。'
      src:
      - url:https://globalheartjournal.com/articles/10.5334/gh.1578（UDMI5 Global Heart 版，Table 5 與 §13）
      - url:https://pmc.ncbi.nlm.nih.gov/articles/PMC13523810/（同文 PMC 官方全文）
      verified: 路徑① globalheartjournal.com 原頁（2026-09-14 curl）與路徑② PMC13523810 官方全文（Europe PMC fullTextXML，同日 curl）逐字一致：Table 5「Pathologic Q waves Q-wave duration ≥40 ms and/or a depth of ≥25% of the R wave in two contiguous leads」；§13 正文「The classical definition of a pathological Q wave requires a Q-wave duration ≥40 ms and/or a depth of ≥25% of the R wave in the same lead ( 151 ). While an alternative pathological Q wave definition was suggested in prior versions of the UDMI, the classical definition has a higher correlation with transmural myocardial infarction in CMR imaging studies ( 98 ).」（對照：第四版 Table 3 確實是另一套判準——'Any Q wave in leads V2-V3 >0.02 s or QS complex in leads V2-V3.' 等三列，本次以作者接受稿 PDF 目視核對。）⚠️ 這兩條路徑是同一份同步刊出文件的兩個官方全文站，符合交辦的 UDMI5 特例，但不是兩份不同作者的文件；Circulation／EHJ／JACC 版本 403 或需訂閱未能開啟。原稿併列的 LITFL「經典四條」（>40 ms、>2 mm、>25% of QRS depth、V1–3）只有 LITFL 一個來源，且分母與 UDMI5 不同，已拿掉。
