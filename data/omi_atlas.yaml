  - id: msc
    name: LBBB/PPM with MSC(+)
    full: Smith-Modified Sgarbossa Criteria
    part: Part 4 特別計算
    look: '**寬QRS（LBBB / ventricular paced）** ➜ 直接跳到MSC。三條criteria逐lead掃，paced再加掃V4–V6 concordant STD。'
    look_src: LGDFoI5pO, eNmJFMC9P
    pitfall: 寬QRS這裡**不要**用STEMI criteria、**不要**用4-variable formula、**也不要**用HATW score、**不要**用Precordial Swirl。**四缺一，寬QRS只剩MSC這條路**。
    pitfall_src: e5-k1l2NZ（拿掉研究排除條件的數字）
    leads:
    - 任一lead（concordant STE；discordant STE比例法）
    - V1–V3（LBBB的concordant STD）
    - V4–V6（ventricular paced再加看concordant STD）
    leads_src: roam:eOgVuYd61, roam:Os84bJ4E9, pmid:22939607, pmid:34172301, ECG Weekly 2021-11-22 paced literature review（會員頁）
    points:
    - text: '**寬QRS的世界，MSC幾乎是唯一一條有文獻撐腰的路**：LBBB或ventricular paced病人身上，STEMI criteria、4-variable formula（前提就是early repol vs. LAD occlusion的鑑別）、HATW score（推導研究本身就把QRS偏寬的病人排除）、Precordial Swirl（定義第一條就是narrow QRS without LVH）全部不能用，四缺一，只剩MSC有derivation、LBBB validation、paced validation三篇研究撐著。'
      src: roam:dybdZi1Wc, pmid:40892623, pmid:40319770
    - text: '**Rule of Appropriate Discordance（蹺蹺板）**：LBBB／paced心室是被不正常路徑去極化，ST-T本來就該跟QRS主要方向相反，這是正常現象。看到LBBB有STE，第一反應不該是「有STE➜STEMI」，要先問：這個STE是「本來就該翹」還是「翹過頭」？'
      src: roam:4o7NUzhvB
    - text: '**Smith 2012做的事一句話講完**：把原始Sgarbossa第三條的「5 mm絕對值」，換成「佔前面S wave深度的25%」。蹺蹺板有大有小，絕對值不公平：沒有coronary occlusion的LBBB病人，也可能出現≥5 mm的discordant STE；比例才公平。'
      src: roam:eOgVuYd61, roam:8MRxgO_Xh, pmid:22939607
    criteria:
    - text: '**MSC三條（符合任一條就算positive，不加權、不計分；ST偏移相對PR segment量）**：① Concordant STE ≥1 mm（任一lead）② Concordant STD ≥1 mm（LBBB看V1–V3；ventricular paced擴大到V1–V6）③ Proportionally excessive discordant STE：在有≥1 mm discordant STE的lead，STE達到前面S wave深度的**25%以上**（原文寫ST/S ratio ≤−0.25，負號是因為ST和S方向相反）。'
      src:
      - pmid:22939607
      - pmid:8559200
      - url:https://litfl.com/sgarbossa-criteria-ecg-library/
      - pmid:34172301
      - url:https://ecgweekly.com/weekly-workout/literature-review-diagnosis-of-acute-coronary-occlusion-myocardial-infarction-in-patients-with-ventricular-paced-rhythms/
      verified: '①原始研究：Sgarbossa 1996（PMID 8559200，本次 eutils efetch 逐字）："an ST-segment elevation of 1 mm or more that was concordant with (in the same direction as) the QRS complex; ST-segment depression of 1 mm or more in lead V1, V2, or V3"；Smith 2012（PMID 22939607，逐字）："ST segments, relative to the PR segment, were measured to the nearest 0.5 mm. The ST/S ratio was calculated for each lead that has both discordant ST deviation of greater than or equal to 1 mm and an R or S wave of opposite polarity"、"The revised rule is unweighted, requiring just 1 of 3 criteria."、"The cut point selected for relative discordant ST-segment elevation was -0.25."；Dodd 2021（PMID 34172301，逐字）："Adding concordant ST-depression in V4 to V6 to the MSC yielded 86% (95% CI 75 to 94) sensitivity."

        ②獨立來源（非 Smith 作者群）：LITFL《Sgarbossa Criteria》（Mike Cadogan, Robert Buttner；本次 curl 原始 HTML 逐字）："Concordant ST elevation ≥ 1 mm in ≥ 1 lead Concordant ST depression ≥ 1 mm in ≥ 1 lead of V1-V3 Proportionally excessive discordant STE in ≥ 1 lead anywhere with ≥ 1 mm STE, as defined by ≥ 25% of the depth of the preceding S-wave"；paced 的 V1–V6：ECG Weekly（Amal Mattu）《Literature Review: diagnosis of acute coronary occlusion myocardial infarction in patients with ventricular paced rhythms》（2021-11-22；會員頁，內文取自本機 ecg-search 索引逐字，線上頁本次確認存在）："Concordant ST segment depression > 1 mm in any of V1-V6"'
    - text: '**MSC比原始加權Sgarbossa好（LBBB驗證研究，Meyers 2015）**：MSC sensitivity 80%、specificity 99%；比原始加權Sgarbossa明顯更敏感，specificity則沒有統計差異。'
      src:
      - pmid:26678648
      - book:Electrocardiogram in Clinical Medicine (Wiley, 2021) p.223
      - book:Mattu A, Tabas JA, Brady WJ, eds. Electrocardiography in Emergency, Acute, and Critical Care, 2nd ed. p.213
      verified: '①原始研究：Meyers HP, Limkakeng AT Jr, Jaffa EJ, et al. Am Heart J. 2015;170(6):1255-64（PMID 26678648，本次 eutils efetch 逐字）："The modified criteria were significantly more sensitive than the original weighted criteria (80% vs 49%, P < .001)"、"Specificity of the modified criteria was not statistically different from the original weighted criteria (99% vs 100%, P = .5)"

        ②獨立來源（非 Smith 作者群）：Electrocardiogram in Clinical Medicine（Wiley 2021, eds. Brady WJ, et al.）p.223 表格（本機教科書索引逐字）："80% sensitive and 99% specific for STEMI"；補強：Mattu 2e p.213（本機教科書索引逐字）："In one validation study, use of the modified rule increased the sensitivity for acute MI (80% versus 49%) compared with the original weighted Sgarbossa criteria, with only a modest decrease in specificity (99% versus 100%)."

        註：Smith SW 是 Meyers 2015 共同作者，Smith 部落格的同組數字不計為獨立路徑。原始加權 Sgarbossa 的 49%／100% 只有 Meyers 原文＋Mattu 2e（該書的章節作者名單不在索引內，無法排除 Smith 參與），依 fail-closed 不寫出數字。'
    - text: '**Paced rhythm也適用（PERFECT study, Dodd 2021）**：ventricular paced rhythm裡，MSC比原始Sgarbossa敏感；MSC再加上V4–V6 concordant STD，sensitivity 86%。MSC的specificity依對照組不同落在84%–96%（對「做了導管但不是OMI」那組84%，對一般ED對照組96%）。'
      src:
      - pmid:34172301
      - url:https://ecgweekly.com/weekly-workout/literature-review-diagnosis-of-acute-coronary-occlusion-myocardial-infarction-in-patients-with-ventricular-paced-rhythms/
      verified: '①原始研究：Dodd KW, Zvosec DL, Hart MA, et al. Ann Emerg Med. 2021;78(4):517-529（PMID 34172301，本次 eutils efetch 逐字）："the MSC were more sensitive than the original Sgarbossa criteria"、"Adding concordant ST-depression in V4 to V6 to the MSC yielded 86% (95% CI 75 to 94) sensitivity."、"For the no occlusion myocardial infarction control group of ED patients, additional test characteristics of MSC and original Sgarbossa criteria, respectively, were as follows: specificity 96%"、"For the non-occlusion myocardial infarction-angio control group, additional test characteristics of MSC and original Sgarbossa criteria, respectively, were as follows: specificity 84%"

        ②獨立來源（非 Smith 作者群）：ECG Weekly（Amal Mattu）《Literature Review: diagnosis of acute coronary occlusion myocardial infarction in patients with ventricular paced rhythms》（2021-11-22；會員頁，內文取自本機 ecg-search 索引逐字，線上頁本次確認存在）："The modified criteria have been shown to be more sensitive than the original criteria (Dodd et al., PMID: 34172301): The MSC were found to have high sensitivity (86%) and specificity (84-96%) for diagnosing acute coronary occlusion."'
    - text: '**原始Sgarbossa criteria（1996）三條**：① concordant STE ≥1 mm ② concordant STD ≥1 mm（V1、V2或V3）③ discordant STE ≥5 mm。原始研究把這三條放進多變項模型做成計分系統；Smith 2012認為這套rule的診斷效用不佳，改掉的就是第③條的5 mm絕對值。'
      src:
      - pmid:8559200
      - pmid:22939607
      - url:https://litfl.com/sgarbossa-criteria-ecg-library/
      verified: '①原始研究：Sgarbossa EB, Pinski SL, Barbagelata A, et al. N Engl J Med. 1996;334(8):481-7（PMID 8559200，本次 eutils efetch 逐字）："an ST-segment elevation of 1 mm or more that was concordant with (in the same direction as) the QRS complex; ST-segment depression of 1 mm or more in lead V1, V2, or V3; and ST-segment elevation of 5 mm or more that was disconcordant with (in the opposite direction from) the QRS complex. We used these three criteria in a multivariate model to develop a scoring system"；Smith 2012（PMID 22939607，逐字）："Sgarbossa''s rule, proposed for the diagnosis of acute myocardial infarction in the presence of left bundle branch block, has had suboptimal diagnostic utility."、"the third Sgarbossa component (excessively discordant ST-segment elevation as defined by ≥5 mm of ST-segment elevation in the setting of a negative QRS) is replaced by one defined proportionally by ST-segment elevation to S-wave depth (ST/S ratio)"

        ②獨立來源（非 Smith 作者群）：LITFL《Sgarbossa Criteria》（本次 curl 原始 HTML 逐字）："Concordant ST elevation > 1mm in leads with a positive QRS complex"、"Concordant ST depression > 1 mm in V1-V3"、"Excessively discordant ST elevation > 5 mm in leads with a -ve QRS complex"（LITFL 用「>」，原始研究是「1 mm or more／5 mm or more」，本條照原始研究寫 ≥）。'
