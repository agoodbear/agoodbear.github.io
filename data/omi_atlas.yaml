  - id: hatw
    name: HATW
    full: Hyperacute T wave
    part: Part 1（上）T波與U波
    look: '**T wave相對QRS太肥、太對稱** ➜ HATW。記住是「R wave變矮」不是「T wave變高」。'
    look_src: 39YQ-ac4P
    points:
    - text: '**Hyperacute T wave不是「高」，是「胖」。** 判準是**area under the curve相對於QRS**、加上**symmetry**。'
      src: dwgRy0193（只取前兩句，文獻那句留在 Part 1）
    - text: HATW不是「山變高了」，是「山變胖了」。面積變大，不是高度變大。
      src: 6J5x-y7jx
    slides:
    - src: /images/omi/hatw-slide-089.webp
      width: 1600
      height: 1200
      alt: 投影片「HATW要看的重點」：一段放大的心電圖波形，深灰色塊框住 T wave、淺綠色塊框住 QRS，上方寫「T wave是否夠寬、夠胖」，下方寫「T wave和QRS之間的比率是否不成比例」
      caption: 取自我 2025 年奇美住院醫師 ECG 教學投影片（slide 89）
      src_note: keynote-search slides/d1b0e6d05c1/slide_089.png；Roam 原稿標記 AfVZiwnFq
