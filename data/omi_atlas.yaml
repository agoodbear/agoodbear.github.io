  - id: bifascicular-block
    name: New-onset bifascicular block
    new2025: true
    part: Part 1（下）QRS與ST
    look: '**新出現的bifascicular block（RBBB＋fascicular block，最常見是LAFB）＋胸痛** ➜ New-onset bifascicular block。這代表septal perforator被切掉，是proximal LAD的凶兆。'
    look_src: -w38SZcy2
    artery: proximal LAD，**也要想left main**
    artery_src: 4IgRUmrq_
    pitfall: '**最大的陷阱：把wide QRS當成「所以不能判斷、所以不是STEMI」。** Dr. Smith寫得很白：formal STEMI criteria不適用於RBBB合併LAFB，這種情況沒有正式criteria；STE不明顯或J point被QRS蓋住時，常常就被漏掉。但也別反過來以為RBBB完全不影響ST段判讀：解法是**用appropriate discordance當尺**（BBB的terminal QRS與ST-T本來就該落在isoelectric baseline的相對兩側），**違反這個rule就要考慮ACS**，特別是右到中前胸導程。**HATW score不適用於這群人**（Meyers 2025收案時已排除寬QRS）。RBBB在急診並不少見、常是偶然發現；Widimsky研究裡**舊RBBB的住院死亡率是四組block中最低的（6.4%）**，不要每個RBBB都緊張，緊張的對象是「新的」。RBBB也可能是**PE**：acute PE的ECG可以出現complete或incomplete RBBB、right axis deviation、dominant R wave in V1，Qr in V1也要想到它，床邊超音波看RV可以很快幫忙分辨。'
    pitfall_src: url:https://drsmithsecgblog.com/arrest-at-airport-with-easy-but/（'the formal "STEMI criteria" do not apply to RBBB with LAFB. There are no formal criteria for this situation'；'If the STE is not as striking, or the J point is more obscured by the QRS pattern than in this case, it is often not recognized and missed.'）; url:https://litfl.com/t-wave-ecg-library/（'Appropriate discordance refers to the fact that abnormal depolarisation (such as in bundle branch block) should be followed by abnormal repolarisation, which appears discordant to the preceding QRS complex in the form of ST-depression and T-wave inversion'）; slide:2021《ECG教學-2021年北區住院醫師ECG教學-Subtle STEMI》slide 30／31 講者備註（「一般來說BBB要符合Rule of Appropriate Discordance—>當違反此rule時，就要考慮ACS」「ACS+RBBB-->Concept of appropriate discordance常常會被打破-->可以用此協助診斷ACS(特別是在R't to mid precordial lead)」）; UDMI4 作者接受稿（'In patients with RBBB, new or presumed new ST-segment elevation ≥1 mm or ST-segment or T wave abnormalities (excluding leads V1–V4) (Table 2) may indicate acute myocardial ischaemia.'）; pmid:40892623（'Exclusions were lack of preangiogram ECG, QRS duration ≥110 ms'）; pmid:19931763（'Right bundle-branch block is not an uncommon finding on an electrocardiogram in the emergency department patient, noted incidentally and thus without clinical import'）; pmid:21890488 ＋ PMC4755083（old RBBB 6.4%）; url:https://litfl.com/right-bundle-branch-block-rbbb-ecg-library/（'Appropriate discordance with ST depression and/or T-wave inversion in right precordial leads (V1-3).'）; url:https://litfl.com/ecg-changes-in-pulmonary-embolism/（'Complete or incomplete RBBB' 'Right axis deviation' 'Dominant R wave in V1 – a manifestation of acute right ventricular dilatation'）; pmid:12804925（'Qr in V(1)(14 vs 0 in controls; p<0.0001)'）; roam:MEd5bvjvm, roam:zAa_gEgoo, roam:dHe3rSN76, roam:gtHkKLf_h, roam:_60YboKBd
    points:
    - text: 機轉：Right bundle branch跟left anterior fascicle主要靠**LAD的septal perforator**供血；**第一支septal perforator(S1)從近端LAD分出**，供應包含束支在內的basal septum，**近端LAD或left main塞住 ➜ septal perforator沒血 ➜ 新出現的RBBB+LAFB**。
      src: 'roam:g3s5DVNcc, roam:uzzaheaF7, roam:uF26m7UsK; url:https://litfl.com/anterior-myocardial-infarction-ecg-library/（''S1 supplies the basal part of the interventricular septum, including the bundle branches (corresponding to leads aVR and V1)''；''Occlusion proximal to S1 Signs of basal septal involvement: ... Complete RBBB''）'
    - text: 抓「新」是唯一的關鍵動作：Widimsky 2012裡，整體RBBB跟LBBB的住院死亡率**相近**；但**新發（或推測新發）RBBB 18.8% vs 舊RBBB 6.4%，差了將近三倍**。看到RBBB第一件事不是判斷左右，是**去翻舊心電圖**。
      src: roam:Rg6sisNhu, roam:TnHdyBvdy; pmid:21890488; url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4755083/
    - text: 很常見到**downsloping STE**：這不像典型STEMI長相，最容易被判成「BBB的secondary change」然後翻頁。Dr. Smith講得更直接：acute OMI合併RBBB+LAFB的病人，**要嘛正要arrest、要嘛剛被救回來、要嘛正在cardiogenic shock**。
      src: roam:ooKDeyU9k, roam:tVuyrWEOG, roam:dZZ8nmDGc; url:https://drsmithsecgblog.com/a-man-in-his-50s-with-acute-chest-pain-see-what-happens-when-it-is-not-a-stemi/（'Any time you see RBBB + LAFB in acute OMI, the patient is about to arrest, has just been resuscitated, or is in cardiogenic shock'）
    criteria:
    - text: '**Widimsky 2012（多中心AMI世代）**：住院死亡率，**新發或推測新發RBBB 18.8%**（新舊×左右四組block中最高）、**新發LBBB 13.2%**、**舊RBBB 6.4%**（四組中最低）；整體RBBB與LBBB的住院死亡率相近。新發（或推測新發）的block不分左右，cardiogenic shock發生率是所有ECG次族群中最高的。急性left main occlusion的病人裡，也有一部分到院ECG是以RBBB（多半合併LAH）表現。'
      src:
      - pmid:21890488
      - url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4755083/
      - url:https://drsmithsecgblog.com/arrest-at-airport-with-easy-but/
      - url:https://drsmithsecgblog.com/how-does-acute-left-main-occlusion/
      verified: ① 原始研究（PubMed abstract PMID 21890488 ＋ PMC3249219 全文，2026-09-14 curl）：「In-hospital mortality of RBBB patients was similar to LBBB (14.3 vs. 13.1%, P = 0.661). Patients with new or presumably new blocks had the highest (LBBB 15.8% and RBBB 15.4%) incidence of cardiogenic shock from all ECG subgroups.」「In-hospital mortality was highest (18.8%) among patients presenting with new or presumably new RBBB, followed by new or presumably new LBBB (13.2%), old LBBB (10.1%), and old RBBB (6.4%). Among 35 patients with acute left main coronary artery occlusion, 26% presented with RBBB (mostly with LAH) on the admission ECG.」② 獨立第二來源 Pozen JM, Mankad AK, Owens JT, Jovin IS. N Am J Med Sci 2015;7(12):569-571（PMC4755083 全文 curl）：「new RBBB is associated with a higher mean Killip class (1.88% vs. 1.45%), percentage of TIMI flow 0 (55% vs. 34.9%), and in-hospital mortality (18.8% vs. 6.4%) than if RBBB existed prior to the AMI」「in-hospital mortality was 18.8% for those with new RBBB, significantly higher than 13.2% for those with new LBBB」。③ Dr. Smith's ECG Blog《Cardiac Arrest at the airport...》（Pendell Meyers，2021-09-23，curl）：「in-hospital mortality was 18.8% for AMI with new RBBB alone」；《How does Acute Total Left Main Coronary occlusion present on the ECG?》（Smith & Meyers，2019-08-09，curl）：「among 35 patients with acute left main coronary artery occlusion, 9 presented with RBBB (mostly with LAFB) on the admission ECG」（與原文 26% 表達方式不同，故 left main 那句只留定性敘述）。雙證通過的數字：18.8%、13.2%、6.4%。單一來源已拿掉：6,742 位／8 家醫院、6.3%／2.8%／3.2%／0.3%、14.3% vs 13.1%（P = 0.661）、舊 LBBB 10.1%、shock 15.4%／15.8%、26%。
    - text: 同一篇Table 4（RBBB合併hemiblock）：RBBB合併LAH或LPH的病人年紀較大、EF較低、三條血管病變較多，死亡率只是「稍高」，**三組住院死亡率的比較未達統計顯著**；RBBB+LPH那組人數很少，而且**完全沒接受再灌流的比例明顯較高**。所以只能說「有往上走的趨勢」，不能說「已證實合併hemiblock死亡率更高」。
      src:
      - url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3249219/
      verified: 原始研究全文（Widimsky 2012，PMC3249219，Europe PMC fullTextXML 2026-09-14 curl）逐字：「Patients, in whom RBBB was combined with either LAH or LPH tended to be older, had higher incidence of diabetes, had lower ejection fraction, more frequent occurrence of three-vessel disease and LAD as an infarct-related artery, and had slightly higher mortality ( Table 4 ).」Table 4：「% from all patients 2.8 3.2 0.3」「Reperfusion—none (%) 18.0 17.7 47.1 0.014」「In-hospital mortality (%) 10.5 14.8 17.7 0.438」「P -value refers to the comparison of all three groups」。本條已改為不含數字的敘述，依原始全文即可；Table 4 各格數字找不到獨立第二來源（Bear 投影片 slide 155 只是同一張表的截圖，不算獨立），全部拿掉。
