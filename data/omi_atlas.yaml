      verified: '2026-09-14 自行核對，無數字判準。①原始病例報告 Durant E, Singh A. Am J Emerg Med 2015;33(9):1326.e3-5（PMID 25722286，PubMed 無摘要；讀 Bear Zotero 內 accepted manuscript 全文）逐字：『Prehospital and initial hospital electrocardiograms (ECG) showed ST elevations in leads 1, v2, and avL and ST depressions in the inferior leads (II, III, and avF)』；同文引 Birnbaum 等研究：『none of these patients had ST-segment elevation in V3-V6』。②Ken Grauer, ECG Blog #540（2026-08-01，curl 原始頁面）逐字：『i) ST elevation in leads I, aVL and V2; ii) Reciprocal ST depression in lead III (ST depression is also often seen to a lesser degree in neighboring inferior leads II and aVF); iii) No ST elevation in any chest lead except for lead V2.』③LITFL《High Lateral STEMI》（Mike Cadogan、Robert Buttner）逐字：『ST Elevation: Lead I, aVL, V2; ST Depression: Lead III (and inferior leads)』。命名者 Littmann 2016 為 Letter、無摘要、全文未取得；兩篇獨立期刊文章轉述其定義一致（Zahdeh 2025 Cureus, PMC12681995：『noncontiguous leads (I, aVL, and V2) with reciprocal ST depression in inferior leads』；Rajendran 2021 QJM：『ST-elevation in the lead I, aVL, V2 and ST-depression in lead III』）。第三條是 Grauer 個人加的，文中已標明出處。'
