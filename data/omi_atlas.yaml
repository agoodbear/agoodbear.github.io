  - id: wellens
    name: Wellens' syndrome
    part: Part 3（上）LAD的三張臉
    look: '**V2–V4的biphasic或deep symmetric TWI，而且病人**現在**不痛了** ➜ Wellens'' syndrome。不要因為不痛就放心。'
    look_src: LQ07tbkeh
    leads:
    - V2–V4
    artery: LAD（塞過了、現在通了）
    artery_src: a3XfJgPJX, TwXb-Ws5m
    pitfall: '**Wellens禁做stress test**。biphasic T wave若是先下後上，想低血鉀，不是LAD。'
    pitfall_src: TwXb-Ws5m, HMLjf3p04, 3JS5QEONB
    points:
    - text: Wellens waves ≠ Wellens' syndrome：Wellens waves只是T wave的形狀（biphasic或deep symmetric TWI）；Wellens' syndrome是T wave形狀＋完整的臨床情境。差在哪？差在**病患現在痛不痛**。
      src: roam:hPvcHypy_, roam:S7FRRbkUB, roam:ZkcxogE4a, roam:YqqZq71hj
    - text: 機轉是reperfusion T wave：LAD剛剛塞過、現在自己通了。所以才要求pain-free、troponin不高、沒有Q wave、R wave保留。
      src: roam:C2WOAcILZ, roam:7PGL-uM0U, roam:0iaR7wlHP
    criteria:
    - text: T wave有兩種型態：deeply and symmetrically inverted（又深又對稱的倒轉），約佔75%；biphasic（先正後負，terminal negativity），約佔25%（比例依Rhinehardt 2002的回顧整理）。文獻對Type A／Type B的命名不一致，直接描述形狀最不會出錯。
      src:
      - pmid:12442245
      - url:https://www.ncbi.nlm.nih.gov/books/NBK482490/
      - url:https://litfl.com/wellens-syndrome-ecg-library/
      verified: ①Rhinehardt 2002 全文（Bear Zotero ALPVPXYJ，2026-09-14 pdftotext）逐字「pattern, which comprises approximately 75% of cases, the T wave is deeply inverted」「The less common variant, comprising 25% of Wellens' syndrome cases, presents with biphasic T waves」②StatPearls〈Wellens Syndrome〉（Miner B, Grigg WS, Hart EH；Last Update 2023-07-31；同日 curl）逐字「These T wave findings are present in approximately 25% of cases.」「These findings are present in approximately 75% of cases.」③LITFL〈Wellens Syndrome〉（Mike Cadogan、Robert Buttner，2021-09-08；同日 WebFetch）逐字「Biphasic, with initial positivity and terminal negativity (25% of cases)」「Deeply and symmetrically inverted (75% of cases)」。Bear 2026-09-14 裁示：原始 de Zwaan 1989 取不到，以 Rhinehardt 2002 為出處。註：1982 原始研究（26 位）Fig. 1 是 Pattern A 4 位、B 22 位；75%／25% 可能來自 1989 的資料，未能核對。
    - text: ST段是isoelectric或只有minimal elevation（Rhinehardt 2002：<1 mm），沒有明顯的ST elevation。
      src:
      - pmid:12442245
      - url:https://www.ncbi.nlm.nih.gov/books/NBK482490/
      - url:https://litfl.com/wellens-syndrome-ecg-library/
      verified: ①Rhinehardt 2002 全文 Table 1 逐字「Isoelectric or minimally elevated (<1 mm) ST segment」、內文「(ie, less than 1 mm)」②StatPearls〈Wellens Syndrome〉逐字「Isoelectric or minimally elevated ST segment, less than 1 mm」③LITFL〈Wellens Syndrome〉逐字「Isoelectric or minimally-elevated ST segment (< 1mm)」，並寫明「Rhinehart et al (2002) describe the following diagnostic criteria」。Bear 2026-09-14 裁示以 Rhinehardt 2002 為出處；註：1982 原文寫「minimally elevated (1 mm)」。
    - text: Wellens' syndrome不要安排stress test：LAD已經是critical stenosis，做stress test可能誘發急性心肌梗塞或猝死。
      src:
      - url:https://www.ncbi.nlm.nih.gov/books/NBK482490/
      - url:https://litfl.com/wellens-syndrome-ecg-library/
      - pmid:12442245
      verified: ①StatPearls〈Wellens Syndrome〉逐字「Because Wellens syndrome patients have critical narrowing of the LAD coronary artery, a stress test should be avoided as this can precipitate an acute myocardial infarction and sudden death.」②LITFL〈Wellens Syndrome〉逐字「Due to the critical LAD stenosis, these patients usually require invasive therapy, do poorly with medical management, and may suffer MI or cardiac arrest if inappropriately stress tested」③Rhinehardt 2002 期刊全文 p.641 逐字「The avoidance of provocative testing, including stress imaging, is key in that such testing may precipitate an AMI with significant acute sequelae.」
    refs:
    - label: Rhinehardt J, Brady WJ, Perron AD, Mattu A. Electrocardiographic manifestations of Wellens' syndrome. Am J Emerg Med. 2002;20(7):638-643. PMID 12442245.
      url: https://pubmed.ncbi.nlm.nih.gov/12442245/
    - label: de Zwaan C, Bär FW, Wellens HJ. Characteristic electrocardiographic pattern indicating a critical stenosis high in left anterior descending coronary artery in patients admitted because of impending myocardial infarction. Am Heart J. 1982;103(4 Pt 2):730-736. PMID 6121481.
      url: https://pubmed.ncbi.nlm.nih.gov/6121481/
    - label: de Zwaan C, Bär FW, Janssen JH, et al. Angiographic and clinical characteristics of patients with unstable angina showing an ECG pattern indicating critical narrowing of the proximal LAD coronary artery. Am Heart J. 1989;117(3):657-665. PMID 2784024.
      url: https://pubmed.ncbi.nlm.nih.gov/2784024/
    - label: StatPearls：Wellens Syndrome（NCBI Bookshelf, NBK482490）
      url: https://www.ncbi.nlm.nih.gov/books/NBK482490/
    - label: LITFL：Wellens Syndrome（ECG Library）
      url: https://litfl.com/wellens-syndrome-ecg-library/
    - label: LITFL：T wave（ECG Library Basics）
      url: https://litfl.com/t-wave-ecg-library/
    - label: StatPearls：ECG T Wave（NCBI Bookshelf, NBK538264）
      url: https://www.ncbi.nlm.nih.gov/books/NBK538264/
    slides:
    - src: /images/omi/wellens-slide-2025-261.webp
      width: 1600
      height: 1200
      alt: 投影片左側兩張 T 波示意圖：上方標 A，配文字「Biphasic T wave inversion」與粉紅色大字「Pattern A　約佔25%」；下方標 B，配文字「Deeply T wave inversion」與粉紅色大字「Pattern B　約佔75%」。
      caption: 取自我 2025 年奇美住院醫師 ECG 教學投影片（slide 261）；比例依 Rhinehardt J, et al. Am J Emerg Med. 2002;20(7):638-643 的整理。
      src_note: keynote-search slides/d1b0e6d05c1/slide_261.png；Bear 2026-09-14 確認整張投影片是他自己製作（部分心電圖取自其他網站），同意公開
