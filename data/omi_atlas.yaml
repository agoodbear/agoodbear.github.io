      alt: 投影片「診斷的定義」：左側兩張 T 波示意圖，上方標 A（先正後負的 biphasic 波形）、下方標 B（又深又對稱的倒轉）；右側藍底列出七項診斷條件：Deeply TWI or Biphasic TWI in V2~V3、Isoelectric or minimal STE(< 1 mm)、No Precordial Q wave、Preserved RWP、Recent history of angina、ECG pattern present in pain free state、Normal or slightly elevated serum cardiac markers；上方附 Rhinehardt 2002 的書目。
      caption: 取自我 2025 年奇美住院醫師 ECG 教學投影片（slide 262）；診斷條件引自 Rhinehardt J, et al. Am J Emerg Med. 2002;20(7):638-643。
