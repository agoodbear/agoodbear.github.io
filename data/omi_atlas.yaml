    - src: /images/omi/northern-omi-slide-2025-324.webp
      width: 1600
      height: 1200
      alt: 投影片「Northern OMI」：彩色圓環分成八格，外圍標著導程（aVR、aVL、Lead I、Lead II、aVF、III）與對應區域（Subendocardial ischemia、High lateral MI、Anterolateral MI、Inferior MI(LCx)、Inferior MI(RCA)）；圓環中間是一顆卡通心臟，三個箭頭從中心出發：紅色指向 aVR、綠色指向 aVL、深藍色直指正上方。
      caption: 取自我 2025 年奇美住院醫師 ECG 教學投影片（slide 324）：ST 向量朝正上方（north）。
      src_note: keynote-search slides/d1b0e6d05c1/slide_324.png；Bear 2026-09-14 確認整張投影片是他自己製作（部分心電圖取自其他網站），同意公開
  - id: n-wave
    name: N wave sign
    new2025: true
    part: Part 3（下）不相鄰導程
    look: '**在II／III／aVF或I／aVL**出現**QRS終末notch／deflection**、**該lead QRS變寬** ➜ N wave sign。完整criteria見Part 3（下）。'
    look_src: BXfFfBtxb（拿掉振幅切點，待查證後放回）
    leads:
    - II／III／aVF
    - I／aVL
    artery: LCx／OM
    artery_src: mFv0L91n6
    pitfall: '**最大的陷阱：把良性的early repolarization當成N wave**。而且千萬不要用「哪個lead」來分：lead位置只告訴你「如果它是N wave，那culprit在哪」，不能拿來判斷「它是不是N wave」。'
    pitfall_src: Mz7Lta9hi, kanB7Ihre（原本取自 Part 4 BXfFfBtxb 的「不是V2–V3，那裡的notch是J wave」，跟 Part 3（下）的結論衝突，改用 Part 3（下）原文）
    points:
    - text: N wave sign＝**QRS末端多出一個notch或deflection**。Niu 2013原始研究的定義有四條：①QRS末端有notch／deflection ②高度切點2 mm（以PR segment為基準）③24小時內notch持續變化（甚至消失或變成S wave）④這些leads的QRS duration延長。機轉是**left ventricular basal region**（LCx供應區）的delayed activation wave：「全班一起交考卷，有一個人寫太慢，最後一個交」。
      src: roam:3SnArGclc, roam:oIL0iJx_z, roam:vGtngM2Pz, roam:fBDuI867l, roam:nVIkTzCKU, roam:e0dDhjvLZ; pmid:21663984; pmid:35198230
    - text: 跟良性J wave（early repolarization）的分辨，**不要只看出現在哪個lead**：lead位置只能告訴你「如果它是N wave，culprit可能在哪」，不能判斷「它是不是N wave」。要看criteria本身給的條件：①高度（良性的常沒這麼大）②動態（N wave會在24小時內變化；良性early repol是靜態的，舊片就長這樣）③QRS有沒有變寬（N wave是delayed activation，會拖長QRS）；再加上臨床情境（有沒有ACS症狀）和舊片對照。
      src: roam:kanB7Ihre, roam:mHQlJ9Z0y, roam:9bhHZmW1a, roam:Sl7laGMlw, roam:kHdWAnY3l, roam:71HZNliKi
    - text: 抓LCx的表現：N wave出現在II、III、aVF時，sensitivity 77%、specificity 89%。⚠️這個數字的target condition是**在已確診NSTEMI、而且做過冠狀動脈攝影的病人裡，判斷culprit是不是LCx**，不是「從胸痛病人裡抓出OMI」，**不能跟前面幾個finding的數字直接並排比較**。另一個團隊的研究（Rostoff 2020）結果比較保守：culprit為LCx／OM的病人裡，最常見的finding是T-wave precordial instability，不是N wave；aVL的N wave雖然是culprit LCx／OM的獨立預測因子，但culprit在LAD／diagonal的病人也會出現下壁N wave。**N wave是指向LCx的線索，不是高敏感度的篩檢工具。**
      src: roam:WROAlASEb, roam:TcOLCkca2, roam:6XyUXhNdj, roam:K64kJDzp1, roam:BWrUFO82e, roam:R68bhQNtW, roam:Zymwk7C81; pmid:21663984; pmid:35198230; pmid:32568742
    criteria:
    - text: Niu 2013原始研究的N wave定義：①QRS末端有notch或deflection；②notch／deflection高度切點2 mm（以PR segment為基準；原文寫≥2 mm，獨立來源Alsagaff 2022寫>2 mm）；③24小時內notch持續變化，甚至消失或變成S wave；④這些leads的QRS duration延長。
      src:
      - pmid:21663984
      - pmid:35198230
      verified: 2026-09-14 自行核對。①原始研究 Niu T, et al. Int J Cardiol 2013;162(2):107-11（PMID 21663984；Bear Zotero 全文 PDF）Methods 逐字：『(1) a notch or deflection in the terminal QRS complex of the surface ECG; (2) the height of notch or deflection of ≥ 2 mm (the point of deflection was measured with reference to the PR segment); (3) a continuous change of the notch (the point of deflection shifted ≥2 mm with reference to the PR segment, ≥2 leads) in 24 hours, even disappeared or come into the s wave; (4) with a prolongation of QRS duration in these leads.』②獨立作者群 Alsagaff MY, et al. Oxf Med Case Reports 2022（PMID 35198230，PMC8858395 全文）逐字：『(i) a notch or deflection in the terminal QRS complex on the surface ECG; (ii) the height of the notch or deflection of > 2 mm; (iii) a continuous change of the notch in 24 hours, even disappearance or transition into the s wave and (iv) prolongation of QRS duration in these leads』。兩者都寫 2 mm 與 24 hours，但不等號不同（≥ vs >），判準只寫『切點2 mm』並把兩種寫法都標出來。拿掉：『反折點變動≥2 mm、至少2個leads』——只有 Niu 2013 和同一團隊的 Yang 2020（Niu T、Fu P 為共同作者，同屬盛京醫院）寫到，不算獨立；有N wave者QRS 121±12 ms vs 106±11 ms（P<0.01）——只見於 Niu 2013 一份文件。草稿把 Yang 2020 當成獨立第二路徑，不成立。
    - text: N wave出現在II、III、aVF：辨認culprit為LCx的sensitivity 77%、specificity 89%（族群是做過冠狀動脈攝影的NSTEMI病人；target condition是「culprit是不是LCx」，不是「有沒有OMI」）。
      src:
      - pmid:21663984
      - pmid:35198230
      verified: 2026-09-14。①Niu 2013 PubMed 摘要逐字：『N wave in leads II, III and aVF was associated with 77% sensitivity and 89% specificity, respectively.』族群逐字：『NSTEMI patients who presented to our institution and underwent coronary angiography within 24 hours of admission』（只取設計描述，不放人數與時間）。②Alsagaff 2022（PMC8858395）逐字：『The presence of N-wave in the lead II, III, AVF is associated with 77% sensitivity and 89% specificity of LCx lession, respectively』。拿掉：I、aVL的64%／96%（找不到獨立第二來源；Yang 2020 前言把數字寫成『77% and 96%』，本身就對不上）、218人、LCx組66（77%）／LAD 6%／RCA 18%、P<0.001（單一來源），以及草稿自行算出的『66/86』（任何來源都沒有這個分母）。
    - text: 有N wave的NSTEMI（N-NSTEMI）：在culprit為LCx的病人中，all MACE、all-cause death、stent thrombosis、TVR、recurrent unstable angina的發生率跟STEMI相近，而且都高於沒有N wave的NSTEMI；作者結論是N-NSTEMI的風險等同急性STEMI。
      src:
      - pmid:32032438
      verified: 2026-09-14 eutils：Yang T, Chen J, Liu X, Xu C, Niu T, Fu X, Fu P. Clin Cardiol. 2020 May;43(5):491-499（PMID 32032438）。摘要逐字：『The incidence rates of all MACEs, all-cause death, ST, TVR, and rUAP were similar in N-NSTEMI and STEMI groups, which were greater than non N-NSTEMI (P < .05).』『N-NSTEMI has a risk equivalent to acute STEMI.』ST＝stent thrombosis 由 PMC7244293 全文縮寫表確認（『ST, stent thrombosis』）。非數字型結論，一個原始來源即可；P 值拿掉。⚠️這篇和 Niu 2013 是同一團隊（盛京醫院），不是獨立複製。
    refs:
    - label: Niu T, Fu P, Jia C, Dong Y, Liang C, Cao Q, Yang Z, Fu R, Zhang X, Sun Z. The delayed activation wave in non-ST-elevation myocardial infarction. Int J Cardiol. 2013 Jan 10;162(2):107-11. PMID 21663984
      url: https://pubmed.ncbi.nlm.nih.gov/21663984/
    - label: 'Alsagaff MY, Wardhani LFK, Pratanu I, Kartikasari DP, Doevendans PA. NSTEMI with total left circumflex occlusion: how the N-wave might help (case report). Oxf Med Case Reports. 2022 Feb;2022(2):omac010. PMID 35198230'
      url: https://pubmed.ncbi.nlm.nih.gov/35198230/
    - label: Yang T, Chen J, Liu X, Xu C, Niu T, Fu X, Fu P. Non-ST-elevated myocardial infarction with "N" wave on electrocardiogram and culprit vessel in left circumflex has a risk equivalent to ST-elevated myocardial infarction. Clin Cardiol. 2020 May;43(5):491-499. PMID 32032438
      url: https://pubmed.ncbi.nlm.nih.gov/32032438/
    - label: 'Rostoff P, Wisniewski P, Gajos G, Konduracka E, Nessler J, Kruszelnicka O. Electrocardiographic identification of the culprit coronary artery in acute non-ST-elevation myocardial infarction: predictive value of N-wave and T-wave precordial instability. Coron Artery Dis. 2020 Nov;31(7):590-596. PMID 32568742'
      url: https://pubmed.ncbi.nlm.nih.gov/32568742/
