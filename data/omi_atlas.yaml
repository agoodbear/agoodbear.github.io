  - id: inverted-u
    name: Inverted U wave
    part: Part 1（上）T波與U波
    look: '**U wave倒過來** ➜ Inverted U wave。很罕見，但抓到就是一個。'
    look_src: MCB5oJjkG
    leads:
    - I
    - aVL
    - V4–V6
    leads_src: pmid:7424944（'Twenty-seven patients had U wave negativity in leads I, aVL or V4 through V6.'，即 Gerson 1980 判讀的導程）; url:https://litfl.com/u-wave-ecg-library/（NSTEMI 例：'subtle U-wave inversion in the lateral leads (I, V5 and V6)'）
    artery: LAD／left main（尤其是proximal LAD）
    artery_src: pmid:487534（'highly predictiveof significant coronary artery disease and, more specifically, of disease of the proximal left anterior descending coronary artery'）; pmid:7424944（'greater than or equal to 75 percent stenosis of the left anterior descending or left main coronary artery'）; url:https://litfl.com/u-wave-ecg-library/（'predict a ≥ 75% stenosis of the LAD / LMCA'）
    pitfall: Inverted U wave**不是ACS專屬**，是「這顆心臟有病」的訊號，不是「這條血管現在塞住」的訊號：**高血壓、瓣膜性心臟病（例如主動脈瓣與二尖瓣逆流）、先天性心臟病、心肌病變、甲狀腺亢進**都可能出現，它也和**LV dysfunction**有關。最難的鑑別是跟**biphasic T wave的後半段**搞混，一定要先確認T wave已經結束（用QT interval當卡尺）。另外文獻很老（1979–1980）；Reinig 2005重新分析T wave與U wave方向不一致的病人，T倒U正那組的CAD比例只比T正U倒那組略高，而且**差異未達統計顯著**：真正撐起「高度特異」這句話的是Gerson那兩篇；Reinig真正的貢獻是提醒**U wave不能單獨看，要連著它的T wave一起判讀**。
    pitfall_src: url:https://litfl.com/u-wave-ecg-library/（Common causes of inverted U waves：'Coronary artery disease / Hypertension / Valvular heart disease / Congenital heart disease / Cardiomyopathy / Hyperthyroidism'；'Have been shown to predict ... the presence of left ventricular dysfunction'）; pmid:6211085（Kishida 1982：'The three most common conditions associated with a negative U wave are systemic hypertension, aortic and mitral regurgitation and ischemic heart disease.'）; roam:ju25YhKuK, roam:LRJ9R53x9, roam:PhmSxJcPc（QT卡尺鑑別）; pmid:15649236（'Coronary disease was slightly more common in Group A (64%) than in Group B (46%) (P = 0.174; ns).' 'we propose that the U wave not be analyzed in isolation, but rather with respect to its T wave.'）; roam:daJnkdPo3
    points:
    - text: 定義：在一個**T wave直立**的lead，T wave結束之後出現**向下**的U wave（Neg U under T(+)）。正常U wave跟T wave**同方向**、**心跳越慢越明顯**。
      src: roam:Uvu3_i-dA, roam:Fk5Tc7lqL, roam:nCo9oExGM; url:https://litfl.com/u-wave-ecg-library/（'U-wave inversion is abnormal (in leads with upright T waves)'；'The U wave normally goes in the same direction as the T wave'；'the U wave grows bigger as the heart rate slows down'）
    - text: 辨認關鍵：拿**QT interval當卡尺**，找一個QT interval很clear cut的lead，把QT長度平移到懷疑的lead，**落在QT interval外面才是inverted U wave，落在裡面是biphasic T wave的後半段**。
      src: roam:cE_126cDp, roam:LRJ9R53x9, roam:PhmSxJcPc
    - text: 它可以**比STE更早出現**，也可以**在沒有胸痛的時候出現**，這是它跟HATW一樣珍貴的地方：**早期訊號**。
      src: roam:BtfuaOsse, roam:IS2xVYEhR; url:https://litfl.com/u-wave-ecg-library/（'May be the earliest marker of unstable angina and evolving myocardial infarction'）; slide:d1b0e6d05c1/133 講者備註（「可以在Pain(+) or Pain free(+)出現」「Early sign->可以在AMI出現ECG變化之前發生」）; pmid:8092544（Salmasi 1994，無症狀高風險族群運動測試：'None of these patients had a history of angina pectoris or myocardial infarction and all had normal resting ECG.' 'It is concluded that exercise-induced inverted U wave is a reliable indicator of silent myocardial ischemia due to occult CAD in asymptomatic high-risk subjects.'）
    criteria:
    - text: '**Gerson 1979（運動誘發）**：exercise-induced U-wave inversion對顯著冠狀動脈疾病、尤其是**proximal LAD disease**有高度預測力。**Gerson 1980（靜止時）**：在接受冠狀動脈攝影的病人中，resting U wave negativity是 **≥75% LAD或left main狹窄**與**LV dysfunction**的顯著預測因子。'
      src:
      - pmid:487534
      - pmid:7424944
      - url:https://litfl.com/u-wave-ecg-library/
      verified: ① 原始研究 PubMed abstract（2026-09-14 eutils efetch）：Gerson 1979（PMID 487534）「We conclude that exercise-induced inversion of the U-wave is highly predictiveof significant coronary artery disease and, more specifically, of disease of the proximal left anterior descending coronary artery.」；Gerson 1980（PMID 7424944）「Among patients selected for coronary cineangiographic study, U wave negativity was a significant predictor (p < 0.001) of greater than or equal to 75 percent stenosis of the left anterior descending or left main coronary artery and of left ventricular dysfunction (p < 0.001).」② 獨立第二來源 LITFL《U Wave》（Ed Burns，curl 原頁；該頁參考文獻列 Gerson 1980）：「Have been shown to predict a ≥ 75% stenosis of the LAD / LMCA and the presence of left ventricular dysfunction」。「≥75%」兩邊一致。原稿的 36（15%）／35／33／24／1 of 82（1.2%）、27 位、89%／89%／80%、64%／46%／41%、p<0.001 只有原始摘要一個來源，已拿掉。
