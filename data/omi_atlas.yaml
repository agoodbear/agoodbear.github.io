      caption: 同一份投影片（slide 88）：LVH 和 HATW 的 V1–V3 放在一起，差在哪裡？
      src_note: keynote-search slides/d1b0e6d05c1/slide_088.png；Roam 原稿標記 U_SdRcJeK；兩張 ECG 條圖的原始出處待確認
    pitfall: '**利益揭露要老實講**：本研究部分由Powerful Medical（做PMcardio／Queen of Hearts的公司）資助，Meyers與Smith持有該公司股票選擇權、Herman是該公司Chief Medical Officer。不是研究做壞了（derivation／validation分開、outcome用血管攝影上culprit lesion的TIMI flow grade作硬終點），但**這個score最後是要裝進一個要賣錢的AI產品裡的**：AI說是OMI，還是要自己會看那條T波胖不胖。這個score的sensitivity偏低，**陰性不能rule out**；而且**不適用於寬QRS**：研究收案時就排除了QRS偏寬的病人，LBBB／paced rhythm不在驗證範圍內。'
    pitfall_src: 'pmid:40892623（Conflict of interest statement 逐字：''The work performed by authors and scientists for this publication was in part funded by Powerful Medical.'' ''Dr Herman is the Chief Medical Officer of Powerful Medical.'' ''Drs Meyers and Smith hold stock options in Powerful Medical.''；Methods：''Exclusions were lack of preangiogram ECG, QRS duration ≥110 ms, and elevated troponin without angiogram. The outcome definition was myocardial infarction with TIMI flow grade 0-1 culprit lesion.''；Results 的 sensitivity 為原文數據）; url:https://www.powerfulmedical.com/（網站標題 ''PMcardio: AI ECG & Cardiac Care Platform - Powerful Medical''，產品列 ''Queen of Hearts''）; roam:DB9q0YCJJ, roam:DY5D-LCVc, roam:8xbiAL2x8'
    criteria:
    - text: HATW score（Meyers 2025, JACC Adv）：用兩個量測把HATW客觀化，**T-wave magnitude**（T波面積相對於QRS amplitude）與**symmetry**（T波peak-to-end時間相對於onset-to-peak時間）；derivation與validation分成兩組評估。作者結論：這是第一個HATW的客觀定義，在疑似ACS的病人中，作為acute coronary occlusion的ECG finding有顯著臨床效用。切點與specificity、sensitivity、PPV、LR+等數字目前只找到原始論文一個來源，本頁暫不列出。
      src:
      - pmid:40892623
      verified: '原始研究 PubMed abstract（PMID 40892623，2026-09-14 eutils efetch）逐字：「ECG measures included T-wave magnitude (T-wave area relative to QRS amplitude) and symmetry (T-wave peak-to-end time relative to onset-to-peak time). The HATW score was derived and evaluated on separate groups.」「CONCLUSIONS: The HATW score is the first objective definition of HATW showing significant clinical utility as an ECG finding of acute coronary occlusion in potential acute coronary syndrome patients.」此條已改成不含數字的定義型判準，一個原始來源即足。原稿的數字（0.7、98.4%、20.7%、47.4%、12.54、84%、N = 1,300、QRS ≥110 ms）本次找第二來源：Dr. Smith''s ECG Blog《OMI Facts and References》《OMI Literature Timeline》（查核者 curl 原頁，只有書目、無這組數字）；搜尋子代理另查 JACC Adv editorial（Khlidj 2025, PMC12662095）、Powerful Medical 網站、新聞與 EM 部落格，亦未找到逐字覆誦（此為否定性結果，未引入任何內容）；ECG Weekly 會員制打不開不算。故數字全部拿掉。'
    refs:
    - label: Meyers HP, Simančík F, Herman R, Rafajdus A, Frick WH, Nunes de Alencar J, Aslanger EK, Smith SW. Hyperacute T Waves Are Specific for Occlusion Myocardial Infarction, Even Without Diagnostic ST-Segment Elevation. JACC Adv. 2025;4(10 Pt 2):102120. PMID 40892623
      url: https://pubmed.ncbi.nlm.nih.gov/40892623/
