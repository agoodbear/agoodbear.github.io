  findings:
  - id: t-qrs-ratio
    name: Ant.STE(出現QS pattern)，懷疑LV aneurysm with STEMI
    short: T/QRS ratio
    full: T/QRS ratio
    part: Part 4 特別計算
    look: '**有STE，而且V1–V4前面躺著well-formed Q wave / QS wave** ➜ T/QRS ratio。單一lead和總和兩種算法打架 ➜ **ED echo**。'
    look_src: MF0-IVPRb, E6cZzeJdV（拿掉兩個切點，待查證後放回）
    leads:
    - V1–V4
    pitfall: 這條rule只分「acute STEMI」和「subacute／old MI」，**不能**拿來分early repol（那是4-variable formula的地盤）；單一lead和總和兩種比值打架時不要用猜的，直接**ED echo**。另外一定要問症狀多久：**症狀拖得比較久的acute MI，T wave可能已經變小，會被這條rule誤判成LV aneurysm。**
    pitfall_src: roam:93bDPmHow, roam:eLU3MutnX, roam:UDZQ9I8Bz, pmid:15915398
    points:
    - text: '**適用前提**：V1–V4的STE前面躺著well-formed Q wave，或至少一個QS wave，先確認是LVA（LV aneurysm）morphology的地盤，才用這條rule分「舊疤」還是「現在正在燒」。QS wave的精確定義請看Smith部落格原文。這條**不能**拿來分early repol，那是4-variable formula的工作，插錯孔會給錯答案。'
      src: roam:93bDPmHow
    - text: '**記憶口訣：T wave是火，QRS是牆。** acute MI的T wave相對QRS是大的；old MI／LV aneurysm的T wave是小的：看火有沒有燒過牆頭。'
      src: roam:IOpwkJTlm
    - text: '**怎麼算**：V1–V4逐一量T wave amplitude與QRS amplitude。每個lead各算一次T÷QRS，取最大的那個；再把四個T加總、四個QRS加總後相除，算一次總和比值。兩個比值各對各的切點，不能混用。'
      src: roam:yFOxbNdoW, pmid:25862248
    criteria:
    - text: '**單一lead比值**：V1–V4任一lead的T/QRS ratio ≥0.36 ➜ 偏acute anterior STEMI；V1–V4全部 <0.36 ➜ 偏LV aneurysm。（Klein 2015寫「≥0.36」，LITFL寫「>0.36」，差別只在剛好等於0.36那一點。）'
      src:
      - pmid:25862248
      - url:https://litfl.com/left-ventricular-aneursym-ecg-library/
      verified: '①原始研究：Klein LR, Shroff GR, Beeman W, Smith SW. Am J Emerg Med. 2015;33(6):786-90（PMID 25862248，本次 eutils efetch 逐字）："The second rule states that if any 1 lead (V1-V4) has a T-wave amplitude to QRS amplitude ratio greater than or equal to 0.36, then acute ST-segment elevation MI is predicted."

        ②獨立來源（非 Smith 作者群）：LITFL《Left Ventricular Aneurysm》（Ed Burns, Robert Buttner；本次 curl 原始 HTML 逐字）："T-wave/QRS ratio < 0.36 in all precordial leads favours LV aneurysm T-wave/QRS ratio > 0.36 in any precordial lead favours anterior STEMI"

        ③補強：Rosen''s Emergency Medicine 10th ed. p.1007（本機教科書索引逐字）："if the ratio of the amplitude of the T wave to the QRS complex exceeds 0.36 in any single lead, the ECG probably reflects STEMI. If the ratio is less than 0.36 in all leads, however, the findings are likely the result of a ventricular aneurysm."'
    - text: '**總和比值**：(V1–V4的T wave amplitude總和) ÷ (V1–V4的QRS amplitude總和) >0.22 ➜ 偏acute anterior STEMI。0.22只配總和比值，不能拿去套單一lead。'
      src:
      - pmid:15915398
      - book:Electrocardiogram in Clinical Medicine (Wiley, 2021) p.415
      verified: '①原始研究：Smith SW. Am J Emerg Med. 2005;23(3):279-87（PMID 15915398，本次 eutils efetch 逐字）："The best discriminator was T amplitude sum to QRS amplitude sum ratio V1-V4, misclassifying only 4 (6.8%) of 59 cases at a cutoff of >0.22 for AMI."

        ②獨立來源（非 Smith 作者群）：Brady WJ, Lipinski MJ, Darby AE, Bond MC, Charlton NP, Hudson K, Williamson K, eds. Electrocardiogram in Clinical Medicine. Wiley; 2021. p.415（本機教科書索引逐字；全書索引中 Smith 只以被引文獻出現，不是作者或編者）："When the (Sum of the T‐wave amplitude) ÷ (Sum of the QRS amplitude) in leads V1–V4 is >0.22 or if the ratio of T‐wave amplitude to QRS amplitude in any single lead is >0.36, STEMI is favored."

        註：Klein 2015 abstract 也重述 >0.22，但 Smith SW 是共同作者，不計為獨立路徑；Mattu 2e p.231 也有同一切點（OCR 把 0.22 辨識成「(22」，僅供參考）。'
    slides:
    - src: /images/omi/t-qrs-ratio-slide-2025-093.webp
      width: 1600
      height: 1200
      alt: 投影片標題「T/QRS ratio」：上排標STEMI的12導極心電圖，V2藍框標示T/QRS=9/16=0.56；下排標LV aneurysm的12導極心電圖，V2藍框標示T/QRS=5/22=0.22，兩張心電圖上下對照
      caption: 取自我 2025 年奇美住院醫師 ECG 教學投影片（slide 93）：STEMI 與 LV aneurysm 的 V2 單一 lead T/QRS 示範量測（0.56 vs. 0.22）
      src_note: ~/Desktop/Claude Code專用檔/keynote-search/slides/d1b0e6d05c1/slide_093.png；crop=None
    refs:
    - label: Smith SW. T/QRS ratio best distinguishes ventricular aneurysm from anterior myocardial infarction. Am J Emerg Med. 2005 May;23(3):279-87. PMID 15915398
      url: https://pubmed.ncbi.nlm.nih.gov/15915398/
    - label: Klein LR, Shroff GR, Beeman W, Smith SW. Electrocardiographic criteria to differentiate acute anterior ST-elevation myocardial infarction from left ventricular aneurysm. Am J Emerg Med. 2015 Jun;33(6):786-90. PMID 25862248
      url: https://pubmed.ncbi.nlm.nih.gov/25862248/
    - label: LITFL ECG Library：Left Ventricular Aneurysm
      url: https://litfl.com/left-ventricular-aneursym-ecg-library/
    - label: Dr. Smith's ECG Blog：Chest Pain, "Negative" Stress Tests, POCUS, & ECG Equations - A Case from Salim Rezaie (R.E.B.E.L. EM)
      url: https://drsmithsecgblog.com/chest-pain-negative-stress-tests-pocus/
  - id: four-variable
    name: Subtle STE over ant.leads運用4 variable formula
    short: 4-variable formula
    full: 4-variable formula
    part: Part 4 特別計算
    look: '**有STE，沒有Q wave，V2–V4長得像early repol** ➜ 先看TQRSD；沒有TQRSD、也過了其他前提閘 ➜ 4-variable formula。記得：**公式只能往上加碼。**'
    look_src: ZPS04RE7E, yxC-ylCFX, QsBZO0Xsj, gA_6OiJSK（拿掉公式切點，待查證後放回）
    leads:
    - V2–V4
    pitfall: '**看到TQRSD不要算公式，直接當OMI處理**。算了反而可能給你一個安心的假數字。'
    pitfall_src: 1NbaRR_tl
    points:
    - text: '**適用前提（一定要先過閘，沒過就不要算）**：V2–V4至少一個lead有≥1 mm STE，而且**沒有**LVH、V2–V4的Q wave／QS、inferior或precordial STD、TQRSD、precordial TWI、straight或convex的ST、>5 mm的STE。沒過閘的去向不一樣：有TQRSD或STD ➜ 已經是obvious OMI，直接Call CV；有Q wave／QS ➜ 改用[T/QRS ratio](/omi/#t-qrs-ratio)；有LVH ➜ 不要算，看baseline ECG、做echo；有precordial TWI ➜ 想Wellens；straight／convex ST或>5 mm STE ➜ 已超出subtle的範圍，不用算。'
      src: roam:A6eJkEHZo, url:https://www.mdcalc.com/calc/10079/subtle-anterior-stemi-calculator-4-variable, pmid:28460689
    - text: '**兩條公式的關係**：3-variable formula（Smith 2012）用STE60V3、QTc、RAV4三個變數；4-variable formula（Driver 2017）在這三個之外再加上**QRSV2**（V2整個QRS的振幅）。推導研究和土耳其的外部驗證都顯示4-variable比3-variable好，MDCalc也已經用4-variable版取代舊的3-variable版。**係數一個都不能改。**'
      src: roam:fI5h7MD94, pmid:28460689, pmid:29938879, url:https://www.mdcalc.com/calc/10079/subtle-anterior-stemi-calculator-4-variable
    - text: '**最重要的一句話**：這條公式只能「把懷疑升級」，不能「把懷疑取消」，算出來低於切點，不代表可以放心讓病人回家。原本就覺得像LAD occlusion，公式算出來偏低，也不該因此翻案。'
      src: roam:IrewoDh9P
    criteria:
    - text: '**3-variable formula（Smith 2012）**：(1.196 × STE60V3) + (0.059 × QTc) − (0.326 × RAV4)；STE60V3與RAV4單位mm，QTc是電腦判讀的QTc（ms）。**>23.4** ➜ 偏LAD occlusion；**≤23.4** ➜ 偏early repolarization。'
      src:
      - pmid:22520989
      - url:https://www.aliem.com/pv-card-early-repolarization-vs-stemi-on-ekg/
      verified: '①原始研究：Smith SW, Khalil A, Henry TD, et al. Ann Emerg Med. 2012;60(1):45-56.e2（PMID 22520989，本次 eutils efetch 逐字）："if the value of the equation ([1.196 x ST-segment elevation 60 ms after the J point in lead V3 in mm]+[0.059 x QTc in ms]-[0.326 x R-wave amplitude in lead V4 in mm]) is greater than 23.4 predicted STEMI and if less than or equal to 23.4, it predicted early repolarization"

        ②獨立來源（非 Smith 作者群）：ALiEM《PV card: Early repolarization vs STEMI on ECG》（Michelle Lin；本次 curl 原始 HTML 逐字）："(1.196 x STE60V3) + (0.059 x QTc) – (0.326 x RA V4)"、"QTc = The computer-read QTc interval"、"A result of > 23.4 is predictive of a LAD occlusion causing a STEMI, rather than early repolarization."

        註：Driver 2017 abstract 把 3-variable 切點寫成「≥23.4」；Bozbeyoğlu 2018 外部驗證用「recommended cut-point of 23.5」。本條照原始研究寫 >23.4。'
    - text: '**4-variable formula（Driver 2017）**：(1.062 × STE60V3) + (0.052 × QTc) − (0.151 × QRSV2) − (0.268 × RAV4)；STE60V3、QRSV2、RAV4單位mm，QTc是Bazett校正QT（ms）。**≥18.2** ➜ 偏LAD occlusion（anterior STEMI）；**<18.2** ➜ 偏early repolarization。'
      src:
      - pmid:28460689
      - url:https://www.mdcalc.com/calc/10079/subtle-anterior-stemi-calculator-4-variable
      - pmid:29938879
      - pmid:37633077
      verified: '①原始研究：Driver BE, Khalil A, Henry T, Kazmi F, Adil A, Smith SW. J Electrocardiol. 2017;50(5):561-569（PMID 28460689，本次 eutils efetch 逐字）："The derived 4-variable formula is: 0.052*QTc-B - 0.151*QRSV2 - 0.268*RV4 + 1.062*STE60V3."、"The cutpoint with the highest accuracy (92.0%) was at a cutoff value ≥18.2"

        ②第二來源（交辦指定可用的 MDCalc；頁面 creator 欄列 Dr. Stephen W. Smith）：MDCalc《Subtle Anterior STEMI Calculator (4-Variable)》（本次 curl 頁面資料逐字）："Subtle Anterior STEMI 4-Variable Calculation = 0.052 x (Bazett-corrected QT interval, ms) - 0.151 x (QRS amplitude in lead V2, mm) - 0.268 x (R wave amplitude in lead V4, mm) + 1.062 x (ST segment elevation 60 ms after the J point in lead V3, mm)"、"Scores ≥18.2 are likely to be anterior STEMI"、"Scores <18.2 are likely to be benign early repolarization."

        ③切點另有兩篇非 Smith 作者群論文：Bozbeyoğlu E, et al. Ann Noninvasive Electrocardiol. 2018（PMID 29938879）："The four-variable formula, with the published cut-point of 18.2"；Sert ET, Gül M, Kokulu K, Mutlu H. Am J Emerg Med. 2023（PMID 37633077）："When the cut-off value for the four-variable formula was taken as ≥18.2"'
