  - id: northern-omi
    name: Northern OMI
    new2025: true
    part: Part 3（下）不相鄰導程
    look: 這個pattern目前只有一篇單中心、回溯的研究，判準與證據等級請直接看Part 3（下）。我在這裡**不自己給定義**，免得害你記到錯的東西。
    look_src: Zrcv2hNMj（拿掉研究人數，待查證後放回）
    leads:
    - aVR
    - aVL
    - II／III／aVF
    leads_src: pmid:41719915（摘要修改版判準逐字）; roam:R4Dk1z3f2（原稿：核心是aVR和aVL一起STE、下壁reciprocal STD）
    pitfall: '**判準還沒有共識**（見上），抓核心：aVR和aVL一起STE＋下壁reciprocal STD；週邊條件（V4–V6、T wave方向）各家寫法不同，不要硬背。DDx要想到**急性顱內事件**：Ni 2026收案的病人裡，就有人最後歸因於acute brainstem hemorrhage，不是OMI。LVH、BBB等會造成baseline ST-T異常的狀況，也會讓這種靠形狀認的pattern不可靠，要跟舊片比對。'
    pitfall_src: roam:R4Dk1z3f2, roam:A3TYEasIY, roam:uIEjnK7aY, roam:vWJA4UKXX; pmid:41719915
    points:
    - text: Northern OMI指**ST向量朝正上方（north）**：aVR和aVL一起STE，下壁出現reciprocal STD。Dr. Smith's ECG Blog的說法是：這是跟心臟**base**（心臟最上面、心房正下方，特別可能是septum的base）subepicardial（transmural）ischemia相關的STEMI pattern。同一篇文章裡，提供病例的Amandeep Singh寫到它可能來自left main occlusion、proximal LAD occlusion，或多血管冠狀動脈疾病。
      src: roam:o9WAIS2JO, roam:Shu4dN5Rx; url:https://drsmithsecgblog.com/what-is-this-pattern/
    - text: ⚠️ **證據很薄，要誠實講**：Dr. Smith's ECG Blog自己稱它是「a vaguely defined pattern」。我們查到的原始研究只有Ni 2026一篇**小型回溯性病例分析**（作者群來自同一家醫院），作者也說收進來的病人「並沒有完全符合現行的Northern OMI診斷準則」，所以提出修改版。各來源寫法不同：Dr. Smith's ECG Blog（2025-12-18）列的特徵是aVR、aVL STE（often with negative T-waves）＋inferior（II、III、aVF）與lateral（V4–V6）STD（T wave positive或biphasic）；Ni 2026修改版只寫aVR、aVL STE＋至少II、III、aVF的reciprocal STD。**認得它，但不要靠它。**
      src: roam:ZbwJzJsLS, roam:Z7FbJY3Tr, roam:of3ZvK22W, roam:-w70Z3fY4; url:https://drsmithsecgblog.com/what-is-this-pattern/; pmid:41719915
    - text: 跟[aVR STE + multiple leads STD](/omi/#avr-ste)不一樣：Smith在2019年整理完全left main occlusion的個案（他自稱anecdotal cases）時，裡面就有Northern OMI pattern，而且他明講「LM occlusion does not present with isolated STE in aVR」。所以**看到aVR STE，第一件事去看aVL**：aVL也一起STE、下壁有reciprocal STD，就要想到Northern OMI。
      src: roam:o4L7gjbxA, roam:6euSJrQH0, roam:sNLGMvzyZ, roam:rDIAXC9XC; url:https://drsmithsecgblog.com/how-does-acute-left-main-occlusion/
    criteria:
    - text: Ni 2026提出的修改版判準：aVR和aVL有STE，合併至少II、III、aVF的reciprocal STD（摘要所列判準沒有提T wave方向，也沒有要求V4–V6）。這是小型回溯性病例分析提出的建議，不是經過驗證的標準。
      src:
      - pmid:41719915
      verified: 2026-09-14 eutils esummary：Ni H, Wan X, Shi T, Gao Z, Pan H. A new and modified northern occlusion myocardial infarction pattern. J Electrocardiol. 2026 Mar-Apr;95:154212（作者、標題、卷期一致；作者單位皆為 Affiliated Hospital of Jiaxing University）。efetch 摘要逐字：『This study proposes an modified diagnostic criterion characterized by ST-segment elevation in leads aVR and aVL, accompanied by reciprocal ST-segment depression (STD) in at least leads II, III, and aVF.』研究設計逐字『We conducted a retrospective analysis』；限制逐字『The current diagnostic model for Northern OMI may have limitations.』定義型判準，無數字。全文（Elsevier）未取得，所以『沒有提T wave方向／沒有要求V4–V6』只就摘要而言。拿掉的數字：18個月、9位、8位OMI、1位腦幹出血——只有這篇摘要一個來源，找不到獨立第二來源（Deng 2026 綜論、Gorgels 2026 摘要、Smith blog 都沒有寫）。
    refs:
