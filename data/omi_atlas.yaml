  - id: south-african-flag
    name: South African Flag sign
    part: Part 3（下）不相鄰導程
    look: '**I、aVL、V2三個lead都STE**（V2那個「跳過V1、不連續」的STE就是靈魂），**reciprocal STD在lead III**（常延伸II、aVF） ➜ South African Flag sign。'
    look_src: PhgzEki87
    leads:
    - I
    - aVL
    - V2
    - III
    artery: first diagonal
    artery_src: PhgzEki87
    pitfall: V2若是rSr'合併輕微saddleback（漸進上斜）的ST elevation，形狀跟真正SAF sign常見的V2 STE不一樣，要想到**V2電極貼太高**（Ken Grauer在一個病例中的判斷）。若只有V2抬、其他胸前導程乾淨，偏向D1／D2阻塞；V3、V4也開始抬，可能是LAD occlusion還在evolve：兩種都要Call CV man。證據等級要誠實講：原始描述是Durant & Singh 2015的單一病例報告，命名的Littmann 2016是Letter（PubMed分類：Letter、Comment），標題自稱a teaching tool；PubMed上以這個sign為題的文獻大多是case report。**不要把它當成已驗證的診斷規則**。
    pitfall_src: roam:9Yf746kzf, roam:Tk2DfVxxo, roam:xB9157nya, roam:6JJc_vACY, roam:4wMbcGE-e, roam:ULl9WW-Yq; url:https://drsmithsecgblog.com/acute-omi-or-benign-early-repolarization/; url:https://drsmithsecgblog.com/a-woman-in-her-30s-with-sudden-chest/; pmid:26527178; pmid:25722286
    points:
    - text: '**STE in lead I、aVL、V2**＋**reciprocal STD in lead III**（II、aVF常伴隨，但III最明顯）。aVL和V2在紙上分屬兩區，照傳統分組不相鄰。'
      src: roam:nrFi_-Awq, roam:YhJ_-VEEa, roam:YKSHUVhRS; url:https://www.ekgblog.com/2026/08/ecg-blog-540-does-it-fit-clinical.html; url:https://litfl.com/high-lateral-stemi-ecg-library/
    - text: Ken Grauer補的第三條：**除了V2，其他胸前導程都沒有STE**。這條是拿來跟「LAD occlusion還在evolve、STE還沒擴到V2以外的胸前導程」做鑑別的關鍵。
      src: roam:RNzY-_7Lg, roam:mTMKE52_d, roam:6JJc_vACY; url:https://www.ekgblog.com/2026/08/ecg-blog-540-does-it-fit-clinical.html; url:https://drsmithsecgblog.com/a-woman-in-her-30s-with-sudden-chest/
    - text: 為什麼容易漏：aVL和V2在傳統分組裡不算相鄰導程，所以1st或2nd diagonal阻塞造成的「aVL＋V2 STE、其他胸前導程沒有」這個pattern，照定義就可能湊不到「兩個相鄰導程」的STEMI criteria。
