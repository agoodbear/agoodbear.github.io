# Guideline集散地 英文對照檔（英文頁 /en/guideline-pdfs/ 與英文首頁「Pinned」區塊用）
#
# 中文 data/guideline_hub.yaml 是唯一正本：份數、年份、doc、連結、PDF 都只看中文那份。
# 這裡只放「含中文、要翻給英文讀者看」的字，用 id 對上：
#   page.hub        頁首標題與導言
#   topics.<id>     主題（標題本來就是英文的不用翻，只翻 subtitle）
#   badges.<中文>   群組旁邊的地區小標（美國、歐洲……）
#   groups.<中文>   中文群組名
#   entries.<doc>   每份 guideline 的 note、flag；標題或 citation 含中文才翻
#
# 新增／改了中文 guideline 之後：
#   python3 scripts/i18n/data_i18n.py check hub     # FAIL/STALE 要修到 0
#   python3 scripts/i18n/data_i18n.py skeleton hub  # 產生骨架，挑新的那幾筆貼進來翻
#   英文改好跑 python3 scripts/i18n/data_i18n.py rehash hub 更新 zh_hash
# 台灣學會中文 guideline 的英文標題與作者英文名，一律照 PDF 英文摘要頁印的，不自己翻譯或拼音。

page:
  hub:
    title: "Guideline Hub"
    intro: "Guidelines I use in the ED: AMI/ACS, the universal definition of MI, ischemic stroke, ACLS/PALS, trauma, sepsis, POCUS and the difficult airway. Documents with a PDF open in the in-site Reader; the rest link to the original. Newest first, and the latest document in each group is flagged."
    zh_hash: '13dc4386e1'

