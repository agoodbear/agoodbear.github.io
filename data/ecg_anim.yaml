# ECG動畫館（/ecg-anim/）資料檔：動畫館頁、ecganim shortcode、OMI圖鑑的「▶ 動畫」連結都只看這一份。
#
# 上線規則：Bear 親自看過一支，才公開一支。
#   published: false＝不出現在任何地方（動畫館頁、shortcode、圖鑑連結都看不到）。
#   hidden: true＝永遠不顯示（就算 published 也不顯示），留著只是記錄。
#   上架一律跑 ~/Desktop/Claude Code專用檔/animations/_workflow/publish_anim.sh <id>
#   （抽 poster → 傳 R2 → curl 驗 → 把這裡改成 published: true、填 published_at），不要手動改 published。
#
# 欄位：
#   id        網址錨點與 shortcode 代號（/ecg-anim/#hatw、ecganim "hatw"）。OMI 系列沿用 data/omi_atlas.yaml 的 id，
#             圖鑑靠這個 id 對上。上線後就不要改。
#   point     一句重點：取自該片片尾卡的畫面文字（片尾卡文字已對過該片事實表），不另加醫學主張或數字。
#   duration  秒，ffprobe 量主檔（2026-10-01）。頁面顯示成 m:ss。
#   refs      照該片事實表「片尾書目」原文抄；事實表沒有書目的，照片尾卡畫面上的「參考：」抄，來源記在 refs_src。
#   video／phone／poster  R2 key（bucket ecg-anim，公開網域見 base_url）。key 帶版號，換版就換 key、不覆蓋舊檔。
#   src／src_phone        本機檔（相對 ~/Desktop/Claude Code專用檔/animations/），上架腳本從這裡讀。
#   poster_at 抽 poster 的秒數（預設 2）。
#   facts     本機事實表（相對同一個 animations 資料夾），只記錄、不顯示。
#   TODO      找不到可靠出處的欄位，Bear 確認前不要上架。

base_url: https://anim.agoodbear.com/

series:
- id: omi
  name: OMI系列
  intro: OMI圖鑑20個finding，一個finding一支短片。
- id: mechanism
  name: 基礎機轉
  intro: 心電圖的波從哪裡來、ST為什麼會抬高。
- id: ddx
  name: 鑑別診斷
  intro: 長得像的兩個東西，放在一起比。

items:

