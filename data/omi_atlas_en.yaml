  n-wave:
    name: N wave sign
    part: 'Part 3 (B): Noncontiguous leads'
    look: '**In II/III/aVF or I/aVL**, a **terminal QRS notch/deflection** and **a wider QRS in that lead** ➜ N wave sign. Full criteria in Part 3 (B).'
    artery: LCx/OM
    pitfall: '**The biggest trap: mistaking benign early repolarization for an N wave**. And never sort it out by "which lead": lead location only tells you "if it is an N wave, where the culprit is"; it can''t tell you "whether it is an N wave."'
    leads:
    - II/III/aVF
    - I/aVL
    points:
    - 'N wave sign = **an extra notch or deflection at the end of the QRS**. The original Niu 2013 study defines it with four criteria: ① a notch/deflection at the terminal QRS ② a height cutoff of 2 mm (referenced to the PR segment) ③ continuous change of the notch within 24 hours (even disappearing or turning into an S wave) ④ prolonged QRS duration in these leads. The mechanism is a delayed activation wave from the **left ventricular basal region** (LCx territory): "the whole class hands in their exams together, but one student writes too slowly and hands it in last."'
    - 'To tell it apart from a benign J wave (early repolarization), **don''t just look at which lead it''s in**: lead location can only tell you "if it is an N wave, where the culprit might be," not "whether it is an N wave." Look at what the criteria themselves require: ① height (benign ones often aren''t this big) ② dynamics (an N wave changes within 24 hours; benign early repol is static, the old ECGs looked like this too) ③ whether the QRS is widened (an N wave is delayed activation and drags out the QRS); then add the clinical context (ACS symptoms or not) and comparison with old ECGs.'
    - 'Picking up the LCx: N wave in II, III, aVF, sensitivity 77%, specificity 89%. ⚠️ The target condition for these numbers is **whether the culprit is the LCx, in patients with confirmed NSTEMI who underwent coronary angiography**, not "picking out OMI among chest pain patients," so **they can''t be lined up side by side with the numbers for the earlier findings**. A study from another group (Rostoff 2020) came out more conservative: among patients with an LCx/OM culprit, the most common finding was T-wave precordial instability, not the N wave; an N wave in aVL was an independent predictor of an LCx/OM culprit, but patients with an LAD/diagonal culprit also showed inferior N waves. **The N wave is a clue pointing to the LCx, not a high-sensitivity screening tool.**'
    criteria:
    - 'The N wave definition in the original Niu 2013 study: ① a notch or deflection at the terminal QRS; ② notch/deflection height cutoff of 2 mm (referenced to the PR segment; the original says ≥2 mm, the independent source Alsagaff 2022 says >2 mm); ③ continuous change of the notch within 24 hours, even disappearing or turning into an S wave; ④ prolonged QRS duration in these leads.'
    - 'N wave in II, III, aVF: sensitivity 77%, specificity 89% for identifying an LCx culprit (population: NSTEMI patients who underwent coronary angiography; the target condition is "is the culprit the LCx," not "is there an OMI").'
    - 'NSTEMI with an N wave (N-NSTEMI): among patients with an LCx culprit, the incidence of all MACE, all-cause death, stent thrombosis, TVR, and recurrent unstable angina was similar to STEMI and higher than in NSTEMI without an N wave; the authors conclude that N-NSTEMI carries a risk equivalent to acute STEMI.'
    refs:
    - Niu T, Fu P, Jia C, Dong Y, Liang C, Cao Q, Yang Z, Fu R, Zhang X, Sun Z. The delayed activation wave in non-ST-elevation myocardial infarction. Int J Cardiol. 2013 Jan 10;162(2):107-11. PMID 21663984
    - 'Alsagaff MY, Wardhani LFK, Pratanu I, Kartikasari DP, Doevendans PA. NSTEMI with total left circumflex occlusion: how the N-wave might help (case report). Oxf Med Case Reports. 2022 Feb;2022(2):omac010. PMID 35198230'
    - Yang T, Chen J, Liu X, Xu C, Niu T, Fu X, Fu P. Non-ST-elevated myocardial infarction with "N" wave on electrocardiogram and culprit vessel in left circumflex has a risk equivalent to ST-elevated myocardial infarction. Clin Cardiol. 2020 May;43(5):491-499. PMID 32032438
    - 'Rostoff P, Wisniewski P, Gajos G, Konduracka E, Nessler J, Kruszelnicka O. Electrocardiographic identification of the culprit coronary artery in acute non-ST-elevation myocardial infarction: predictive value of N-wave and T-wave precordial instability. Coron Artery Dis. 2020 Nov;31(7):590-596. PMID 32568742'
    zh_hash: '85a44049b8'
  t-qrs-ratio:
    name: 'Ant.STE (QS pattern present): suspect LV aneurysm with STEMI'
    full: T/QRS ratio
    short: T/QRS ratio
    part: 'Part 4: Special calculations'
    look: '**STE, with well-formed Q waves / QS waves sitting in front of it in V1–V4** ➜ T/QRS ratio. If the single-lead and sum methods disagree ➜ **ED echo**.'
    pitfall: 'This rule only separates "acute STEMI" from "subacute/old MI"; it **can''t** be used to separate out early repol (that''s the 4-variable formula''s turf). When the single-lead and sum ratios disagree, don''t guess; go straight to **ED echo**. Also, always ask how long the symptoms have lasted: **in an acute MI whose symptoms have dragged on longer, the T wave may already have shrunk, and this rule can misread it as LV aneurysm.**'
    leads:
    - V1–V4
    points:
    - '**Prerequisite**: well-formed Q waves, or at least one QS wave, sitting in front of the STE in V1–V4. First confirm you''re in LVA (LV aneurysm) morphology territory, then use this rule to sort "old scar" from "burning right now." For the exact definition of a QS wave, see Smith''s original blog post. This rule **can''t** be used to separate out early repol; that''s the 4-variable formula''s job, and plugging into the wrong socket gives the wrong answer.'
    - '**Mnemonic: the T wave is the fire, the QRS is the wall.** In acute MI the T wave is large relative to the QRS; in old MI/LV aneurysm the T wave is small: see whether the fire has burned over the top of the wall.'
    - '**How to calculate**: measure T-wave amplitude and QRS amplitude in each of V1–V4. Compute T÷QRS once for each lead and take the largest; then sum the four T''s and the four QRS''s and divide, for one sum ratio. Each ratio goes with its own cutoff; don''t mix them.'
    criteria:
    - '**Single-lead ratio**: T/QRS ratio ≥0.36 in any lead V1–V4 ➜ favors acute anterior STEMI; all of V1–V4 <0.36 ➜ favors LV aneurysm. (Klein 2015 writes ≥0.36, LITFL writes >0.36; the only difference is the point exactly at 0.36.)'
    - '**Sum ratio**: (sum of T-wave amplitudes in V1–V4) ÷ (sum of QRS amplitudes in V1–V4) >0.22 ➜ favors acute anterior STEMI. 0.22 goes only with the sum ratio; don''t apply it to a single lead.'
    slides:
    - alt: 'Slide titled "T/QRS ratio": top row, a 12-lead ECG labeled STEMI, with V2 boxed in blue and marked T/QRS=9/16=0.56; bottom row, a 12-lead ECG labeled LV aneurysm, with V2 boxed in blue and marked T/QRS=5/22=0.22; the two ECGs are compared top and bottom'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 93): example single-lead T/QRS measurements in V2 for STEMI vs LV aneurysm (0.56 vs. 0.22)'
    refs:
    - Smith SW. T/QRS ratio best distinguishes ventricular aneurysm from anterior myocardial infarction. Am J Emerg Med. 2005 May;23(3):279-87. PMID 15915398
    - Klein LR, Shroff GR, Beeman W, Smith SW. Electrocardiographic criteria to differentiate acute anterior ST-elevation myocardial infarction from left ventricular aneurysm. Am J Emerg Med. 2015 Jun;33(6):786-90. PMID 25862248
    - 'LITFL ECG Library: Left Ventricular Aneurysm'
    - 'Dr. Smith''s ECG Blog: Chest Pain, "Negative" Stress Tests, POCUS, & ECG Equations - A Case from Salim Rezaie (R.E.B.E.L. EM)'
    zh_hash: 'dc66474b78'
  four-variable:
    name: 'Subtle STE over ant.leads: apply the 4 variable formula'
    full: 4-variable formula
    short: 4-variable formula
    part: 'Part 4: Special calculations'
    look: '**STE, no Q waves, and V2–V4 looks like early repol** ➜ check for TQRSD first; no TQRSD and you''ve also passed the other gates ➜ 4-variable formula. Remember: **the formula can only push suspicion up.**'
    pitfall: '**If you see TQRSD, don''t run the formula; just treat it as OMI**. Running it may actually hand you a falsely reassuring number.'
    leads:
    - V2–V4
    points:
    - '**Prerequisites (you must pass the gate first; if you don''t, don''t calculate)**: ≥1 mm STE in at least one lead of V2–V4, and **none** of the following: LVH, Q waves/QS in V2–V4, inferior or precordial STD, TQRSD, precordial TWI, straight or convex ST, STE >5 mm. Failing the gate sends you different places: TQRSD or STD ➜ already obvious OMI, Call CV directly; Q waves/QS ➜ switch to [T/QRS ratio](/omi/#t-qrs-ratio); LVH ➜ don''t calculate, look at the baseline ECG and get an echo; precordial TWI ➜ think Wellens; straight/convex ST or STE >5 mm ➜ already beyond subtle, no need to calculate.'
    - '**How the two formulas relate**: the 3-variable formula (Smith 2012) uses three variables, STE60V3, QTc, and RAV4; the 4-variable formula (Driver 2017) adds **QRSV2** (the total QRS amplitude in V2) on top of those three. The derivation study and the Turkish external validation both show the 4-variable beats the 3-variable, and MDCalc has already replaced the old 3-variable version with the 4-variable one. **Don''t change a single coefficient.**'
    - '**The single most important line**: this formula can only "escalate suspicion," not "cancel suspicion." A result below the cutoff doesn''t mean you can comfortably send the patient home. If it already looked like an LAD occlusion to you, a low formula result shouldn''t overturn that.'
    criteria:
    - '**3-variable formula (Smith 2012)**: (1.196 × STE60V3) + (0.059 × QTc) − (0.326 × RAV4); STE60V3 and RAV4 in mm, QTc is the computer-read QTc (ms). **>23.4** ➜ favors LAD occlusion; **≤23.4** ➜ favors early repolarization.'
    - '**4-variable formula (Driver 2017)**: (1.062 × STE60V3) + (0.052 × QTc) − (0.151 × QRSV2) − (0.268 × RAV4); STE60V3, QRSV2, RAV4 in mm, QTc is the Bazett-corrected QT (ms). **≥18.2** ➜ favors LAD occlusion (anterior STEMI); **<18.2** ➜ favors early repolarization.'
    slides:
    - alt: 'Left side of the slide: segments of V2, V3, and V4, with green rulers marking QRSV2, STEV360, and RAV4; the text in the middle reads, in order (in Chinese), "QRS amplitude in V2", "STE 1.5 small boxes after the J point in V3", "Height of the R wave in V4"; the two columns on the right read "QTc" and "Plug into the equation"'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 343): how to measure the 4-variable formula''s variables, QRSV2, STE60V3 (labeled STEV360 on the slide), and RAV4, then plug them into the equation along with QTc'
    - alt: 'Left side of the slide: a screenshot of the input fields of the MDCalc Subtle Anterior STEMI Calculator (4-Variable): Bazett-corrected QT interval 461 msec, QRS amplitude in lead V2 16 mm, R wave amplitude in lead V4 17 mm, ST segment elevation 60 ms after the J point in lead V3 3 mm (no result shown on screen); on the right, text on light blue (in Chinese): "This equation tells us one thing: in subtle ant.STEMI vs. Early repolarization, STEMI criteria alone are not enough to help diagnose AMI"'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 345): the input screen of the MDCalc Subtle Anterior STEMI Calculator (4-Variable)'
    refs:
    - Smith SW, Khalil A, Henry TD, et al. Electrocardiographic differentiation of early repolarization from subtle anterior ST-segment elevation myocardial infarction. Ann Emerg Med. 2012 Jul;60(1):45-56.e2. PMID 22520989
    - Driver BE, Khalil A, Henry T, Kazmi F, Adil A, Smith SW. A new 4-variable formula to differentiate normal variant ST segment elevation in V2-V4 (early repolarization) from subtle left anterior descending coronary occlusion - Adding QRS amplitude of V2 improves the model. J Electrocardiol. 2017 Sep-Oct;50(5):561-569. PMID 28460689
