  reciprocal-std:
    name: Reciprocal STD change and/or TWI
    short: Reciprocal STD/TWI
    part: 'Part 2: Based on STD'
    look: '**Inferior or lateral STD/TWI, mirroring an STE somewhere** ➜ Reciprocal STD / TWI. Reciprocal change is often more obvious than the STE itself.'
    artery: 'Determined by which wall is opposite, not a single artery: STD in I/aVL → think inferior (II/III/aVF); STD in II/III/aVF → think high lateral (I/aVL); STD in V1–V4 → think posterior (LCx/OM, see [STDmaxV1-4](/omi/#stdmax-v1-4)); STD in V5–V6 with STE in V1 → think septal (proximal LAD, see [Precordial Swirl](/omi/#precordial-swirl)).'
    pitfall: 'A T wave pointing down isn''t necessarily TWI, let alone reciprocal change. The key is "proportion," not "direction": in a lead where the QRS itself is predominantly negative, a T wave that follows it shallowly downward is normal. The ST-T changes of an abnormal QRS itself (LBBB/RBBB/paced rhythm/LVH strain/WPW) are secondary repolarization changes and don''t count as reciprocal; for LBBB and ventricular paced rhythm, switch to the modified Sgarbossa criteria. Also, reciprocal change by definition means "there really is something on the opposite side": if you search all 12 leads and can''t find any STE or hyperacute T wave, that STD is more likely the diffuse subendocardial ischemia of the [aVR STE + multiple leads STD](/omi/#avr-ste) box, not reciprocal.'
    leads:
    - I/aVL
    - II/III/aVF
    points:
    - 'The STD in this finding isn''t the answer itself; it''s a witness for "a subtle STE in another lead": a subtle STE plus reciprocal STD/TWI in the opposite lead goes from "something''s off" to "diagnostic."'
    - 'Remember two things first (the words on my own slide): reciprocal change may appear before the STE, and it may be more obvious than the STE. One mechanism is low voltage: in someone whose QRS is small to begin with, STE that''s proportional to the QRS will be less obvious too, but the STD of reciprocal change isn''t limited that way and may actually stand out more. So in these patients you often see the STD first and the STE after; that STD is pointing the way for you.'
    - 'Memorize the opposite-wall relationships: STD in V1–V4 → think posterior (see [STDmaxV1-4](/omi/#stdmax-v1-4)); STD in I/aVL → think inferior (II/III/aVF); STD in II/III/aVF → think high lateral (I/aVL); STD in V5–V6 with STE in V1 → think septal (see [Precordial Swirl](/omi/#precordial-swirl)). Lead III and aVL have a "magical" mirror-image relationship: proximal LAD occlusion almost always has reciprocal STD in the inferior leads; mid/distal LAD occlusion doesn''t necessarily.'
    criteria:
    - 'Bischof 2016: all 154 inferior STEMIs (100%) had some degree of STD in aVL; subtle inferior STEMIs, with small STE not yet meeting STEMI criteria but with occlusion confirmed at cath (54 patients), also had STD in aVL in 91%.'
    - 'What doesn''t count as reciprocal change: if the QRS in that lead is itself predominantly negative (e.g., aVL when the frontal plane axis is very vertical), a T wave that follows it shallowly downward is a normal variant, not reciprocal change; true reciprocal TWI is disproportionately bulky relative to the size of the negative QRS.'
    slides:
    - alt: 'Slide (in Chinese) titled "Reciprocal Change": a light blue bar at the top, "First, some facts," with text below: "Reciprocal change may appear before the STE," "Reciprocal change may be more obvious than the STE"; a thin light blue bar in the middle, "Important dividing line," and large text below it: "The STD of reciprocal change is benign," "but the STE on the opposite side is lethal." Text only, no images.'
      caption: From my 2021 ECG teaching slides for residents at Shin Kong Wu Ho-Su Memorial Hospital (slide 16)
    refs:
    - Bischof JE, Worrall C, Thompson P, Marti D, Smith SW. ST depression in lead aVL differentiates inferior ST-elevation myocardial infarction from pericarditis. Am J Emerg Med. 2016 Feb;34(2):149-54. PMID 26542793.
    - Pallin DJ. Beware of ST Depression in ECG Lead aVL. NEJM Journal Watch (2016-02-26)
    - Fletcher WO, Gibbons RJ, Clements IP. The relationship of inferior ST depression, lateral ST elevation, and left precordial ST elevation to myocardium at risk in acute anterior myocardial infarction. Am Heart J. 1993 Sep;126(3 Pt 1):526-35. PMID 8362705.
    - 'LITFL: Inferior STEMI (last updated 2024-10-08)'
    - 'Ken Grauer, ECG Blog #426 — Are STEMI Criteria Met? (2024-04-20)'
    - 'Dr. Smith''s ECG Blog (Steve Smith, with Ken Grauer''s comment): A 30-something with acute chest pain (2024-10-03)'
    - 'Dr. Smith''s ECG Blog (with Ken Grauer''s comment): A 58 year old with Weakness and more than 4 mm ST Elevation in V3 (2018-08-09)'
