  subtle-ste:
    name: Subtle STE (not meeting STEMI criteria)
    short: Subtle STE
    part: 'Part 1 (B): QRS and ST'
    look: '**STE present but not reaching STEMI criteria** ➜ Subtle STE'
    pitfall: '**The computer read can''t be trusted**: the words "Normal ECG" have a deadly reassuring effect in a busy ED, but conventional computer algorithms often label an ECG that is actually OMI as completely normal, so whenever the computer says "Normal ECG," read it again yourself, independently. **High-lateral MI** is also especially easy to miss: the ST elevation is mainly in I and aVL (±V2), the reciprocal STD/TWI is in the inferior leads and most pronounced in lead III, and the STE often shows up in noncontiguous leads and gets overlooked. **Ischemia in the LCx territory is also often overlooked on the ECG**; I think this is one special case that Taiwanese EDs are particularly prone to falling for.'
    leads:
    - V2–V3 (stratified by age and sex)
    - the other 10 leads (all ≥1 mm)
    points:
    - 'Subtle STE = **ST elevation that doesn''t reach the STEMI criteria threshold**. The sensitivity of STEMI criteria themselves isn''t high: Hillinger 2019 (prospective, multicenter, software-automated measurement of the first ECG on arrival, compared against the final adjudicated STEMI diagnosis) and Martin 2007 (with ceMRI-diagnosed AMI as the gold standard) both show that relying on STEMI criteria alone misses a large group of MIs.'
    - 'Don''t look only at absolute height (in mm); look at proportion: **in a lead with small QRS voltage, an occluded artery may not be able to squeeze out even 1 mm**. Look instead at **ST-segment morphology** (is it straightening or turning convex? normal early repol is upwardly concave), **whether there''s reciprocal change** (often easier to spot than the STE itself), **whether the T wave is getting fatter along with it**, and compare with the old ECG and with a repeat ECG.'
    - For subtle STE to count, you need **clinical context + morphology + teammates** all present together; it's not about picking up the phone over any tiny bit of STE under 1 mm. That's acting **like you just found a loaded gun**.
    criteria:
    - '**STEMI criteria (Fifth UDMI main text §13; same cutoffs as Fourth UDMI Table 2)**: new ST elevation at the J point in **two contiguous leads**; in V2–V3: men <40 years **≥2.5 mm**, men ≥40 years **≥2 mm**, women of any age **≥1.5 mm**; other leads **≥1 mm**; provided there is **no LVH or LBBB**.'
    - 'AHA Mission: Lifeline (ACTION Registry–GWTG) national registry data (Riley 2013): among patients with a final diagnosis of STEMI, a subset had a **non-diagnostic first ECG** and were diagnosed on subsequent ECGs; most of them developed diagnostic changes shortly after the first ECG; compared with patients diagnosed on the first ECG, there was **no significant difference** in guideline-based treatment, in-hospital major bleeding, or death.'
    slides:
    - alt: 'Slide (in Chinese) with two ECG strips side by side at the top: on the left, subtle ST elevation in lead III (with the figure number 4 printed in the corner); on the right, obvious ST elevation. Below, on a light blue background, the left column "Subtle STE" is inside a pink dashed box with a big X over the words "STEMI Criteria"; the right column reads "Marked STE," and a pink arrow points to a downward arrow and "sensitivity for diagnosing MI."'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 119): look only at STEMI criteria and subtle STE gets missed, so the sensitivity for diagnosing MI drops. The two ECG strips at the top are used for teaching (the slide notes cite Martí 2014).'
    refs:
    - Mills NL, Newby LK, Zaman S, et al. Fifth Universal Definition of Myocardial Infarction (2026). Glob Heart. 2026;21:64. DOI 10.5334/gh.1578 (open access; published simultaneously in Circulation, DOI 10.1161/CIR.0000000000001477)
    - Thygesen K, Alpert JS, Jaffe AS, et al. Fourth Universal Definition of Myocardial Infarction (2018). Circulation. 2018;138(20):e618-e651. PMID 30571511
    - LITFL (Chris Nickson). Acute Coronary Syndromes. CCC Cardiology
    - Hillinger P, et al. Prospective validation of current quantitative electrocardiographic criteria for ST-elevation myocardial infarction. Int J Cardiol. 2019;292:1-12. PMID 31056411
    - Martin TN, et al. ST-segment deviation analysis of the admission 12-lead electrocardiogram as an aid to early diagnosis of acute myocardial infarction with a cardiac magnetic resonance imaging gold standard. J Am Coll Cardiol. 2007;50(11):1021-8. PMID 17825710
    - 'Riley RF, Newby LK, Don CW, et al. Diagnostic time course, treatment, and in-hospital outcomes for patients with ST-segment elevation myocardial infarction presenting with nondiagnostic initial electrocardiogram: a report from the American Heart Association Mission: Lifeline program. Am Heart J. 2013 Jan;165(1):50-6. PMID 23237133'
