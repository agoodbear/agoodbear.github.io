  precordial-swirl:
    name: Precordial Swirl
    part: 'Part 2: Based on STD'
    look: '**STE or a disproportionately upright T in V1 (±V2) + reciprocal STD/TWI in V5–V6** ➜ Precordial Swirl. Think occlusion of the proximal LAD, before the septal branch.'
    artery: Proximal LAD/septal occlusion
    pitfall: '**If there''s LVH or BBB, you can''t use this one.** It looks at the same set of leads as STDmaxV1-4, one pushed down, one lifted up: **get the direction backwards and you''ll guess the artery backwards too.**'
    leads:
    - V1 (±V2)
    - V5–V6
    points:
    - 'The definition formally published in 2025 (Goss et al.): STE and/or hyperacute T waves in V1-V2, with reciprocal STD and/or TWI in V5-V6, forming a "clockwise swirl" across the precordial leads. Mechanism: if the LAD is occluded before the first septal perforator (S1), even the whole septum becomes transmurally ischemic; the septum sits right and anterior, so the injury vector projects onto V1 (and aVR) as STE, while the apex and lateral wall sit at the other end of the vector, so V5 and V6 get reciprocal STD.'
    - 'How to look: first V1. Does the ST-T "not look the way it should" (disproportionate STE/disproportionately upright T/coved shape)? The paper''s quantitative version is a V2 T-wave amplitude ÷ S-wave amplitude > 0.40. Then V6: is there STD? Is that STD a "flat shelf" rather than the "downsloping" LVH strain kind? Is the T wave still upright (classic swirl is flat STD with an upright T)?'
    - 'Telling it apart from [aVR STE + multiple leads STD](/omi/#avr-ste) (diffuse subendocardial ischemia) is just a matter of which is taller: aVR STE > V1 STE → think subendocardial ischemia/left main/3-vessel; V1 STE > aVR STE → think precordial swirl/proximal LAD occluded before S1. This is a reading trick, not a criterion with sens/spec numbers; use it as a clue, not as the only reason.'
    criteria:
    - 'One of the definitions tested in Goss 2025 (the looser version): normal QRS (narrow QRS **and no LVH**) + STD in V5 and/or V6 + any STE in V1 and/or V2. "No LVH" is written into the definition as an exclusion criterion, not a caveat at the end of the paper; co-author Meyers said on Dr. Smith''s ECG Blog (2025-08-18) that LVH and subendocardial ischemia are the two most common mimics of this pattern.'
    slides:
    - alt: 'Top of the slide: six panels of V1/V2 ECGs (black background, red frames, labeled A to F; a figure compiled by Ken Grauer); below, large pink text "V1"; on the right, text: "V1 in A, B, C has disproportionate STE," "V1 in E has a disproportionately upright T wave," "V1 in F has coved-shape STE."'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 226); the six V1/V2 panels at the top: Figure-1 compiled by Ken Grauer, from his comment on Dr. Smith''s ECG Blog post "Precordial Swirl — 20 cases of Swirl or Look-Alikes" (2022-10-15), with ECGs from the cases Dr. Smith provided in that post'
    refs:
    - 'Goss L, Meyers HP, Friedman B, Bracey A, Smith SW. Precordial swirl sign: A new ECG pattern of left anterior descending artery occlusion myocardial infarction. J Electrocardiol. 2025 Jul-Aug;91:153931. PMID 40319770.'
    - 'Dr. Smith''s ECG Blog (Steve Smith, with Ken Grauer''s MY Comment): Precordial Swirl — 20 cases of Swirl or Look-Alikes (2022-10-15)'
    - 'Ken Grauer, ECG Blog #380 — What is "Swirl"? (2023-05-20)'
    - 'Dr. Smith''s ECG Blog (by Pendell Meyers): A man in his 60s with acute chest pain. Is this precordial swirl? (2025-08-18)'
    - Farkas J. ECG Guide (Precordial swirl pattern section). Internet Book of Critical Care (IBCC), EMCrit (2026-05-07)
