  stdmax-v1-4:
    name: STDmaxV1-4 indicative of Post.OMI
    short: STDmaxV1-4
    part: 'Part 2: Based on STD'
    look: '**Maximal STD in V1–V4** ➜ STDmaxV1-4. Posterior OMI until proven otherwise. **Get posterior leads**.'
    artery: LCx/OM (posterior OMI)
    pitfall: 'Negative V7–V9 can''t be used to rule it out. In a case on Dr. Smith''s ECG Blog written by Pendell Meyers, the STD was maximal in V2–V4 with no STE anywhere on the ECG, and posterior leads showed only "a hint of STE"; most cardiologists would say that doesn''t meet posterior lead criteria, yet the angiogram showed total proximal LCx occlusion. Two more points: STD in V1–V4 is occasionally actually subendocardial ischemia, and if the posterior leads also show STD, it looks more like subendocardial ischemia; RBBB/RVH/LVH/LBBB/ventricular paced rhythm/digoxin effect/hypokalemia may all cause non-ischemic STD, so before reading the ST-T, make sure the QRS isn''t hiding something that explains it.'
    leads:
    - V1–V4
    points:
    - 'STDmaxV1-4: ischemic STD in the precordial leads (V1–V6), with the maximal STD in one of V1, V2, V3, or V4 (relative to V5 and V6). The point isn''t "how deep," it''s "which lead is deepest."'
    - 'The mechanism is vectors: posterior OMI is the mirror image of transmural STE on the opposite (posterior) wall, projecting as STD in V1–V4; the summed STD of diffuse subendocardial ischemia points toward the apex (V5, V6). When you see STDmaxV1-4, treat it as posterior OMI until proven otherwise.'
    - 'The precordial QRS/T waves have four bonus clues: horizontal (not upsloping) STD, a dominant R wave in V2 (R/S ratio > 1), a broad R wave (> 30 ms), and upright T waves in V1–V4; these are all what the posterior "mirror image" looks like flipped over. You can use Ken Grauer''s "Mirror Test": flip V1–V3 upside down and see whether it turns into an anterior STEMI you''d recognize.'
    criteria:
    - 'Ischemic STDmaxV1-4 had 97% specificity for OMI (Meyers 2021, 808 high-risk ACS patients). The paper''s title says "of Any Amplitude": this finding has no "how deep does it have to be" threshold; STDmaxV1-4 under 1 mm carries specificity too.'
    - The STE threshold for posterior leads V7–V9 is 0.5 mm, not 1 mm. The AHA/ACCF/HRS 2009 recommendations for standardization of ECG interpretation explicitly set the V7–V9 threshold at 0.05 mV (0.5 mm); the latest Fifth UDMI (2026) only says to confirm with STE in V7–V9 and gives no number. So in practice, keep using it, but don't call it "required by the latest guideline."
    slides:
    - alt: 'Top of the slide: a screenshot of the first page of the JAHA paper, titled "Ischemic ST-Segment Depression Maximal in V1–V4 (Versus V5–V6) of Any Amplitude Is Specific for Occlusion Myocardial Infarction (Versus Nonocclusive Ischemia)," with 13 authors listed, starting with Meyers; the CONCLUSIONS paragraph, highlighted in yellow, gives 97%/96% specificity. Below, a light blue block with my own takeaways in Chinese: "Patients with ACS symptoms, maximal STD in V1~V4: consider OMI first (97% specificity)"'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 170); image: Meyers HP, et al. J Am Heart Assoc. 2021'
    - alt: 'Slide (in Chinese) with two V2 lead sketches side by side: the left one, titled "Anterior STD," has the ST segment pushed down after the QRS; the right one, titled "Posterior STE," is the same waveform flipped upside down, so the ST segment is now elevated. A black arrow in the middle reads "flip vertically," and large text at the bottom says "STD can also be ''STE''."'
      caption: 'From my 2022 ECG teaching slides for residents at Taipei Veterans General Hospital (slide 83): flip anterior STD upside down and you get posterior STE.'
    refs:
    - Meyers HP, Bracey A, Lee D, et al. Ischemic ST-Segment Depression Maximal in V1-V4 (Versus V5-V6) of Any Amplitude Is Specific for Occlusion Myocardial Infarction (Versus Nonocclusive Ischemia). J Am Heart Assoc. 2021 Dec 7;10(23):e022866. PMID 34775811.
    - Shah A, Wagner GS, Green CL, et al. Electrocardiographic differentiation of the ST-segment depression of acute myocardial injury due to the left circumflex artery occlusion from that of myocardial ischemia of nonocclusive etiologies. Am J Cardiol. 1997 Aug 15;80(4):512-3. PMID 9285669.
    - Wung SF, Drew BJ. New electrocardiographic criteria for posterior wall acute myocardial ischemia validated by a percutaneous transluminal coronary angioplasty model of acute myocardial infarction. Am J Cardiol. 2001 Apr 15;87(8):970-4. PMID 11305988.
    - 'Wagner GS, Macfarlane P, Wellens H, et al. AHA/ACCF/HRS recommendations for the standardization and interpretation of the electrocardiogram: part VI: acute ischemia/infarction. Circulation. 2009 Mar 17;119(10):e262-70. PMID 19228819.'
    - Poh KK, Chia BL, Tan HC, Yeo TC, Lim YT. Absence of ST elevation in ECG leads V7, V8, V9 in ischaemia of non-occlusive aetiologies. Int J Cardiol. 2004 Dec;97(3):389-92. PMID 15561323.
