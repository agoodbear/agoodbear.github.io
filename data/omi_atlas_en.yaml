  northern-omi:
    name: Northern OMI
    part: 'Part 3 (B): Noncontiguous leads'
    look: So far there's only one single-center, retrospective study on this pattern; for criteria and level of evidence, go straight to Part 3 (B). I'm **not giving my own definition** here, so you don't end up memorizing the wrong thing.
    pitfall: '**There''s no consensus on criteria yet** (see above). Hold on to the core: STE in aVR and aVL together + inferior reciprocal STD; the peripheral conditions (V4–V6, T-wave direction) are written differently by different sources, so don''t force yourself to memorize them. For the DDx, think of an **acute intracranial event**: among the patients enrolled in Ni 2026, one was ultimately attributed to acute brainstem hemorrhage, not OMI. Conditions that cause baseline ST-T abnormalities, such as LVH and BBB, also make a shape-recognition pattern like this unreliable; compare with old ECGs.'
    leads:
    - aVR
    - aVL
    - II/III/aVF
    points:
    - 'Northern OMI means the **ST vector points straight up (north)**: STE in aVR and aVL together, with reciprocal STD inferiorly. Dr. Smith''s ECG Blog puts it this way: it''s a STEMI pattern associated with subepicardial (transmural) ischemia of the heart''s **base** (the very top of the heart, just below the atria, possibly especially the base of the septum). In the same post, Amandeep Singh, who contributed the case, wrote that it may come from left main occlusion, proximal LAD occlusion, or multivessel coronary artery disease.'
    - '⚠️ **The evidence is thin, and we have to be honest about it**: Dr. Smith''s ECG Blog itself calls it "a vaguely defined pattern." The only original study we found is Ni 2026, a **small retrospective case analysis** (the authors are all from the same hospital), and the authors also say the patients they enrolled did not fully meet the current Northern OMI diagnostic criteria, which is why they propose a modified version. Sources differ: Dr. Smith''s ECG Blog (2025-12-18) lists aVR, aVL STE (often with negative T-waves) + inferior (II, III, aVF) and lateral (V4–V6) STD (T wave positive or biphasic); Ni 2026''s modified version only says aVR, aVL STE + reciprocal STD in at least II, III, aVF. **Recognize it, but don''t rely on it.**'
    - 'Not the same as [aVR STE + multiple leads STD](/omi/#avr-ste): when Smith compiled cases of complete left main occlusion in 2019 (which he himself called anecdotal cases), the Northern OMI pattern was among them, and he states plainly, "LM occlusion does not present with isolated STE in aVR." So **when you see STE in aVR, the first thing to do is look at aVL**: if aVL is elevated too and there''s inferior reciprocal STD, think Northern OMI.'
    criteria:
    - 'Ni 2026''s proposed modified criteria: STE in aVR and aVL, with reciprocal STD in at least II, III, aVF (the criteria listed in the abstract don''t mention T-wave direction and don''t require V4–V6). This is a proposal from a small retrospective case analysis, not a validated standard.'
    slides:
    - alt: 'Slide titled "Northern OMI": a colored ring divided into eight segments, with leads (aVR, aVL, Lead I, Lead II, aVF, III) and corresponding regions (Subendocardial ischemia, High lateral MI, Anterolateral MI, Inferior MI(LCx), Inferior MI(RCA)) labeled around the outside; in the center of the ring is a cartoon heart, with three arrows starting from the center: red pointing to aVR, green pointing to aVL, dark blue pointing straight up.'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 324): the ST vector points straight up (north).'
    refs:
    - Ni H, Wan X, Shi T, Gao Z, Pan H. A new and modified northern occlusion myocardial infarction pattern. J Electrocardiol. 2026 Mar-Apr;95:154212. PMID 41719915
    - 'Dr. Smith''s ECG Blog: What is this pattern? (2025-12-18, case contributed by Amandeep Singh, Highland Hospital)'
    - 'Dr. Smith''s ECG Blog: How does Acute Total Left Main Coronary occlusion present on the ECG? (2019-08-09)'
