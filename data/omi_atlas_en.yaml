  de-winter:
    name: De Winter's T wave
    part: 'Part 3 (A): The three faces of the LAD'
    look: '**J-point STD + upright, tall, symmetric T wave in V1–V6** ➜ de Winter''s T wave. This is the LAD''s anterior STEMI equivalent.'
    artery: proximal LAD (acute, occluding right now)
    pitfall: 'STD + big, tall T waves in V2-V3: don''t jump to de Winter. It may also be a posterior wall MI that just reperfused (Post. Wellens'' syndrome: the terminal TWI of posterior reperfusion, mirrored onto the anterior chest leads, becomes a big, tall upright T wave). If it''s confined to V2-V3, think posterior first; think de Winter when more precordial leads are involved. If the T wave is tall and peaked, don''t forget to rule out hyperkalemia too (in de Winter''s original report, the patients'' admission potassium was normal).'
    leads:
    - V1–V6
    points:
    - 'de Winter = Mount Fuji, but the foot of the mountain sinks 1-3 mm first: upsloping ST depression at the J point runs straight into a tall, symmetric T wave. This is an **acute, ongoing** proximal LAD occlusion.'
    - 'de Winter and Wellens both show up in V2-V4, but one is "present progressive" (acute proximal LAD occlusion) and the other is "past perfect" (sub-acute occlusion: occluded before, open now).'
    - The 2022 ACC expert consensus has listed de Winter's sign as a STEMI equivalent.
    criteria:
    - 'Upsloping ST depression at the J point in the precordial leads, running straight into tall, symmetrical T waves. The magnitude is written two ways: de Winter''s original 2008 letter says 1–3 mm in V1–V6; the same group''s Verouden 2009 and ACC 2022 say >1 mm.'
    - 'aVR often shows slight ST elevation. Sources differ on the magnitude: de Winter''s original 2008 letter says 1–2 mm in most patients; the same group''s larger 2009 cohort, and ACC 2022, both give smaller values.'
    - 'About 2%, with anterior MI as the denominator: de Winter''s original 2008 letter found 30 of 1532 anterior MI patients (2.0%); the same group''s Verouden 2009 found 35 of 1890 patients undergoing LAD primary PCI for anterior MI (2%). The two cohorts overlap; these are not two independent studies replicating each other.'
    slides:
    - alt: 'Slide titled "De winter''s T waves": in the middle, a black-framed screenshot of the PubMed citation page, showing "N Engl J Med. 2008 Nov 6;359(19):2071-3. doi: 10.1056/NEJMc0804737.", the title "A new ECG sign of proximal LAD occlusion", the authors "Robbert J de Winter, Niels J W Verouden, Hein J J Wellens, Arthur A M Wilde, Interventional Cardiology Group of the Academic Medical Center", and "PMID: 18987380 DOI: 10.1056/NEJMc0804737"; below, a line drawing of lead V3 with three beats: after the QRS it dips first, then slopes up into a tall, symmetric T wave.'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 274); top: screenshot of the PubMed citation page: de Winter RJ, Verouden NJ, Wellens HJ, Wilde AA. N Engl J Med. 2008;359(19):2071-2073 (PMID 18987380)'
    - alt: 'Left column of the slide on a pink background, labeled "Typical features" at the top and "Other features" below (in Chinese). Top right, a line drawing of lead V3 with three beats: a red arrow on the first beat marks "Upsloping STD", a blue arrow on the second beat''s T wave marks "Symmetry, Tall T wave". Text in the lower half (in Chinese): "Usually 1-2 mm STE in aVR", "Normal QRS duration (or slight QRS widening)", "PRWP in some patients".'
      caption: From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 276); features summarized from de Winter RJ, et al. N Engl J Med. 2008;359(19):2071-2073. aVR 1–2 mm is how this original letter puts it; the same group's larger 2009 cohort and ACC 2022 give smaller values.
    refs:
    - de Winter RJ, Verouden NJ, Wellens HJ, Wilde AA; Interventional Cardiology Group of the Academic Medical Center. A new ECG sign of proximal LAD occlusion. N Engl J Med. 2008;359(19):2071-2073. PMID 18987380. (Letter; no abstract on PubMed)
    - Verouden NJ, Koch KT, Peters RJ, et al. Persistent precordial "hyperacute" T-waves signify proximal left anterior descending artery occlusion. Heart. 2009;95(20):1701-1706. PMID 19620137.
    - 'LITFL: De Winter T Wave'
    - Writing Committee (Kontos MC, de Lemos JA, Deitelzweig SB, et al). 2022 ACC Expert Consensus Decision Pathway on the Evaluation and Disposition of Acute Chest Pain in the Emergency Department. J Am Coll Cardiol. 2022;80(20):1925-1960. PMID 36241466.
    - 'Dr. Smith''s ECG Blog: Hyperacute T waves'
    - 'Ken Grauer, ECG Blog #319 — QRS Alternans?'
