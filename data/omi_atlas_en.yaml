  bifascicular-block:
    name: New-onset bifascicular block
    part: 'Part 1 (B): QRS and ST'
    look: '**New bifascicular block (RBBB + fascicular block, most commonly LAFB) + chest pain** ➜ New-onset bifascicular block. It means the septal perforator has been cut off: an ominous sign of proximal LAD.'
    artery: proximal LAD; **think left main too**
    pitfall: '**The biggest trap: treating a wide QRS as "so it can''t be read, so it''s not a STEMI."** Pendell Meyers put it plainly on Dr. Smith''s ECG Blog: formal STEMI criteria don''t apply to RBBB with LAFB, and there are no formal criteria for this situation; when the STE isn''t striking or the J point is obscured by the QRS, it often gets missed. But don''t swing the other way and assume RBBB has no effect at all on reading the ST segment: the answer is to **use appropriate discordance as the ruler** (in BBB, the terminal QRS and the ST-T should fall on opposite sides of the isoelectric baseline), and **when that rule is violated, consider ACS**, especially in the right to mid precordial leads. **The HATW score doesn''t apply to this group** (Meyers 2025 excluded wide QRS at enrollment). RBBB isn''t uncommon in the ED and is often an incidental finding; in the Widimsky study, **old RBBB had the lowest in-hospital mortality of the four block groups (6.4%)**, so don''t get nervous over every RBBB; the one to be nervous about is the "new" one. RBBB may also be **PE**: the ECG in acute PE can show complete or incomplete RBBB, right axis deviation, and a dominant R wave in V1; think of it with Qr in V1 too, and bedside ultrasound of the RV can help sort it out quickly.'
    points:
    - 'Mechanism: the right bundle branch and the left anterior fascicle are supplied mainly by **the LAD''s septal perforators**; **the first septal perforator (S1) comes off the proximal LAD** and supplies the basal septum, bundle branches included. **Proximal LAD or left main occlusion ➜ no blood to the septal perforator ➜ new RBBB+LAFB**.'
    - 'Catching "new" is the one key move: in Widimsky 2012, overall in-hospital mortality for RBBB and LBBB was **similar**; but **new (or presumed new) RBBB 18.8% vs old RBBB 6.4%, a nearly threefold difference**. When you see RBBB, the first thing isn''t deciding left vs right; it''s **digging up the old ECG**.'
    - 'You''ll often see **downsloping STE**: it doesn''t look like a typical STEMI, so it''s the easiest thing to call "secondary change from the BBB" and turn the page. Pendell Meyers put it even more bluntly on Dr. Smith''s ECG Blog: patients with acute OMI plus RBBB+LAFB are **either about to arrest, just resuscitated, or in cardiogenic shock**.'
    criteria:
    - '**Widimsky 2012 (multicenter AMI cohort)**: in-hospital mortality was **18.8% for new or presumed new RBBB** (highest of the four block groups, new/old × right/left), **13.2% for new LBBB**, and **6.4% for old RBBB** (lowest of the four); overall in-hospital mortality was similar for RBBB and LBBB. New (or presumed new) blocks, left or right, had the highest incidence of cardiogenic shock of all ECG subgroups. Among patients with acute left main occlusion, a subset also presented with RBBB (mostly with LAH) on the admission ECG.'
    - 'Same paper, Table 4 (RBBB with hemiblock): patients with RBBB plus LAH or LPH were older, had lower EF, and had more three-vessel disease, but mortality was only "slightly higher," and **the comparison of in-hospital mortality across the three groups was not statistically significant**; the RBBB+LPH group was very small, and **its rate of receiving no reperfusion at all was clearly higher**. So all you can say is "there''s an upward trend," not "combined hemiblock has been proven to carry higher mortality."'
    slides:
    - alt: 'Top of the slide (in Chinese): a screenshot of the journal title page, European Heart Journal (2012) 33, 86–95, doi:10.1093/eurheartj/ehr291, titled "Primary angioplasty in acute myocardial infarction with right bundle branch block: should new onset right bundle branch block be added to future guidelines as an indication for reperfusion therapy?"; below, a bar chart redrawn from the paper''s numbers, "Proportion receiving PCI," with the RBBB bar (circled in red) higher than LBBB.'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 153); image: journal title page screenshot from Widimsky P, et al. Eur Heart J. 2012;33(1):86-95, bar chart redrawn from its numbers'
    - alt: 'Top of the slide: a screenshot of the journal table "Table 4 Right bundle branch block with/without left anterior/posterior hemiblock," with columns RBBB alone/RBBB+LAH/RBBB+LPH/P-value and a red box around the RBBB+LAH and RBBB+LPH cells in the In-hospital mortality row. Below are my takeaways in Chinese: in pink, "In AMI, if RBBB is combined with LAFB or LPFB," "it tends to carry higher mortality," "strongly suspect extensive anterior MI"; in dark gray, "LAD occlusion with RBBB+LAFB carries a very high risk of death," plus a sentence estimating the proportion who develop cardiogenic shock or cardiac arrest before PCI.'
