findings:
  nttv1:
    name: NTTV1
    full: New Tall T wave in V1
    part: 'Part 1 (A): T waves and U waves'
    look: '**T wave in V1 taller than V6** ➜ NTTV1'
    artery: LCx (posterior/inferobasal)
    pitfall: '**LVH is a common false positive** (you have to watch for LVH with HATW too; in the same patient, think of it for both findings). Ken Grauer himself warns that a tall, upright T wave in V1 is sometimes just a repolarization variant or a mirror image of LV strain. And the line "the T wave in V1 is supposed to be inverted" isn''t entirely right in itself: the T wave in V1 can normally be negative, flat, or upright, so **calling ischemia from an upright V1 on a single ECG doesn''t hold up**. Dr. Smith''s 2012 original study (subtle anterior STEMI vs early repolarization) also states that an upright T wave in V1, or a T wave in V1 greater than V6, **"did not provide important information"**. His question was anterior (LAD), while NTTV1 mostly points to the LCx. Don''t mix up the two rulers.'
    leads:
    - V1
    - V6
    points:
    - A T wave in V1 taller than V6, especially when it's **new** (a New Upright T wave, or TV1>TV6) ➜ suspect CAD or acute ischemia. The mechanism is a **mirror image of posterior (posterior/inferobasal) ischemia or injury**, which is why it's tied to the **LCx**, not the LAD.
    - 'How to judge it: **compare the T waves in V1 and V6 on the same ECG**, not against a memorized absolute height (in mm). If there''s an old ECG, always pull it up and compare. The "N" in NTTV1 stands for New; without an old ECG all you have is TTV1, and the evidence is a notch weaker.'
    - NTTV1 isn't there to make a diagnosis; it's there to **wake your eyes up**. When you see it, go back and look for STD in V2–V3 and for taller R waves, dig out the old ECG, and **get another ECG**, rather than calling the CV man right away.
    criteria:
    - 'Manno 1983 (**218 patients** undergoing diagnostic cardiac catheterization for chest pain): an upright T wave in V1 (with **0.15 mV** as the cutoff) was **common in isolated LCx disease and rare in isolated LAD disease**; in multivessel disease, an upright T wave in V1 was also common whenever the LCx was diseased.'
    slides:
    - alt: 'Slide (in Chinese) titled "When an upright TV1 comes with symptoms," a flowchart: on the left, a blue label "First priority" reads "Rule out normal variants first"; on the right, a blue label "Compare ECGs" lists ① New Upright T wave or ② TV1>TV6, next to two lines, "inverted → upright" and "flat → upright," with a pink box around "inverted/flat" and the note "normal T wave of V1"; the middle reads "Suspect in your mind" and "possibly CAD or acute ischemia," and at the bottom an arrow points to "Repeat ECGs." The whole slide is a text-and-arrow flowchart with no real ECG waveforms.'
      caption: From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 72); a reading flowchart I drew myself
    refs:
    - Manno BV, Hakki AH, Iskandrian AS, Hare T. Significance of the upright T wave in precordial lead V1 in adults with coronary artery disease. J Am Coll Cardiol. 1983 May;1(5):1213-5. PMID 6833662
    - LITFL (Ed Burns). T wave. ECG Library Basics
    - Smith SW, Khalil A, Henry TD, et al. Electrocardiographic differentiation of early repolarization from subtle anterior ST-segment elevation myocardial infarction. Ann Emerg Med. 2012 Jul;60(1):45-56.e2. PMID 22520989 (original source of the counterargument to NTTV1)
    - Dr. Smith's ECG Blog. Is there evidence of OMI on this ECG? (Ken Grauer's comment section)
    - 'Rezaie S. EKG Subtlety: Tall T-Wave in Lead V1. ALiEM'
    zh_hash: '45830fc3dd'
  hatw:
    name: HATW
    full: Hyperacute T wave
    part: 'Part 1 (A): T waves and U waves'
    look: '**T wave too fat and too symmetric relative to the QRS** ➜ HATW. Remember: it''s "the R wave gets shorter," not "the T wave gets taller."'
    pitfall: '**Be honest about the disclosures**: this study was partly funded by Powerful Medical (the company behind PMcardio/Queen of Hearts); Meyers and Smith hold stock options in the company, and Herman is its Chief Medical Officer. That doesn''t mean the study was done badly (derivation and validation were separate, and the outcome used the TIMI flow grade of the culprit lesion on angiography as a hard endpoint), but **this score is ultimately meant to go into an AI product that''s going to be sold**: even when the AI says OMI, you still have to be able to see for yourself whether that T wave is fat. The score''s sensitivity is on the low side, so **a negative can''t be used to rule out**; and it **doesn''t apply to wide QRS**: the study excluded patients with wider QRS at enrollment, so LBBB/paced rhythm are outside what was validated.'
    points:
    - '**A hyperacute T wave isn''t "tall," it''s "fat."** The criterion is **area under the curve relative to the QRS**, plus **symmetry**.'
    - HATW isn't "the mountain got taller," it's "the mountain got fatter." The area gets bigger, not the height.
    criteria:
    - 'HATW score (Meyers 2025, JACC Adv): makes HATW objective with two measurements, **T-wave magnitude** (T-wave area relative to QRS amplitude) and **symmetry** (T-wave peak-to-end time relative to onset-to-peak time); derivation and validation were evaluated in separate groups. The authors conclude that this is the first objective definition of HATW and that it shows significant clinical utility as an ECG finding of acute coronary occlusion in patients with suspected ACS. For the cutoff and the specificity, sensitivity, PPV, LR+, and other numbers, I''ve only found one source so far (the original paper), so this page doesn''t list them for now.'
    slides:
    - alt: 'Slide (in Chinese) "What to look for in HATW": a magnified ECG waveform with a dark gray block over the T wave and a light green block over the QRS; the text above reads "Is the T wave wide enough, fat enough?" and below, "Is the ratio between the T wave and the QRS disproportionate?"'
      caption: From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 89)
    - alt: 'Slide (in Chinese) "Let''s look at two examples": V1 to V3 of LVH on the left, V1 to V3 of HATW on the right, and below, a large question on a blue background: "What''s the difference?"'
      caption: 'Same slide deck (slide 88): V1–V3 of LVH and of HATW side by side. What''s the difference?'
    refs:
    - Meyers HP, Simančík F, Herman R, Rafajdus A, Frick WH, Nunes de Alencar J, Aslanger EK, Smith SW. Hyperacute T Waves Are Specific for Occlusion Myocardial Infarction, Even Without Diagnostic ST-Segment Elevation. JACC Adv. 2025;4(10 Pt 2):102120. PMID 40892623
    - Mills NL, Newby LK, Zaman S, et al. Fifth Universal Definition of Myocardial Infarction (2026). Glob Heart. 2026;21:64. DOI 10.5334/gh.1578 (open access; published simultaneously in Circulation, DOI 10.1161/CIR.0000000000001477); Table 5 lists the definition of hyperacute T waves
    zh_hash: '70cbc7b018'
  pathologic-q:
    name: Pathologic Q wave
    part: 'Part 1 (B): QRS and ST'
    look: '**New pathologic Q waves** (especially with STE or hyperacute T waves) ➜ Pathologic Q wave'
    pitfall: 'Don''t relax just because you see a Q wave. Raitt 1995 (pooled from four thrombolytic trials, patients with no prior history of MI) found that **among patients admitted within 1 hour of symptom onset, a considerable proportion already had abnormal Q waves on the initial ECG**, and that having Q waves **did not eliminate the effect of thrombolytic therapy in reducing infarct size**. ⚠️ Raitt''s abstract isn''t stratified by artery and never mentions "LAD"; Dr. Smith''s blog paraphrasing it as "LAD STEMI" is his own addition, so when you cite it, don''t say "half of LAD OMIs." DDx (non-infarct Q waves): cardiomyopathies such as **HCM** (deep, narrow, "dagger-like" Q waves), **LVH**, **pre-excitation (WPW)** (negative delta waves create false Q waves), **lead misplacement** (e.g., V1–V2 placed too high can create false Q waves), and extreme clockwise/counterclockwise rotation of the heart. A practical discriminator (Ken Grauer): **if the Q wave in V4 is larger than the septal q waves in V5 and V6, it''s not a normal septal q wave, it''s an infarction Q wave**. No ruler needed; you can do it by eye.'
    points:
    - Pathologic Q wave **≠ old MI**. Q waves may appear within the first hour of the acute phase, **a Q wave doesn't exclude acute OMI**, and abnormal Q waves on the initial ECG **did not eliminate the effect of thrombolytic therapy in reducing infarct size**.
    - 'The logic of the criteria is asymmetric: **meeting either of the two = pathologic** (pathologic Q wave, or); **both must be met to count as normal** (septal q wave, and). To be called normal, the bar is actually higher.'
    - 'An isolated QS in V1 can be normal; but **in an OMI context, any Q wave in V2–V3 is abnormal** (unless it''s lead misplacement, LBBB, or a paced rhythm). Also, **Qr in V1 is a fairly specific ECG sign of PE**: when you see Qr in V1, both lights should go on at once, anterior OMI and PE.'
    criteria:
    - '**Fifth UDMI (2026) Table 5**: Pathologic Q waves = Q-wave duration **≥40 ms** and/or depth **≥25% of the R wave**, in **two contiguous leads**. The main text explains that this is the classical definition (the denominator is **the R wave in the same lead**); prior versions of the UDMI used a different definition, and the fifth edition adopted the classical one because it correlates better with transmural myocardial infarction on CMR.'
    slides:
    - alt: 'Slide (in Chinese) comparing two columns side by side: the left column, "Pathologic Q wave," is labeled "width > 0.04 s," "or," "height > 25% of the R wave of the QRS"; the right column, "septal q wave," is labeled "width < 0.04 s," "and," "height < 25% of the R wave of the QRS"; each column has a small QRS sketch on a dark gray grid.'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 101): criteria for a pathologic Q wave vs a normal septal q wave (the Fifth UDMI writes "≥," and requires it in two contiguous leads)'
    - alt: 'Screenshot of a post on X (Twitter) by Dr. Stephen W. Smith himself: "I wrote this in my book 20 years ago," with a thumbnail of the cover of his textbook The ECG in Acute MI and a passage of its text (red lines marking sentences such as "Never let Q waves alone dissuade you from initiating reperfusion strategies"); on the right are three takeaways I added in Chinese: don''t let Q waves stop you from activating the cath lab; anterior OMI can show Q waves or loss of R waves within the first hour; Q waves are hard to use for estimating how long ago the AMI happened.'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 103); image: Dr. Stephen W. Smith''s own public post on X (@smithECGBlog), quoting the text of his textbook The ECG in Acute MI'
    refs:
    - Mills NL, Newby LK, Zaman S, et al. Fifth Universal Definition of Myocardial Infarction (2026). Glob Heart. 2026;21:64. DOI 10.5334/gh.1578 (open access; published simultaneously in Circulation, DOI 10.1161/CIR.0000000000001477)
    - Thygesen K, Alpert JS, Jaffe AS, et al. Fourth Universal Definition of Myocardial Infarction (2018). Circulation. 2018;138(20):e618-e651. PMID 30571511
    - LITFL (Ed Burns, Robert Buttner). Q Wave. ECG Library Basics
    - 'Raitt MH, Maynard C, Wagner GS, Cerqueira MD, Selvester RH, Weaver WD. Appearance of abnormal Q waves early in the course of acute myocardial infarction: implications for efficacy of thrombolytic therapy. J Am Coll Cardiol. 1995 Apr;25(5):1084-8. PMID 7897120'
    - Dr. Smith's ECG Blog (Magnus Nossen, edits by Smith). Chest pain followed by 6 days of increasing dyspnea - what happened? 2025-02-26
    - Dr. Smith's ECG Blog. Judge for yourself the management of this patient with "NSTEMI, multivessel disease". 2023-09-10 (Ken Grauer's comment section)
