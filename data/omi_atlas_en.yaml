  inverted-u:
    name: Inverted U wave
    part: 'Part 1 (A): T waves and U waves'
    look: '**Upside-down U wave** ➜ Inverted U wave. Very rare, but every one you catch counts.'
    artery: LAD/left main (especially proximal LAD)
    pitfall: 'Inverted U waves **aren''t exclusive to ACS**; they signal "this heart is diseased," not "this artery is occluded right now": **hypertension, valvular heart disease (e.g., aortic and mitral regurgitation), congenital heart disease, cardiomyopathy, and hyperthyroidism** may all produce them, and they''re also associated with **LV dysfunction**. The hardest differential is mixing it up with **the second half of a biphasic T wave**; always confirm first that the T wave has ended (use the QT interval as calipers). Also, the literature is old (1979–1980). Reinig 2005 re-analyzed patients whose T and U waves pointed in discordant directions: the CAD rate in the T-inverted/U-upright group was only slightly higher than in the T-upright/U-inverted group, and **the difference wasn''t statistically significant**. What really supports the "highly specific" claim is the two Gerson papers; Reinig''s real contribution is the reminder that **the U wave can''t be read in isolation; it has to be read together with its T wave**.'
    leads:
    - I
    - aVL
    - V4–V6
    points:
    - 'Definition: in a lead with an **upright T wave**, a **downward** U wave after the T wave ends (Neg U under T(+)). A normal U wave goes in the **same direction** as the T wave and **gets more prominent as the heart rate slows**.'
    - 'The key to recognizing it: use the **QT interval as calipers**. Find a lead where the QT interval is clear cut and carry that QT length over to the suspicious lead: **if it falls outside the QT interval, it''s an inverted U wave; if it falls inside, it''s the second half of a biphasic T wave**.'
    - 'It can **appear earlier than STE**, and it can **appear when there''s no chest pain**. That''s what makes it as precious as HATW: **an early signal**.'
    criteria:
    - '**Gerson 1979 (exercise-induced)**: exercise-induced U-wave inversion was highly predictive of significant coronary artery disease, especially **proximal LAD disease**. **Gerson 1980 (at rest)**: among patients undergoing coronary angiography, resting U wave negativity was a significant predictor of **≥75% LAD or left main stenosis** and of **LV dysfunction**.'
    slides:
    - alt: 'Slide (in Chinese) "Abnormal U waves," a side-by-side comparison: on the left, on a light blue background, "Prominent U wave," with a black arrow in each of V3 and V4 pointing to an upward U wave after the T wave; on the right, on a beige background, "Inverted U wave," with a pink arrow in each of V3, V4, and V5 pointing to a downward U wave after the T wave.'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 132): prominent U wave vs inverted U wave. The ECG on the right is from Girish MP, et al. Indian Pacing Electrophysiol J. 2005 (Figure 1A); the ECG on the left is from a public case online.'
    - alt: 'Slide (in Chinese) "Abnormal U waves": on the left, on a beige background, "Inverted U wave," ECGs of leads V3, V4, and V5 with pink arrows pointing to the downward-dipping U wave after the T wave; on the right, "Clinical significance," in large text on a blue background: "Early sign," "with," "Myocardial ischemia."'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 133), showing the clinical significance of the inverted U wave; ECG from Girish MP, et al. U wave: an important noninvasive electrocardiographic diagnostic marker. Indian Pacing Electrophysiol J. 2005;5(1):63-5 (Figure 1A)'
    refs:
    - Gerson MC, Phillips JF, Morris SN, McHenry PL. Exercise-induced U-wave inversion as a marker of stenosis of the left anterior descending coronary artery. Circulation. 1979 Nov;60(5):1014-20. PMID 487534
    - Gerson MC, McHenry PL. Resting U wave inversion as a marker of stenosis of the left anterior descending coronary artery. Am J Med. 1980 Oct;69(4):545-50. PMID 7424944
    - LITFL (Ed Burns). U Wave. ECG Library Basics
    - Reinig MG, Harizi R, Spodick DH. Electrocardiographic T- and U-wave discordance. Ann Noninvasive Electrocardiol. 2005 Jan;10(1):41-6. PMID 15649236
    - 'Girish MP, Gupta MD, Mukhopadhyay S, Yusuf J, Sunil Roy TN, Trehan V. U wave: an important noninvasive electrocardiographic diagnostic marker. Indian Pacing Electrophysiol J. 2005;5(1):63-5. PMID 16943944 (source of the slide 133 ECG)'
    - 'Kishida H, Cole JS, Surawicz B. Negative U wave: a highly specific but poorly understood sign of heart disease. Am J Cardiol. 1982 Jun;49(8):2030-6. PMID 6211085'
    - Salmasi AM, Abraham R, al-Kutoubi A, Nicolaides AN. Exercise-induced inverted U wave in asymptomatic high-risk subjects. A preliminary study. Angiology. 1994 Sep;45(9):789-95. PMID 8092544
