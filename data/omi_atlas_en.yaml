  south-african-flag:
    name: South African Flag sign
    part: 'Part 3 (B): Noncontiguous leads'
    look: '**STE in all three leads I, aVL, and V2** (the STE in V2 that "skips V1 and isn''t contiguous" is the soul of it), **reciprocal STD in lead III** (often extending to II, aVF) ➜ South African Flag sign.'
    artery: first diagonal
    pitfall: 'If V2 shows rSr'' with mild saddleback (gradually upsloping) ST elevation, the shape differs from the V2 STE usually seen in a true SAF sign; think **V2 electrode placed too high** (Ken Grauer''s call in one case). If only V2 is elevated and the other chest leads are clean, it leans toward D1/D2 occlusion; if V3 and V4 start to rise too, it may be an LAD occlusion still evolving: either way, call the CV man. Be honest about the level of evidence: the original description is a single case report by Durant & Singh 2015; Littmann 2016, which named it, is a Letter (PubMed type: Letter, Comment) whose title calls it a teaching tool; most PubMed articles with this sign as their subject are case reports. **Don''t treat it as a validated diagnostic rule**.'
    leads:
    - I
    - aVL
    - V2
    - III
    points:
    - '**STE in leads I, aVL, V2** + **reciprocal STD in lead III** (II and aVF often go along, but III is the most obvious). On paper, aVL and V2 sit in two different zones, so under the traditional grouping they aren''t contiguous.'
    - 'Ken Grauer''s added third criterion: **no STE in any chest lead other than V2**. This is the key to distinguishing it from an LAD occlusion that''s still evolving, where the STE hasn''t yet spread to chest leads beyond V2.'
    - 'Why it''s easy to miss: aVL and V2 aren''t contiguous in the traditional grouping, so the pattern a 1st or 2nd diagonal occlusion produces, "aVL + V2 STE, nothing in the other chest leads," may by definition fail to meet the two-contiguous-leads STEMI criteria.'
    criteria:
    - 'STE in leads I, aVL, V2 + reciprocal STD in lead III (often extending to II, aVF, to a lesser degree); Ken Grauer adds one more: no STE in any chest lead other than V2.'
    refs:
    - 'Ken Grauer. ECG Blog #540 — Does it "Fit" the Clinical? (2026-08-01)'
    - 'LITFL: High Lateral STEMI (Mike Cadogan, Robert Buttner)'
    - 'Durant E, Singh A. Acute first diagonal artery occlusion: a characteristic pattern of ST elevation in noncontiguous leads. Am J Emerg Med. 2015 Sep;33(9):1326.e3-5. PMID 25722286'
    - 'Littmann L. South African flag sign: a teaching tool for easier ECG recognition of high lateral infarct. Am J Emerg Med. 2016 Jan;34(1):107-9. PMID 26527178'
    - 'Dr. Smith''s ECG Blog: A woman in her 30s with sudden chest pain, nausea, and diaphoresis. Was her cardiology management appropriate? (2022-04-08, My Comment by Ken Grauer)'
    - 'Dr. Smith''s ECG Blog: Acute OMI or "Benign" Early Repolarization? (2023-12-27, My Comment by Ken Grauer)'
    zh_hash: '1be0054e2d'
  aslanger:
    name: Aslanger's pattern
    part: 'Part 3 (B): Noncontiguous leads'
    look: '**STE only in lead III (not II/aVF) + STD in V4–V6, but no STD in V2** ➜ Aslanger''s pattern. An inferior OMI layered on multivessel disease.'
    pitfall: If all three inferior leads are elevated together, it doesn't count; that's a plain inferior MI.
    leads:
    - III
    - V4–V6
    - V2
    points:
    - '**Three criteria** (Aslanger 2020 original paper): ① STE in lead III but not in the other inferior leads (II, aVF) ② STD in any of V4–V6 with a positive or terminally positive T wave, and **no STD in V2** ③ **ST in lead V1 higher than in V2**. The mechanism: the ST vector of the inferior MI plus the ST vector of subendocardial ischemia from multivessel disease add up and point rightward; II and aVF get canceled out, leaving STE visible only in lead III ("two fans blowing at each other, and II and aVF in the middle get canceled out").'
    - 'Ken Grauer''s add-on: the only leads with obvious STE may be just **III, aVR, V1**; reciprocal STD in lead I may be more obvious than in aVL (because the ST vector points rightward).'
    - 'The two incidence figures have different denominators; don''t mix them up: **6.3%** of the **NSTEMI population**; the paper also says **13.3% of inferior MIs** may present with this pattern. In-hospital and one-year mortality in this group are similar to inferior STEMI (no statistically significant difference), yet they may miss out on emergent revascularization because they get labeled NSTEMI: that''s the real clinical significance of Aslanger''s pattern.'
    criteria:
    - ① Any STE in lead III but not in the other inferior leads; ② STD in any of V4–V6 (but not V2), with a positive or terminally positive T wave; ③ ST in lead V1 higher than in V2.
    - 'Incidence: 6.3% in the NSTEMI population, 0.5% in the no-MI control group; the paper estimates 13.3% of inferior MIs may present with this pattern. Mortality: in-hospital and one-year mortality similar to inferior STEMI, with no statistically significant difference.'
    slides:
    - alt: '12-lead ECG titled "50-year-old man, presenting with chest pain" (in Chinese). Left half, I/II/III/aVR/aVL/aVF: a red up arrow in lead III marks STE, a red down arrow in aVL marks reciprocal STD; blue-background text: "Among the inferior leads only III has STE, with reciprocal STD change in aVL". Right half, V1–V6: an orange box around V1/V2, blue-background text: "ST in V1 higher than V2"; V4/V5/V6 each have a red down arrow and a green open circle, blue-background text: "STD in any of leads V4-V6 + upright or terminally positive T wave (no STD in V2)"'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 294). ECG source: a case shared by Emre Aslanger (@AslangerE) on X (Twitter) on 2022-05-07; the arrows, boxes, and Chinese annotations on the image are mine.'
    refs:
    - Aslanger E, Yıldırımtürk Ö, Şimşek B, Sungur A, Türer Cabbar A, Bozbeyoğlu E, Karabay CY, Smith SW, Değertekin M. A new electrocardiographic pattern indicating inferior myocardial infarction. J Electrocardiol. 2020 Jul-Aug;61:41-46. PMID 32526537
    - Miyauchi E, Kuwazuru K, Arikawa R, Tokutake D, Chaen H, Oketani N, Ohishi M. Clinical Features of the Aslanger Pattern to Compensate for the Limitation of ST-Elevation Myocardial Infarction (STEMI) Criteria. Cureus. 2023 Jan;15(1):e33227. PMID 36601361
    - 'LITFL: Aslanger Pattern: Another OMI? (Robert Buttner, Mike Cadogan)'
    - 'Ken Grauer. ECG Blog #529 — Should Prompt Cath be Done? (2026-05-02)'
    - 'Dr. Smith''s ECG Blog: Typical Chest Pain: Would you activate the cath lab? Would you advocate if the interventionalist was not interested? (2021-05-10)'
