  avr-ste:
    name: aVR STE + multiple leads STD
    part: 'Part 2: Based on STD'
    look: '**STE, and it''s in aVR** (+ multiple leads STD) ➜ this is that wastebasket. Everything is in there, but for a sick patient, call CV and talk it through together.'
    artery: 'Not a single artery: in Harhash 2019, none of the patients in whom a culprit occlusion was actually found had a left main or LAD occlusion. This pattern reflects diffuse subendocardial ischemia (supply/demand mismatch); only once ACS is confirmed do you lean toward left main/all three vessels bad/proximal LAD.'
    pitfall: 'When you see aVR up and STD everywhere, it''s easy to reflexively shout "left main, rush to the cath lab": that''s wrong. A true total left main occlusion, if it has STE in aVR, will definitely have STE elsewhere too; it''s an obvious, extensive STEMI, and you don''t need aVR to remind you. Conversely, an ECG with "only aVR up and STD everywhere else" is telling you precisely that "this is not a total occlusion." But you can''t ignore it either: these patients have high in-hospital mortality. Correct the supply/demand causes first (heart rate, hemoglobin, blood pressure, oxygen saturation), then see whether the STD resolves. Exceptions do exist (a total left main occlusion with collaterals can look like diffuse STD on the ECG), so when the chest pain is refractory, the patient is hemodynamically unstable, or there''s STE in some territory hidden among the STD, bring the "exception" back to the table.'
    leads:
    - aVR
    points:
    - 'aVR STE is itself a mirror: there''s no ventricular myocardium under aVR (Smith''s version), or it faces the basal septum (the Mattu/LITFL version). The two camps differ on the anatomy but reach the same conclusion: that STE isn''t the artery under it being occluded; it''s the mirror image of a bunch of STD elsewhere. You can think of aVR as (−)aVR: with STD in I and II, (−)aVR mathematically has to have STD, so (+)aVR has to have STE.'
    - 'The conclusion deserves to be said loudly: aVR STE + diffuse STD is not left main occlusion, and it''s not OMI; it''s diffuse subendocardial ischemia (supply/demand mismatch). Patients with a true 100% left main occlusion usually don''t make it to you: the patient who walks into the ED, alert, holding this ECG is there precisely because their left main "isn''t completely occluded yet."'
    - This pattern has high mortality, but the mechanism isn't a single occluded artery; it's "the whole heart globally short on oxygen." It may be ACS (left main insufficiency, all three vessels bad, proximal LAD), or not ACS at all (sepsis, severe anemia, GI bleeding, hypoxia, SVT/AF RVR, hypovolemia, aortic stenosis, hypertensive emergency). The first step isn't picking up the phone; it's finding and correcting the supply/demand cause. After correcting it, get another ECG; if the STD is still there and the patient is still in pain (or the chest pain is refractory, or the blood pressure is dropping), talk with CV.
    criteria:
    - Among patients with STE-aVR + multilead STD, a coronary occlusion thought to be culprit was found in only 10%, and none of those lesions were left main or LAD occlusions (Harhash 2019).
    refs:
    - 'Harhash AA, Huang JJ, Reddy S, et al. aVR ST Segment Elevation: Acute STEMI or Not? Incidence of an Acute Coronary Occlusion. Am J Med. 2019 May;132(5):622-630. PMID 30639554.'
    - 'Dr. Smith''s ECG Blog (Steve Smith): Does ST Elevation in lead aVR indicate acute coronary occlusion? (2020-03-09)'
    - 'Dr. Smith''s ECG Blog (co-written by Steve Smith and Pendell Meyers): How does Acute Total Left Main Coronary occlusion present on the ECG? (2019-08-09)'
    - 'LITFL: ST Elevation in aVR (last updated 2024-10-08)'
