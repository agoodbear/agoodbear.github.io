  wellens:
    name: Wellens' syndrome
    part: 'Part 3 (A): The three faces of the LAD'
    look: '**Biphasic or deep symmetric TWI in V2–V4, and the patient is** now **pain-free** ➜ Wellens'' syndrome. Don''t relax just because there''s no pain.'
    artery: LAD (occluded before, open now)
    pitfall: '**No stress test in Wellens**. If a biphasic T wave goes down first and then up, think hypokalemia, not the LAD.'
    leads:
    - V2–V4
    points:
    - 'Wellens waves ≠ Wellens'' syndrome: Wellens waves are just a T-wave shape (biphasic or deep symmetric TWI); Wellens'' syndrome is the T-wave shape + the full clinical context. What''s the difference? **Whether the patient is in pain right now**.'
    - 'The mechanism is a reperfusion T wave: the LAD was just occluded and has now opened on its own. That''s why the criteria require pain-free, troponin not elevated, no Q wave, and preserved R wave.'
    criteria:
    - 'The T wave comes in two shapes: deeply and symmetrically inverted, about 75%; biphasic (positive then negative, terminal negativity), about 25% (proportions per the Rhinehardt 2002 review). The literature is inconsistent about which one is Type A and which is Type B; describing the shape directly is least likely to go wrong.'
    - 'ST segment isoelectric or only minimally elevated (Rhinehardt 2002: <1 mm), with no obvious ST elevation.'
    - 'Don''t schedule a stress test in Wellens'' syndrome: the LAD is already a critical stenosis, and a stress test may precipitate acute MI or sudden death.'
    slides:
    - alt: 'Two T-wave diagrams on the left of the slide: the top one labeled A, with the text "Biphasic T wave inversion" and large pink text "Pattern A, about 25%" (in Chinese); the bottom one labeled B, with the text "Deeply T wave inversion" and large pink text "Pattern B, about 75%".'
      caption: From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 261); proportions per Rhinehardt J, et al. Am J Emerg Med. 2002;20(7):638-643.
    - alt: 'Slide titled "Diagnostic definition" (in Chinese): on the left, two T-wave diagrams, A on top (a biphasic waveform, positive then negative) and B below (deep, symmetric inversion); on the right, on a blue background, seven diagnostic criteria: Deeply TWI or Biphasic TWI in V2~V3, Isoelectric or minimal STE(< 1 mm), No Precordial Q wave, Preserved RWP, Recent history of angina, ECG pattern present in pain free state, Normal or slightly elevated serum cardiac markers; the Rhinehardt 2002 citation is at the top.'
      caption: From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 262); diagnostic criteria from Rhinehardt J, et al. Am J Emerg Med. 2002;20(7):638-643.
    refs:
    - Rhinehardt J, Brady WJ, Perron AD, Mattu A. Electrocardiographic manifestations of Wellens' syndrome. Am J Emerg Med. 2002;20(7):638-643. PMID 12442245.
    - de Zwaan C, Bär FW, Wellens HJ. Characteristic electrocardiographic pattern indicating a critical stenosis high in left anterior descending coronary artery in patients admitted because of impending myocardial infarction. Am Heart J. 1982;103(4 Pt 2):730-736. PMID 6121481.
    - de Zwaan C, Bär FW, Janssen JH, et al. Angiographic and clinical characteristics of patients with unstable angina showing an ECG pattern indicating critical narrowing of the proximal LAD coronary artery. Am Heart J. 1989;117(3):657-665. PMID 2784024.
