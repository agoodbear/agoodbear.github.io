  msc:
    name: LBBB/PPM with MSC(+)
    full: Smith-Modified Sgarbossa Criteria
    part: 'Part 4: Special calculations'
    look: '**Wide QRS (LBBB / ventricular paced)** ➜ go straight to MSC. Scan the three criteria lead by lead; if paced, also scan V4–V6 for concordant STD.'
    pitfall: 'With a wide QRS, **don''t** use STEMI criteria, **don''t** use the 4-variable formula, **don''t** use the HATW score either, **don''t** use Precordial Swirl. **Four out, one left: for wide QRS, MSC is the only road.**'
    leads:
    - any lead (concordant STE; discordant STE by proportion)
    - V1–V3 (concordant STD in LBBB)
    - V4–V6 (in ventricular paced rhythm, also check for concordant STD)
    points:
    - '**In the world of wide QRS, MSC is nearly the only road with literature behind it**: in LBBB or ventricular paced patients, STEMI criteria, the 4-variable formula (its premise is distinguishing early repol from LAD occlusion), the HATW score (its derivation study itself excluded patients with a wider QRS), and Precordial Swirl (the first item of its definition is narrow QRS without LVH) are all unusable. Four out, one left: only MSC is backed by three studies, derivation, LBBB validation, and paced validation.'
    - '**Rule of Appropriate Discordance (the seesaw)**: in LBBB/paced rhythm the ventricles are depolarized through an abnormal pathway, so the ST-T is supposed to point opposite the main QRS direction; that''s normal. When you see STE in LBBB, your first reaction shouldn''t be "STE ➜ STEMI." Ask first: is this STE "supposed to tip up," or has it "tipped up too far"?'
    - '**What Smith 2012 did, in one line**: replaced the absolute 5 mm in the original Sgarbossa third criterion with 25% of the preceding S-wave depth. Seesaws come big and small, so an absolute value isn''t fair: LBBB patients without coronary occlusion may also have ≥5 mm discordant STE; a proportion is fair.'
    criteria:
    - '**The three MSC criteria (any one = positive; unweighted, no scoring; ST deviation measured relative to the PR segment)**: ① Concordant STE ≥1 mm (any lead) ② Concordant STD ≥1 mm (V1–V3 in LBBB; expanded to V1–V6 in ventricular paced rhythm) ③ Proportionally excessive discordant STE: in a lead with ≥1 mm discordant STE, STE reaching **25% or more** of the preceding S-wave depth (the paper writes ST/S ratio ≤−0.25; the negative sign is because ST and S point in opposite directions).'
    - '**MSC beats the original weighted Sgarbossa (LBBB validation study, Meyers 2015)**: MSC sensitivity 80%, specificity 99%; significantly more sensitive than the original weighted Sgarbossa, with no statistically significant difference in specificity.'
    - '**Paced rhythm works too (PERFECT study, Dodd 2021)**: in ventricular paced rhythm, MSC is more sensitive than the original Sgarbossa; MSC plus concordant STD in V4–V6 gives a sensitivity of 86%. MSC specificity falls in the 84%–96% range depending on the control group (84% against the group that got a cath but wasn''t OMI, 96% against the general ED control group).'
    - '**The original Sgarbossa criteria (1996), three items**: ① concordant STE ≥1 mm ② concordant STD ≥1 mm (V1, V2, or V3) ③ discordant STE ≥5 mm. The original study put these three into a multivariate model to build a scoring system; Smith 2012 considered the rule''s diagnostic utility poor, and what he changed was the absolute 5 mm in criterion ③.'
    refs:
    - Smith SW, Dodd KW, Henry TD, Dvorak DM, Pearce LA. Diagnosis of ST-elevation myocardial infarction in the presence of left bundle branch block with the ST-elevation to S-wave ratio in a modified Sgarbossa rule. Ann Emerg Med. 2012 Dec;60(6):766-76. PMID 22939607
    - 'Meyers HP, Limkakeng AT Jr, Jaffa EJ, et al. Validation of the modified Sgarbossa criteria for acute coronary occlusion in the setting of left bundle branch block: A retrospective case-control study. Am Heart J. 2015 Dec;170(6):1255-64. PMID 26678648'
    - Dodd KW, Zvosec DL, Hart MA, et al. (PERFECT study investigators). Electrocardiographic Diagnosis of Acute Coronary Occlusion Myocardial Infarction in Ventricular Paced Rhythm Using the Modified Sgarbossa Criteria. Ann Emerg Med. 2021 Oct;78(4):517-529. PMID 34172301
    - Sgarbossa EB, Pinski SL, Barbagelata A, et al. Electrocardiographic diagnosis of evolving acute myocardial infarction in the presence of left bundle-branch block. GUSTO-1 (Global Utilization of Streptokinase and Tissue Plasminogen Activator for Occluded Coronary Arteries) Investigators. N Engl J Med. 1996 Feb 22;334(8):481-7. PMID 8559200
    - 'LITFL ECG Library: Sgarbossa Criteria'
