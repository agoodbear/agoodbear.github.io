  tqrsd:
    name: TQRSD
    full: Terminal QRS Distortion
    part: 'Part 3 (A): The three faces of the LAD'
    look: If V2 or V3 has no S wave and no J wave **at the same time** ➜ treat it as OMI outright, no calculation needed.
    artery: LAD
    pitfall: TQRSD is an exclusion criterion for the 4-variable formula. **If you see TQRSD, don't run the formula; just treat it as OMI.**
    leads:
    - V2
    - V3
    points:
    - 'TQRSD = in either V2 or V3, the S wave and the J wave are **both gone**. Note it''s "or," not "and": if either V2 or V3 has no S wave and no J wave at the same time, it counts.'
    - TQRSD is a **rule-in tool, not a rule-out tool**. No TQRSD does not mean, in any way, that it isn't OMI.
    criteria:
    - S wave = any deflection at the end of the R wave that dipped below the level of the PQ junction; J wave = any positive deflection (notching or slurring) above the level of the ST segment at the J point.
    - 'Of 171 patients read by cardiologists as benign early repolarization, 0 had TQRSD: specificity for LAD occlusion 100% (95% CI 97.8–100). But this 100% comes with a condition: the paper says it holds when the differential diagnosis is acute MI vs early repolarization, not an unconditional 100%.'
    slides:
    - alt: 'Slide titled "When STE in V2~V4" (in Chinese): on the left, a journal figure of V3 in benign early repolarization, with arrows marking the J-wave and S-wave; on the right, on a blue background, another journal figure of V3 in TQRSD, with arrows marking No J-wave and No S-wave. Bottom left, red text: "Used to Rule in"; bottom right, large red text on blue: "AMI".'
      caption: 'From my 2025 ECG teaching slides for residents at Chi Mei Medical Center (slide 252); both V3 tracings are from Lee DH, Walsh B, Smith SW. Am J Emerg Med. 2016;34(11):2182-2185 (left: Fig. 2, right: Fig. 1)'
    refs:
    - Lee DH, Walsh B, Smith SW. Terminal QRS distortion is present in anterior myocardial infarction but absent in early repolarization. Am J Emerg Med. 2016 Nov;34(11):2182-2185. PMID 27658331.
    - 'emDocs: 52 in 52 – #15: Terminal QRS distortion is present in anterior myocardial infarction but absent in early repolarization (Christiaan van Nispen, Brannon Inman, 2022-10-11)'
    - 'The Bottom Line: Terminal QRS distortion (David Slessor, 2022-02-25)'
    - 'ECG Weekly: Differential Diagnoses: terminal QRS distortion in the differentiation of STEMI from early repolarization (Dr. Amal Mattu, 2019-08-12; full text requires subscription)'
    - 'Ken Grauer, ECG Blog #415 — The Cath showed NO Occlusion! (2024-02-04)'
