<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日出方位實驗室</title>
<style>
  /* 這一頁是在黑暗的海邊、用手機看的。所以只做一個深色版本，
     並提供紅光模式（保護暗適應，像頭燈的紅光檔）。 */
  :root {
    --ground:   #0B1020;   /* 破曉前的海夜，帶藍的深底，不用純黑 */
    --surface:  #141B2E;
    --raised:   #1B2440;
    --line:     #26314F;
    --ink:      #E6EAF6;
    --dim:      #8A97B8;
    --faint:    #5D6889;
    --ember:    #E8631F;   /* 22 倍大氣質量下的低日 */
    --gold:     #F5B23C;   /* 冒出的日緣 */
    --limb:     #FFE9BC;   /* 最亮的一點 */
    --alert:    #E24A63;
    --focus:    #F5B23C;
  }
  :root.redlight {
    --ground:   #0A0304;
    --surface:  #170708;
    --raised:   #200A0B;
    --line:     #3A1214;
    --ink:      #F2A9A2;
    --dim:      #B4665F;
    --faint:    #7A3C38;
    --ember:    #FF5A45;
    --gold:     #FF8A6B;
    --limb:     #FFC0A8;
    --alert:    #FF6B5B;
    --focus:    #FF8A6B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "PingFang TC", "Noto Sans TC", -apple-system, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 4rem;
  }

  .wrap {
    max-width: 34rem;
    margin: 0 auto;
    padding: 0 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 1.6rem;
  }

  /* 儀器數字一律等寬 —— 這一頁的性格由它決定 */
  .mono, .num, time, .coord {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  .label {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
  }

  /* ---------- 頁首 ---------- */
  header {
    padding: 2.2rem 0 0;
    display: flex;
    flex-direction: column;
    gap: .35rem;
  }
  h1 {
    margin: 0;
    font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-wrap: balance;
  }
  .sub { color: var(--dim); font-size: .92rem; }
  .sub .mono { color: var(--gold); }

  #redbtn {
    align-self: flex-start;
    margin-top: .7rem;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: 2px;
    padding: .38rem .7rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .7rem;
    letter-spacing: .1em;
    cursor: pointer;
  }
  #redbtn:hover { color: var(--ink); border-color: var(--faint); }
  #redbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- 倒數 ---------- */
  .countdown {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 2px solid var(--ember);
    padding: 1.2rem 1.2rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: .3rem;
  }
  #cdval {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.4rem, 12vw, 3.4rem);
    line-height: 1;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: -.01em;
  }
  #cdnote { color: var(--dim); font-size: .85rem; }

  /* ---------- 三個關鍵數字 ---------- */
  .keys {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .key {
    background: var(--surface);
    padding: .95rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: .22rem;
  }
  .key .v {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.42rem;
    color: var(--limb);
    letter-spacing: .01em;
  }
  .key .n { font-size: .8rem; color: var(--dim); }

  /* ---------- 天際線圖 ---------- */
  .chart {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 1.1rem .8rem .8rem;
  }
  .chart .label { padding: 0 .35rem .7rem; display: block; }
  .chart svg { display: block; width: 100%; height: auto; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem 1.1rem;
    padding: .8rem .35rem 0;
    font-size: .75rem;
    color: var(--dim);
  }
  .legend b { color: var(--gold); font-weight: 500; }

  /* ---------- 時間軸 ---------- */
  .timeline { display: flex; flex-direction: column; gap: 0; }
  .step {
    display: grid;
    grid-template-columns: 5.4rem 1fr;
    gap: .9rem;
    padding: .85rem 1rem .85rem .9rem;
    border-left: 2px solid var(--line);
    background: transparent;
    transition: background .3s ease, border-color .3s ease;
  }
  .step.now {
    background: var(--raised);
    border-left-color: var(--ember);
  }
  .step.past { opacity: .42; }
  .step .t {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1rem;
    color: var(--gold);
    white-space: nowrap;
  }
  .step.hero .t { color: var(--limb); font-weight: 600; }
  .step .d { font-size: .9rem; }
  .step .d strong { color: var(--limb); font-weight: 600; }
  .step .d small { display: block; color: var(--dim); font-size: .8rem; margin-top: .12rem; }

  /* ---------- 表格 ---------- */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .84rem;
    min-width: 20rem;
  }
  th, td {
    text-align: left;
    padding: .5rem .7rem .5rem 0;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  th {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .68rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 400;
    white-space: nowrap;
  }
  td.n {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  tr.mark td { color: var(--limb); }

  /* ---------- 區塊 ---------- */
  section { display: flex; flex-direction: column; gap: .8rem; }
  h2 {
    margin: 0;
    font-size: .82rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 400;
    padding-bottom: .5rem;
    border-bottom: 1px solid var(--line);
  }
  p { margin: 0; }
  .note { color: var(--dim); font-size: .85rem; }

  .warn {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 2px solid var(--alert);
    padding: .85rem 1rem;
    display: flex;
    flex-direction: column;
    gap: .3rem;
  }
  .warn .h { color: var(--alert); font-size: .88rem; font-weight: 600; }
  .warn p { font-size: .86rem; color: var(--ink); }

  footer {
    color: var(--faint);
    font-size: .76rem;
    line-height: 1.6;
    border-top: 1px solid var(--line);
    padding-top: 1rem;
  }

  /* ---------- 日出方位實驗室 ---------- */
  .stage {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: .7rem .6rem .5rem;
    display: flex;
    flex-direction: column;
    gap: .55rem;
  }
  .stage svg { display: block; width: 100%; height: auto; }

  .verdict {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: .84rem;
    padding: .5rem .7rem;
    border-left: 2px solid var(--line);
    color: var(--dim);
  }
  .verdict.on  { border-left-color: var(--ember); color: var(--limb); }
  .verdict.off { border-left-color: var(--faint); color: var(--dim); }

  .readout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .ro {
    background: var(--surface);
    padding: .6rem .8rem;
    display: grid;
    grid-template-columns: 5.2rem 1fr;
    grid-template-areas: "l v" "l n";
    gap: 0 .8rem;
    align-items: baseline;
  }
  .ro .label { grid-area: l; padding-top: .18rem; }
  .ro .rv {
    grid-area: v;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.02rem;
    color: var(--limb);
  }
  .ro .rn { grid-area: n; font-size: .78rem; color: var(--dim); }

  .labgrid { display: flex; flex-direction: column; gap: 1.4rem; }
  .labmain, .labside { display: flex; flex-direction: column; gap: 1.4rem; }
  .controls { display: flex; flex-direction: column; gap: 1.15rem; }
  .ctl { display: flex; flex-direction: column; gap: .45rem; }
  .ctlhead { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .ctlval { color: var(--gold); font-size: .95rem; font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 26px;
    background: transparent;
    accent-color: var(--gold);
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px; background: var(--line); border-radius: 2px;
  }
  input[type="range"]::-moz-range-track {
    height: 3px; background: var(--line); border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px; margin-top: -9.5px;
    border-radius: 50%;
    background: var(--gold);
    border: 3px solid var(--surface);
    box-shadow: 0 0 0 1px var(--line);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--gold); border: 3px solid var(--surface);
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  input[type="date"] {
    color-scheme: dark;
    background: var(--raised);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: .45rem .6rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .95rem;
    width: 100%;
  }
  input[type="date"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: 2px;
    padding: .34rem .6rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .72rem;
    cursor: pointer;
  }
  .chip:hover { color: var(--ink); border-color: var(--faint); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .axisrow {
    display: flex;
    justify-content: space-between;
    gap: .6rem;
    font-size: .7rem;
    color: var(--faint);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .solve { display: flex; flex-direction: column; gap: .5rem; }
  .year { display: flex; flex-direction: column; gap: .45rem; }
  .ylegend { display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: .72rem; color: var(--dim); }
  .ylegend .lg { display: inline-flex; align-items: center; gap: .3rem; }
  .ylegend i { width: 10px; height: 10px; display: inline-block; border-radius: 1px; }

  @media (min-width: 30rem) {
    .readout { grid-template-columns: 1fr 1fr; }
    .readout .ro:first-child { grid-column: 1 / -1; }
  }


  /* ---------- 桌機：整頁放寬，實驗室做滿版兩欄 ---------- */
  @media (min-width: 46rem) {
    .wrap { max-width: 40rem; }
  }
  @media (min-width: 64rem) {
    #lab {
      --labw: min(94vw, 1460px);
      width: var(--labw);
      margin-left: calc(50% - var(--labw) / 2);
    }
    #lab > h2, #lab > .note { max-width: 40rem; }
    .labgrid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 21rem;   /* 右欄只放控制項，不需要太寬 */
      gap: 1.5rem;
      align-items: start;
    }
    .labmain, .labside { display: flex; flex-direction: column; gap: 1.3rem; min-width: 0; }
    .labmain .readout { grid-template-columns: 1fr 1fr; }
    .labmain .readout .ro:first-child { grid-column: 1 / -1; }
    .labmain .ro { grid-template-columns: 4.8rem 1fr; padding: .5rem .8rem; }
    .labside { position: sticky; top: 1rem; gap: 1.15rem; }
    .labside .controls { gap: 1rem; }
  }
  @media (min-width: 90rem) {
    .labgrid { grid-template-columns: minmax(0, 1fr) 23rem; }
  }
  @media (min-width: 64rem) {
    .labmain .year { gap: .7rem; }
    .labmain { gap: 1.5rem; }
  }


  .sitepick { display: flex; flex-direction: column; gap: .45rem; }
  .chip.site.on { color: var(--limb); border-color: var(--ember); background: var(--raised); }
  #stripcv {
    width: 100%; height: auto; display: block; cursor: crosshair;
    border: 1px solid var(--line); image-rendering: pixelated;
  }
  #stripcv { height: 34px; }
  @media (min-width: 64rem) { #stripcv { height: 46px; } }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  @media (min-width: 30rem) {
    .keys { grid-template-columns: 1fr 1fr; }
    .keys .key:first-child { grid-column: 1 / -1; }
  }

/* 嵌入用：去掉頁面級留白，只留實驗室本身 */
body{margin:0;padding:0;background:var(--ground)}
main{max-width:none;margin:0;padding:14px}
#lab{margin:0}
#lab>h2{margin-top:0}
</style></head>
<body><main><section id="lab">
    <h2>日出方位實驗室</h2>
    <p class="note">三個東西一起決定你會看到什麼：<strong>日期</strong>決定太陽從哪個方位上來，<strong>位置</strong>決定龜山島在你眼前的方位，<strong>時間</strong>決定太陽爬到哪。拉拉看。台２線可以走進海灘的三個點都在裡面。</p>

    <div class="sitepick"><span class="label">地點</span><div class="chips" id="sitechips"></div></div>

    <div class="labgrid">
      <div class="labmain">
    <div class="stage">
      <svg id="sky" viewBox="0 0 880 330" role="img" aria-label="龜山島天際線與太陽位置模擬">
        <defs><clipPath id="ridgeclip"><path id="ridgeclippath" d="" /></clipPath></defs>
        <g id="grid"></g>
        <path id="suntrack" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 6" opacity=".7" />
        <g clip-path="url(#ridgeclip)"><circle id="sun" cx="-99" cy="-99" r="1" fill="var(--limb)" /></g>
        <path id="ridge" fill="var(--ground)" stroke="var(--faint)" stroke-width="1.5" stroke-linejoin="round" />
        <line id="sealine" x1="0" x2="880" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 5" opacity=".6" />
        <g id="marks"></g>
        <g id="axis"></g>
      </svg>
      <div id="verdict" class="verdict"></div>
    </div>
    <div class="year">
      <div class="ctlhead"><span class="label">你目前站的位置，一整年</span><span class="ctlval mono" id="stripval"></span></div>
      <canvas id="stripcv" width="730" height="34"></canvas>
      <div class="ylegend" id="striplegend"></div>

      <div class="axisrow" id="yearaxis"><span>1月</span><span>3月</span><span>5月</span><span>7月</span><span>9月</span><span>11月</span><span>&nbsp;</span></div>
      <p class="note" id="heatnote"></p>
    </div>
    <div class="readout" id="readout"></div>
      </div>
      <div class="labside">
    <div class="controls">
      <div class="ctl">
        <div class="ctlhead"><span class="label">日期</span><span class="ctlval mono" id="dateval">2026-08-16</span></div>
        <input type="date" id="dateinput" value="2026-08-16" min="2026-01-01" max="2027-12-31" />
        <div class="chips" id="datechips"></div>
      </div>

      <div class="ctl">
        <div class="ctlhead"><span class="label">位置 · 沿海岸線南北移動</span><span class="ctlval mono" id="posval"></span></div>
        <input type="range" id="posinput" min="0" max="64" step="1" value="32" />
        <div class="axisrow"><span>← 南 1.6 km</span><span id="poscoord" class="mono"></span><span>北 1.6 km →</span></div>
      </div>

      <div class="ctl">
        <div class="ctlhead"><span class="label">時間</span><span class="ctlval mono" id="timeval"></span></div>
        <input type="range" id="timeinput" min="0" max="100" step="1" value="50" />
        <div class="chips">
          <button type="button" class="chip" id="jumpfirst">跳到首光</button>
          <button type="button" class="chip" id="playbtn">播放</button>
        </div>
      </div>
    </div>
    <div class="solve">
      <span class="label">幫我找</span>
      <div class="chips">
        <button type="button" class="chip solvep" data-z="0">位置：太陽從龜尾升起</button>
        <button type="button" class="chip solvep" data-z="2">位置：太陽從 401 高地升起</button>
        <button type="button" class="chip solvep" data-z="5">位置：太陽從龜首升起</button>
      </div>
      <p class="note" id="solvenote"></p>
    </div>
      </div>
    </div>

    var M2 = (357.52911 + T * (35999.05029 - 0.0001537 * T)) * RAD;

          + Math.sin(2 * M2) * (0.019993 - 0.000101 * T)
          + Math.sin(3 * M2) * 0.000289;
    var om = (125.04 - 1934.136 * T) * RAD;
    var lam = (L0 + C - 0.00569 - 0.00478 * Math.sin(om)) * RAD;
    var eps = (23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60
              + 0.00256 * Math.cos(om)) * RAD;
    var ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
    var dec = Math.asin(Math.sin(eps) * Math.sin(lam));
    var gmst = (280.46061837 + 360.98564736629 * (jd - 2451545.0)) % 360;
    var ha = gmst * RAD + lon * RAD - ra, phi = lat * RAD;
    var alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(ha)) * DEG;
    var az = Math.atan2(-Math.sin(ha) * Math.cos(dec),
                        Math.cos(phi) * Math.sin(dec) - Math.sin(phi) * Math.cos(dec) * Math.cos(ha)) * DEG;
    return [alt + REFR, ((az % 360) + 360) % 360];
  }

  function span(p) { return (p.p.length - 1) * STEP; }
  function ridge(p, az) {
    var i = (az - p.a0) / STEP;
    if (i < 0 || i >= p.p.length - 1) return { h: -0.09, sea: true, e: 0, pct: null };
    var j = Math.floor(i), t = i - j;
    return {
      h: (p.p[j] * (1 - t) + p.p[j + 1] * t) / 1000,
      sea: false, e: p.e[t < 0.5 ? j : j + 1],
      pct: (az - p.a0) / span(p) * 100
    };
  }
  function bandOf(pct) {
    if (pct == null) return [SEA[0], SEA[1], -1];
    for (var i = 0; i < BANDS.length; i++) if (pct < BANDS[i][0]) return [BANDS[i][1], BANDS[i][2], i];
    var L = BANDS.length - 1; return [BANDS[L][1], BANDS[L][2], L];
  }

  var NS = 22;
  function fraction(p, alt, az) {
    var inside = 0, above = 0;
    for (var i = 0; i < NS; i++) {
      var dx = (-1 + 2 * (i + 0.5) / NS) * R;
      var half = Math.sqrt(Math.max(R * R - dx * dx, 0));
      if (half <= 0) continue;
      var rg = ridge(p, az + dx).h;
      for (var j = 0; j < NS; j++) { inside++; if (alt + (-1 + 2 * (j + 0.5) / NS) * half > rg) above++; }
    }
    return inside ? above / inside * 100 : 0;
  }
  function probe(p, y, mo, d, s) {
    var r = sunAltAz(y, mo, d, s / 3600, p.la, p.lo), gap = -9, bAz = null;
    for (var k = -11; k <= 11; k++) {
      var dx = k * R / 11;
      var top = r[0] + Math.sqrt(Math.max(R * R - dx * dx, 0));
      var rg = ridge(p, r[1] + dx).h;
      if (top - rg > gap) { gap = top - rg; bAz = r[1] + dx; }
    }
    return { alt: r[0], gap: gap, bAz: bAz };
  }
  function firstLight(p, y, mo, d) {
    for (var s = 4 * 3600; s <= 8 * 3600; s += 20) {
      var q = probe(p, y, mo, d, s);
      if (q.alt < -2) continue;
      if (q.gap >= 0) {
        for (var s2 = s - 20; s2 <= s; s2 += 2) {
          var q2 = probe(p, y, mo, d, s2);
          if (q2.gap >= 0) { var rr = ridge(p, q2.bAz); return { t: s2, az: q2.bAz, e: rr.e, pct: rr.pct, sea: rr.sea }; }
        }
        var r0 = ridge(p, q.bAz);
        return { t: s, az: q.bAz, e: r0.e, pct: r0.pct, sea: r0.sea };
      }
      if (q.alt > 6) break;
    }
    return null;
  }
  function fullClear(p, y, mo, d, from) {
    for (var s = from; s <= from + 1800; s += 5) {
      var r = sunAltAz(y, mo, d, s / 3600, p.la, p.lo), ok = true;
      for (var k = -11; k <= 11 && ok; k++) {
        var dx = k * R / 11;
        if (r[0] - Math.sqrt(Math.max(R * R - dx * dx, 0)) < ridge(p, r[1] + dx).h) ok = false;
      }
      if (ok) return s;
    }
    return null;
  }

  /* ---------- 狀態 ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var W = 880, H = 330, SEA_Y = 268, TOP_DEG = 3.4;
  var state = { si: 0, pi: 30, y: 2026, mo: 8, d: 16, t: null, fl: null, tmin: 0, tmax: 1 };
  function site() { return SITES[state.si]; }
  function POS() { return site().pos; }
  function cur() { return POS()[state.pi]; }

  function fmt(sec) {
    sec = Math.round(sec);
    var h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function doy(y, mo, d) { return Math.round((Date.UTC(y, mo - 1, d) - Date.UTC(y, 0, 1)) / 86400000); }
  function el(tag, attrs, text) {
    var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  function view(p, sunAz) {
    var lo = p.a0, hi = p.a0 + span(p);
    var a = Math.min(lo, sunAz - 1.2), b = Math.max(hi, sunAz + 1.2);
    if (b - a < 13) { var c = (a + b) / 2; a = c - 6.5; b = c + 6.5; }
    return { a: a, b: b, k: W / (b - a) };
  }
  function X(v, az) { return (az - v.a) * v.k; }
  function Y(alt) { return SEA_Y - alt / TOP_DEG * SEA_Y; }

  function draw() {
    var p = cur();
    var sun = sunAltAz(state.y, state.mo, state.d, state.t / 3600, p.la, p.lo);
    var v = view(p, sun[1]);
    var pts = [], n = p.p.length;
    for (var i = 0; i < n; i++) pts.push(X(v, p.a0 + i * STEP).toFixed(1) + ' ' + Y(p.p[i] / 1000).toFixed(1));
    var x0 = X(v, p.a0).toFixed(1), x1 = X(v, p.a0 + span(p)).toFixed(1);
    $('ridge').setAttribute('d', 'M ' + x0 + ' ' + SEA_Y + ' L ' + pts.join(' ') + ' L ' + x1 + ' ' + SEA_Y + ' Z');
    $('ridgeclippath').setAttribute('d',
      'M -20 -20 H ' + (W + 20) + ' V ' + SEA_Y + ' L ' + x1 + ' ' + SEA_Y + ' L ' +
      pts.slice().reverse().join(' ') + ' L ' + x0 + ' ' + SEA_Y + ' L -20 ' + SEA_Y + ' Z');
    $('sealine').setAttribute('y1', SEA_Y); $('sealine').setAttribute('y2', SEA_Y);

    var tr = [];
    for (var s = state.tmin; s <= state.tmax; s += 60) {
      var r = sunAltAz(state.y, state.mo, state.d, s / 3600, p.la, p.lo);
      if (r[0] > -1.2) tr.push((tr.length ? 'L ' : 'M ') + X(v, r[1]).toFixed(1) + ' ' + Y(r[0]).toFixed(1));
    }
    $('suntrack').setAttribute('d', tr.join(' '));

    var frac = fraction(p, sun[0], sun[1]);
    var sc = $('sun');
    sc.setAttribute('cx', X(v, sun[1]).toFixed(1));
    sc.setAttribute('cy', Y(sun[0]).toFixed(1));
    sc.setAttribute('r', Math.max(R * v.k, 2).toFixed(1));
    sc.setAttribute('fill', frac > 60 ? 'var(--gold)' : 'var(--limb)');

    var mk = $('marks'); mk.textContent = '';
    [[p.sa, '401 高地', 'var(--ink)', .5], [p.ha, '龜首', 'var(--faint)', .35]].forEach(function (m) {
      if (m[0] < v.a || m[0] > v.b) return;
      var x = X(v, m[0]);
      mk.appendChild(el('line', { x1: x, y1: Y(Math.max(ridge(p, m[0]).h, 0)), x2: x, y2: 22, stroke: m[2], 'stroke-width': 1, opacity: m[3] }));
      mk.appendChild(el('text', { x: x + 5, y: 18, fill: m[2], 'font-size': 14, 'font-family': 'ui-monospace, Menlo, monospace' }, m[1]));
    });
    var tailAz = p.a0 + span(p) * 0.03;
    if (tailAz >= v.a && tailAz <= v.b) {
      var tx = X(v, tailAz);
      mk.appendChild(el('line', { x1: tx, y1: Y(Math.max(ridge(p, tailAz).h, 0)), x2: tx, y2: 40, stroke: 'var(--faint)', 'stroke-width': 1, opacity: .3 }));
      mk.appendChild(el('text', { x: tx + 5, y: 36, fill: 'var(--faint)', 'font-size': 14, 'font-family': 'ui-monospace, Menlo, monospace' }, '龜尾'));
    }

    var ax = $('axis'); ax.textContent = '';
    for (var az = Math.ceil(v.a / 2) * 2; az <= v.b; az += 2) {
      var x = X(v, az);
      if (x < 22 || x > W - 22) continue;
      ax.appendChild(el('line', { x1: x, y1: SEA_Y, x2: x, y2: SEA_Y + 7, stroke: 'var(--faint)', 'stroke-width': 1, opacity: .6 }));
      ax.appendChild(el('text', { x: x, y: SEA_Y + 24, fill: 'var(--faint)', 'font-size': 14, 'text-anchor': 'middle', 'font-family': 'ui-monospace, Menlo, monospace' }, az + '°'));
    }
    ax.appendChild(el('text', { x: W - 4, y: H - 6, fill: 'var(--faint)', 'font-size': 13, 'text-anchor': 'end', 'font-family': 'ui-monospace, Menlo, monospace' }, '真北方位角'));
    readout(p, sun, frac);
  }

  function readout(p, sun, frac) {
    var fl = state.fl, rows = [];
    if (fl) {
      var b = bandOf(fl.sea ? null : fl.pct);
      rows.push(['首光時刻', fmt(fl.t),
        fl.sea ? '從開闊海面升起，島不在日出方位上'
               : '從「' + b[0] + '」冒出，海拔 ' + fl.e + ' m，剪影 ' + fl.pct.toFixed(0) + '% 處']);
      if (fl.full != null) rows.push(['整顆脫離', fmt(fl.full), '從首光算起 ' + Math.round(fl.full - fl.t) + ' 秒']);
      rows.push(['首光方位', fl.az.toFixed(2) + '°',
        '主峰在 ' + p.sa.toFixed(2) + '°，差 ' + (fl.az - p.sa >= 0 ? '+' : '') + (fl.az - p.sa).toFixed(2) + '°']);
    } else {
      rows.push(['首光時刻', '—', '這一天在掃描區間內算不出來']);
    }
    rows.push(['此刻太陽', sun[1].toFixed(2) + '° / ' + sun[0].toFixed(2) + '°', '方位 / 高度 · 日面露出 ' + frac.toFixed(0) + '%']);
    rows.push(['站位', p.la.toFixed(6) + ', ' + p.lo.toFixed(6),
      (p.o === 0 ? site().n + '（基準點）' : (p.o > 0 ? '往北 ' + p.o : '往南 ' + (-p.o)) + ' 公尺') + ' · 主峰距離 ' + p.sd + ' km']);
    rows.push(['空拍機', p.nz == null ? '不在 RCR30 範圍' : (p.nz > 0 ? '區外' : '⛔ RCR30 內'),
      p.nz == null ? '這個緯度沒有 RCR30' : (p.nz > 0 ? '正東 ' + p.nz + ' 公尺到邊界' : '禁止起飛，罰 30–150 萬')]);
    $('readout').innerHTML = rows.map(function (r) {
      return '<div class="ro"><span class="label">' + r[0] + '</span><span class="rv">' +
             r[1] + '</span><span class="rn">' + r[2] + '</span></div>';
    }).join('');

    var vd = $('verdict');
    if (!fl) { vd.textContent = '這一天算不出首光'; vd.className = 'verdict'; }
    else if (fl.sea) { vd.textContent = '太陽從開闊海面升起 · 龜山島不在日出方位上'; vd.className = 'verdict off'; }
    else { vd.textContent = '太陽從「' + bandOf(fl.pct)[0] + '」升起 · ' + fmt(fl.t); vd.className = 'verdict on'; }
  }

  function recompute(keepTime) {
    var p = cur();
    var fl = firstLight(p, state.y, state.mo, state.d);
    if (fl) fl.full = fullClear(p, state.y, state.mo, state.d, fl.t);
    state.fl = fl;
    var anchor = fl ? fl.t : 5.5 * 3600;
    state.tmin = anchor - 900; state.tmax = anchor + 900;
    if (!keepTime || state.t == null || state.t < state.tmin || state.t > state.tmax)
      state.t = fl ? fl.t + 50 : anchor;
    $('timeinput').value = Math.round((state.t - state.tmin) / (state.tmax - state.tmin) * 1000);
    labels(); draw(); heat();
  }
  function labels() {
    var p = cur();
    $('posval').textContent = p.o === 0 ? '基準點' : (p.o > 0 ? '北 +' + p.o + ' m' : '南 ' + p.o + ' m');
    $('poscoord').textContent = p.la.toFixed(5) + ', ' + p.lo.toFixed(5);
    $('timeval').textContent = fmt(state.t);
    $('dateval').textContent = state.y + '-' + (state.mo < 10 ? '0' : '') + state.mo + '-' + (state.d < 10 ? '0' : '') + state.d;
  }

  /* ---------- 地點切換 ---------- */
  $('sitechips').innerHTML = SITES.map(function (s, i) {
    return '<button type="button" class="chip site' + (i === 0 ? ' on' : '') + '" data-i="' + i + '">' + s.n + '</button>';
  }).join('');
  $('sitechips').addEventListener('click', function (e) {
    var b = e.target.closest('.site'); if (!b) return;
    state.si = +b.dataset.i;
    [].forEach.call(this.querySelectorAll('.site'), function (x, i) { x.classList.toggle('on', i === state.si); });
    state.pi = Math.floor(POS().length / 2);
    $('posinput').max = POS().length - 1;
    $('posinput').value = state.pi;
    $('solvenote').textContent = '';
    recompute(false);
  });

  /* ---------- 控制項 ---------- */
  $('timeinput').max = 1000;
  $('posinput').max = POS().length - 1;
  $('posinput').value = state.pi;
  $('posinput').addEventListener('input', function () { state.pi = +this.value; recompute(false); });
  $('timeinput').addEventListener('input', function () {
    state.t = state.tmin + (+this.value) / 1000 * (state.tmax - state.tmin);
    labels(); draw();
  });
  $('dateinput').addEventListener('change', function () {
    var v = this.value.split('-'); if (v.length !== 3) return;
    state.y = +v[0]; state.mo = +v[1]; state.d = +v[2]; recompute(false);
  });
  $('jumpfirst').addEventListener('click', function () { if (state.fl) { state.t = state.fl.t; recompute(true); } });

  var playing = null;
  $('playbtn').addEventListener('click', function () {
    var btn = this;
    if (playing) { clearInterval(playing); playing = null; btn.textContent = '播放'; return; }
    btn.textContent = '暫停';
    playing = setInterval(function () {
      state.t += 8;
      if (state.t > state.tmax) state.t = state.tmin;
      $('timeinput').value = Math.round((state.t - state.tmin) / (state.tmax - state.tmin) * 1000);
      labels(); draw();
    }, 60);
  });

  var chips = [['明天 8/16', 2026, 8, 16], ['9/1', 2026, 9, 1], ['秋分 9/23', 2026, 9, 23],
               ['冬至 12/21', 2026, 12, 21], ['春分 3/20', 2027, 3, 20], ['夏至 6/21', 2026, 6, 21]];
  $('datechips').innerHTML = chips.map(function (c, i) {
    return '<button type="button" class="chip" data-i="' + i + '">' + c[0] + '</button>';
  }).join('');
  $('datechips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var c = chips[+b.dataset.i];
    state.y = c[1]; state.mo = c[2]; state.d = c[3];
    $('dateinput').value = c[1] + '-' + (c[2] < 10 ? '0' : '') + c[2] + '-' + (c[3] < 10 ? '0' : '') + c[3];
    recompute(false);
  });

  /* ---------- 解題 ---------- */
  document.querySelector('.solve').addEventListener('click', function (e) {
    var b = e.target.closest('.solvep'); if (!b) return;
    var want = +b.dataset.z, hits = [], P = POS();
    for (var i = 0; i < P.length; i++) {
      var fl = firstLight(P[i], state.y, state.mo, state.d);
      if (fl && !fl.sea && bandOf(fl.pct)[2] === want) hits.push({ i: i, fl: fl });
    }
    if (!hits.length) {
      $('solvenote').textContent = '在「' + site().n + '」南北 ±1.5 公里內，' + state.mo + '/' + state.d +
        ' 這天沒有任何位置能讓太陽從「' + BANDS[want][1] + '」升起。看下面的熱圖找可行的日期。';
      return;
    }
    var mid = hits.reduce(function (a, x) { return Math.abs(P[x.i].o) < Math.abs(P[a.i].o) ? x : a; });
    state.pi = mid.i; $('posinput').value = mid.i;
    recompute(false);
    var os = hits.map(function (x) { return P[x.i].o; });
    $('solvenote').textContent = '找到了：' + P[mid.i].la.toFixed(6) + ', ' + P[mid.i].lo.toFixed(6) +
      '（' + (P[mid.i].o === 0 ? '就在基準點' : (P[mid.i].o > 0 ? '往北 ' + P[mid.i].o : '往南 ' + (-P[mid.i].o)) + ' 公尺') +
      '），首光 ' + fmt(mid.fl.t) + '。可用區間 ' + Math.min.apply(null, os) + ' ~ ' + Math.max.apply(null, os) + ' 公尺。';
  });

  /* ---------- 年度熱圖（365 天 × 61 個位置，離線預算） ---------- */
  var SCV = $('stripcv'), SCTX = SCV.getContext('2d');

  /* 窄色帶＝熱圖的第 pi 列，單獨放大畫一次，比整張熱圖好讀 */
  function strip() {
    var m = HM[site().k], cols = m.cols, row = state.pi;
    SCV.width = cols * 2; SCV.height = 34;
    var cw = 2, counts = {};
    for (var c = 0; c < cols; c++) {
      var ch = m.b[row * cols + c];
      var col = ch === '.' ? SEA[1] : BANDS[+ch][2];
      var nm = ch === '.' ? SEA[0] : BANDS[+ch][1];
      counts[nm] = (counts[nm] || 0) + 1;
      SCTX.fillStyle = col;
      SCTX.fillRect(c * cw, 0, cw + 0.6, SCV.height);
    }
    SCTX.strokeStyle = 'rgba(0,0,0,.5)'; SCTX.lineWidth = 1;
    for (var mo = 1; mo < 12; mo++) {
      var x = doy(2026, mo + 1, 1) * cw;
      SCTX.beginPath(); SCTX.moveTo(x, 0); SCTX.lineTo(x, SCV.height); SCTX.stroke();
    }
    var cx = doy(state.y, state.mo, state.d) * cw + cw / 2;
    SCTX.strokeStyle = '#FFE9BC'; SCTX.lineWidth = 2;
    SCTX.beginPath(); SCTX.moveTo(cx, 0); SCTX.lineTo(cx, SCV.height); SCTX.stroke();

    var p = cur();
    $('stripval').textContent = p.o === 0 ? '基準點' : (p.o > 0 ? '北 +' + p.o + ' m' : '南 ' + p.o + ' m');
    var order = BANDS.map(function (b) { return [b[1], b[2]]; }).concat([SEA]);
    $('striplegend').innerHTML = order.filter(function (o) { return counts[o[0]]; }).map(function (o) {
      return '<span class="lg"><i style="background:' + o[1] + '"></i>' + o[0] + ' ' + counts[o[0]] + ' 天</span>';
    }).join('');
  }
  SCV.addEventListener('click', function (e) {
    var m = HM[site().k], b = SCV.getBoundingClientRect();
    var c = Math.max(0, Math.min(m.cols - 1, Math.floor((e.clientX - b.left) / b.width * m.cols)));
    var dt = new Date(Date.UTC(2026, 0, 1 + c));
    state.y = dt.getUTCFullYear(); state.mo = dt.getUTCMonth() + 1; state.d = dt.getUTCDate();
    $('dateinput').value = state.y + '-' + (state.mo < 10 ? '0' : '') + state.mo + '-' + (state.d < 10 ? '0' : '') + state.d;
    recompute(false);
  });
  function decT(m, idx) {
    var a = C36.indexOf(m.t[idx * 2]), b2 = C36.indexOf(m.t[idx * 2 + 1]);
    if (a < 0 || b2 < 0) return null;
    var v = a * 36 + b2; return v >= 1295 ? null : (v + 240) * 60;
  }
  /* 全年統計：這個地點在 ±1.5 km 內，龜尾／龜首各有幾天做得到 */
  function heat() {
    var m = HM[site().k], rows = m.rows, cols = m.cols;
    var days = { 0: {}, 5: {} };
    for (var r = 0; r < rows; r++)
      for (var c = 0; c < cols; c++) {
        var v = m.b[r * cols + c];
        if (v === '0') days[0][c] = 1;
        if (v === '5') days[5][c] = 1;
      }
    var f0 = Object.keys(days[0]).length, f5 = Object.keys(days[5]).length;
    $('heatnote').innerHTML = '把範圍放寬到「' + site().n + '」南北各 1.5 公里都能站，' +
      '<strong>龜尾</strong>全年 ' + (f0 ? f0 + ' 天' : '<em>沒有任何一天</em>') +
      '、<strong>龜首</strong>全年 ' + (f5 ? f5 + ' 天' : '<em>沒有任何一天</em>') +
      '做得到。用上面「幫我找」那三顆鈕，會直接把你放到該站的位置。';
    strip();
  }

  recompute(false);
})();
</script>
<script>
(function(){
  function send(){
    var h=document.documentElement.scrollHeight;
    parent.postMessage({gsLabHeight:h},'*');
  }
  window.addEventListener('load',send);
  new ResizeObserver(send).observe(document.body);
  setInterval(send,1200);
})();
</script>
