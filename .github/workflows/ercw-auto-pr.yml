name: ER Cardio Weekly auto PR

# 雲端 routine 把週報草稿推到 claude/ercw-YYYY-WNN 分支 → 自動對 hugo-source 開 PR，
# Bear 審稿後手動合併才會上線（合併進 hugo-source 才觸發 hugo.yaml 部署）。
on:
  push:
    branches:
      - "claude/ercw-*"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then echo "PR #$existing already open"; exit 0; fi
          week="${BRANCH#claude/ercw-}"
          gh pr create -R "$REPO" --base hugo-source --head "$BRANCH" \
            --title "ER Cardio Weekly ${week}（待審）" \
            --body "雲端 routine 產出的週報草稿。查證表與檢查結果見 commit／routine 回報；審過再合併，合併即上線。"
