name: ER Cardio Weekly auto PR

# 雲端 routine 把週報草稿推到 claude/ercw-YYYY-WNN 分支 → 自動對 hugo-source 開 PR。
# 若分支最新 commit 訊息含 [ercw-verified]（routine 的獨立查核代理通過才會加）→ 自動合併並觸發部署；
# 沒有這個標記 → PR 留著等 Bear 看。
# 注意：GITHUB_TOKEN 合併產生的 push 不會觸發 hugo.yaml，所以合併後要用 workflow_dispatch 手動觸發部署。
# 失敗與異常不再推 LINE：run 以 exit 1 轉紅，並寫 ::error:: 與 step summary，交給每小時掃紅 run 的 monitor。
# 「已上線」不再推 LINE。此 repo 的 workflow 沒有 Supabase service-role secret，
# 所以不寫 public.grokbot_notifications；同一段文字寫進 step summary，並送
# ::notice title=GROKBOT ercw-live::（這則通知不會讓 job 失敗）。
on:
  push:
    branches:
      - "claude/ercw-*"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ercw-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      HEAD_MSG: ${{ github.event.head_commit.message }}
    steps:
      - name: Define report helper
        run: |
          # report_problem 給沒上線與查核沒過：不推 LINE，寫 error annotation 與 step summary 後 exit 1。
          cat > "$RUNNER_TEMP/line.sh" <<'SH'
          report_problem() {
            local msg="$1"
            local safe="$1"
            # workflow command 不能含未跳脫的 %、CR、LF。先跳脫 %，避免後面的 %0A 被再跳一次。
            safe=${safe//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            printf '%s\n' "$msg"
            echo "::error::${safe}"
            printf '%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          SH

      - name: Open PR if none exists
        run: |
          existing=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$existing" ] && [ "$(gh api "repos/$REPO/compare/hugo-source...$BRANCH" -q .ahead_by)" != "0" ]; then
            week="${BRANCH#claude/ercw-}"
            gh pr create -R "$REPO" --base hugo-source --head "$BRANCH" \
              --title "ER Cardio Weekly ${week}" \
              --body "雲端 routine 產出的週報。帶 [ercw-verified] 標記時會自動合併上線；沒有標記代表查核未過，等 Bear 處理。"
          fi

      - name: Auto-merge and deploy when verified
        if: contains(env.HEAD_MSG, '[ercw-verified]')
        run: |
          gh pr merge -R "$REPO" "$BRANCH" --merge --delete-branch
          gh workflow run hugo.yaml -R "$REPO" --ref hugo-source
          echo "merged $BRANCH and dispatched deploy"

      - name: Wait until live, then notify
        if: contains(env.HEAD_MSG, '[ercw-verified]')
        run: |
          . "$RUNNER_TEMP/line.sh"
          week="${BRANCH#claude/ercw-}"
          url="https://agoodbear.com/er-cardio-weekly/$(echo "$week" | tr 'A-Z' 'a-z')/"
          code=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url?v=$(date +%s)")
            [ "$code" = 200 ] && break
            sleep 30
          done
          if [ "$code" = 200 ]; then
            # 已上線。workflow 沒有 Supabase service-role secret，不新增 secret、不寫 grokbot_notifications。
            text="✅ ER Cardio Weekly ${week} 已上線（獨立查核通過、自動發布）\n${url}"
            msg=$(printf '%b' "$text")
            {
              echo "## ER Cardio Weekly 已上線"
              echo
              printf '%s\n' "$msg"
              echo
              echo "沒有寫入 public.grokbot_notifications：此 repo 的 workflow 沒有 Supabase service-role secret。"
              echo "已改送 ::notice title=GROKBOT ercw-live::。"
            } >> "$GITHUB_STEP_SUMMARY"
            notice=$(printf '✅ ER Cardio Weekly %s 已上線（獨立查核通過、自動發布） %s' "$week" "$url")
            # workflow command 不能含未跳脫的 %、CR、LF
            notice=${notice//'%'/'%25'}
            notice=${notice//$'\r'/'%0D'}
            notice=${notice//$'\n'/'%0A'}
            echo "::notice title=GROKBOT ercw-live::${notice}"
          else
            text="⚠️ ER Cardio Weekly ${week} 已合併但網頁 20 分鐘內沒上線（HTTP ${code}）\n請看部署：https://github.com/${REPO}/actions\n👉 回覆「cc 修 週報」我重新部署"
            msg=$(printf '%b' "$text")
            report_problem "$msg"
          fi

      - name: Fail run when verification did not pass
        if: ${{ !contains(env.HEAD_MSG, '[ercw-verified]') }}
        run: |
          . "$RUNNER_TEMP/line.sh"
          week="${BRANCH#claude/ercw-}"
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json url -q '.[0].url')
          text="⚠️ ER Cardio Weekly ${week} 查核沒過，沒有上線\n卡在哪看 PR 內文：${pr:-https://github.com/${REPO}/pulls}\n👉 這是查核故意擋的，不能遠端硬上；回電腦跟我說「看週報 PR」"
          msg=$(printf '%b' "$text")
          # 查核沒過仍把同一段說明留在 PR，不再推 LINE。
          if [ -n "$pr" ]; then
            printf '%s\n' "$msg" > "$RUNNER_TEMP/verify_comment.txt"
            gh pr comment -R "$REPO" "$BRANCH" --body-file "$RUNNER_TEMP/verify_comment.txt" || true
          fi
          report_problem "$msg"
