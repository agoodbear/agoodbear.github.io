name: ER Cardio Weekly auto PR

# 雲端 routine 把週報草稿推到 claude/ercw-YYYY-WNN 分支 → 自動對 hugo-source 開 PR。
# 若分支最新 commit 訊息含 [ercw-verified]（routine 的獨立查核代理通過才會加）→ 自動合併並觸發部署；
# 沒有這個標記 → PR 留著等 Bear 看。
# 注意：GITHUB_TOKEN 合併產生的 push 不會觸發 hugo.yaml，所以合併後要用 workflow_dispatch 手動觸發部署。
on:
  push:
    branches:
      - "claude/ercw-*"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ercw-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      HEAD_MSG: ${{ github.event.head_commit.message }}
    steps:
      - name: Define LINE helper
        run: |
          # LINE 失敗不再無聲：印出 HTTP 狀態與回應、在 PR 留言、job summary 標紅，並讓 job 失敗
          cat > "$RUNNER_TEMP/line.sh" <<'SH'
          line_send() {
            body=$(jq -n --arg to "$LINE_TO" --arg t "$1" '{to:$to,messages:[{type:"text",text:$t}]}')
            code=$(curl -s -o "$RUNNER_TEMP/line_resp.txt" -w '%{http_code}' -X POST https://api.line.me/v2/bot/message/push \
              -H "Authorization: Bearer $LINE_TOKEN" -H 'Content-Type: application/json' -d "$body")
            if [ "$code" = 200 ]; then echo "LINE sent"; return 0; fi
            resp=$(head -c 500 "$RUNNER_TEMP/line_resp.txt")
            echo "::error::LINE 推播失敗 HTTP ${code}：${resp}"
            printf '## ⚠️ LINE 推播失敗\nHTTP %s\n```\n%s\n```\n原本要送的訊息：\n\n%s\n' "$code" "$resp" "$1" >> "$GITHUB_STEP_SUMMARY"
            gh pr comment -R "$REPO" "$BRANCH" --body "⚠️ LINE 推播失敗（HTTP ${code}：${resp}），Bear 沒收到通知。原本要送的訊息：
          $1" || true
            return 1
          }
          SH

      - name: Open PR if none exists
        run: |
          existing=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$existing" ] && [ "$(gh api "repos/$REPO/compare/hugo-source...$BRANCH" -q .ahead_by)" != "0" ]; then
            week="${BRANCH#claude/ercw-}"
            gh pr create -R "$REPO" --base hugo-source --head "$BRANCH" \
              --title "ER Cardio Weekly ${week}" \
              --body "雲端 routine 產出的週報。帶 [ercw-verified] 標記時會自動合併上線；沒有標記代表查核未過，等 Bear 處理。"
          fi

      - name: Auto-merge and deploy when verified
        if: contains(env.HEAD_MSG, '[ercw-verified]')
        run: |
          gh pr merge -R "$REPO" "$BRANCH" --merge --delete-branch
          gh workflow run hugo.yaml -R "$REPO" --ref hugo-source
          echo "merged $BRANCH and dispatched deploy"

      - name: Wait until live, then LINE Bear
        if: contains(env.HEAD_MSG, '[ercw-verified]')
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO_BEAR }}
        run: |
          . "$RUNNER_TEMP/line.sh"
          week="${BRANCH#claude/ercw-}"
          url="https://agoodbear.com/er-cardio-weekly/$(echo "$week" | tr 'A-Z' 'a-z')/"
          code=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url?v=$(date +%s)")
            [ "$code" = 200 ] && break
            sleep 30
          done
          if [ "$code" = 200 ]; then
            text="✅ ER Cardio Weekly ${week} 已上線（獨立查核通過、自動發布）\n${url}"
          else
            text="⚠️ ER Cardio Weekly ${week} 已合併但網頁 20 分鐘內沒上線（HTTP ${code}）\n請看部署：https://github.com/${REPO}/actions\n👉 回覆「cc 修 週報」我重新部署"
          fi
          line_send "$(printf "$text")"

      - name: LINE Bear when verification failed
        if: ${{ !contains(env.HEAD_MSG, '[ercw-verified]') }}
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO_BEAR }}
        run: |
          . "$RUNNER_TEMP/line.sh"
          week="${BRANCH#claude/ercw-}"
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json url -q '.[0].url')
          text="⚠️ ER Cardio Weekly ${week} 查核沒過，沒有上線\n卡在哪看 PR 內文：${pr:-https://github.com/${REPO}/pulls}\n👉 這是查核故意擋的，不能遠端硬上；回電腦跟我說「看週報 PR」"
          line_send "$(printf "$text")"
